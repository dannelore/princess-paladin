<title>Quest Log · Paladin</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="/dannelore/quest-log/?who=brendon">
<meta name="robots" content="noindex">
<script>
  /* Brendon's log is the same set of files with a different document behind
     it. This exists only so he has a clean path to bookmark — everything
     after the redirect is the real page.

     Anything after the "?" on this page is carried through, so
     /vmprman/quest-log/?date=2026-09-01 still works. */
  (function(){
    var extra = location.search ? location.search.slice(1) + '&' : '';
    location.replace('/dannelore/quest-log/?' + extra + 'who=brendon');
  })();
</script>
<style>
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:'Jost',sans-serif; color:#E5C79A;
    background:linear-gradient(135deg,#7C1F2A 0%,#5A1720 100%);
  }
  p{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:18px; }
  a{ color:#C9A227; }
</style>
</head>
<body>
  <p>Opening the Paladin's quest log&hellip;
