<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch History &middot; Side Quests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/pp.css">
<link rel="stylesheet" href="/assets/pp-tracker.css">

<style>
  /* ======================================================================
     WATCH HISTORY

     One chronological record of everything you've finished, drawn from BOTH
     trackers at once — sidequest/couch-list and sidequest/spooky-list. It
     reads those two documents and writes to neither; editing still happens on
     the tracker the title lives on, and every row links back to it.

     A series contributes one row PER SEASON, because a season is the thing
     that actually has a finish date on it. A film contributes one row.
     Anything with no date at all can't be placed on the spine, so it collects
     under "Date not recorded" at the bottom rather than disappearing.
     ====================================================================== */

  .wh-intro{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 1.02rem;
    color: var(--ink-soft);
    text-align: center;
    max-width: 640px;
    margin: 0 auto 24px;
    line-height: 1.5;
  }

  /* ---- summary strip ---- */
  .wh-stats{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }
  .wh-stat{ text-align: center; padding: 16px 12px; }
  .wh-stat b{
    display: block;
    font-family: var(--font-serif);
    font-size: 1.9rem;
    font-weight: 600;
    line-height: 1.1;
    color: var(--dusk-deep);
  }
  .wh-stat span{
    font-family: var(--font-body);
    font-size: 0.64rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .wh-stat.spooky b{ color: var(--pumpkin-deep); }

  /* ---- year and month headings ---- */
  .wh-year{
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 34px 0 4px;
  }
  .wh-year:first-child{ margin-top: 6px; }
  .wh-year h2{
    margin: 0;
    font-family: var(--font-serif);
    font-size: 1.75rem;
    font-weight: 600;
    color: var(--dusk-deep);
  }
  .wh-year .rule{ flex: 1 1 auto; height: 1px; background: var(--line-gold); }
  .wh-year .n{
    font-family: var(--font-body);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .wh-year.undated h2{ font-size: 1.3rem; font-style: italic; color: var(--ink-soft); }

  .wh-month{
    font-family: var(--font-body);
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 20px 0 10px;
  }

  /* ---- the grid ----
     Five across, as asked. It steps down on narrower screens rather than
     squeezing five postage stamps onto a phone. */
  .wh-grid{
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 6px;
  }
  @media (max-width: 900px){ .wh-grid{ grid-template-columns: repeat(4, minmax(0,1fr)); } }
  @media (max-width: 700px){ .wh-grid{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
  @media (max-width: 480px){ .wh-grid{ grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; } }

  .wh-card{
    display: flex;
    flex-direction: column;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    box-shadow: var(--lift);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .wh-card:hover,
  .wh-card:focus-visible{
    transform: translateY(-3px);
    box-shadow: var(--lift-lg);
    border-color: var(--dusk);
    text-decoration: none;
  }
  /* A spooky-season watch is bordered in pumpkin as well as badged, so the
     October rows read as a block from across the page. */
  .wh-card.is-spooky{ border-color: rgba(201,106,46,.55); }
  .wh-card.is-spooky:hover{ border-color: var(--pumpkin); }

  .wh-postwrap{ position: relative; }
  .wh-poster{
    display: block;
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    background: var(--parchment);
  }
  .wh-noposter{
    aspect-ratio: 2/3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    text-align: center;
    background: radial-gradient(ellipse at 30% 25%, rgba(156,116,64,.14), transparent 60%), var(--parchment);
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .9rem;
    line-height: 1.25;
    color: var(--gold-deep);
  }

  /* Corner pumpkin. Sits on the poster so it survives a long title. */
  .wh-pumpkin{
    position: absolute;
    top: 6px; left: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px; height: 24px;
    font-size: .82rem;
    line-height: 1;
    background: var(--pumpkin);
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(46,36,31,.35);
  }
  /* A rewatch takes the same corner as the tradition badge — a rewatch of a
     tradition is the more specific fact, so it wins the spot. */
  .wh-again{
    position: absolute;
    top: 6px; right: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    font-size: .9rem;
    line-height: 1;
    color: var(--dusk-deep);
    background: rgba(255,253,248,.94);
    border: 1px solid var(--line-strong);
    border-radius: 50%;
  }

  .wh-trad{
    position: absolute;
    top: 6px; right: 6px;
    font-family: var(--font-body);
    font-size: .54rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--gold-deep);
    background: rgba(255,253,248,.94);
    border: 1px solid var(--parchment-border);
    border-radius: 999px;
    padding: 2px 7px;
  }

  /* The day sits on the poster's foot, so scanning down a month reads as a
     sequence of dates without the card growing another line. */
  .wh-day{
    position: absolute;
    bottom: 6px; right: 6px;
    font-family: var(--font-body);
    font-size: .6rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink);
    background: rgba(255,253,248,.92);
    border-radius: 999px;
    padding: 2px 8px;
  }

  .wh-cardbody{ padding: 9px 10px 11px; display: flex; flex-direction: column; gap: 3px; }
  .wh-title{
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: .95rem;
    line-height: 1.2;
    margin: 0;
    color: var(--ink);
    word-break: break-word;
  }
  .wh-sub{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .8rem;
    line-height: 1.25;
    color: var(--ink-soft);
    margin: 0;
  }

  .wh-state{
    text-align: center;
    padding: 40px 20px;
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--ink-soft);
  }

  @media (max-width: 560px){
    .wh-poster{ width: 42px; }
    .wh-row{ padding-left: 20px; gap: 10px; }
    .wh-month{ margin-left: 20px; }
  }
</style>
</head>

<body class="pp-sidequest" data-nav-eyebrow="Side Quests" data-nav-title="Watch History">

<div class="pp-wrap">

  <div class="pp-page-title">
    <h2>Watch History</h2>
  </div>

  <p class="wh-intro">
    Everything the two of you have finished, in the order you finished it.
    Couch Quest and Spooky Quest both feed this page &mdash; anything watched off
    the spooky list carries a pumpkin. A title on both lists appears once.
  </p>

  <div class="wh-stats" id="stats"></div>

  <div class="cq-selects">
    <div class="cq-pick">
      <label for="fSource">List</label>
      <select id="fSource">
        <option value="all">Both lists</option>
        <option value="couch">Couch Quest</option>
        <option value="spooky">Spooky Quest</option>
      </select>
    </div>
    <div class="cq-pick">
      <label for="fWho">Who</label>
      <select id="fWho">
        <option value="all">Anyone</option>
        <option value="together">Together</option>
        <option value="danni">D only</option>
        <option value="brendon">B only</option>
        <option value="family">Family</option>
      </select>
    </div>
    <div class="cq-pick">
      <label for="fYear">Year</label>
      <select id="fYear"><option value="all">Any year</option></select>
    </div>
    <button class="cq-reset" id="reset">Clear filters</button>
    <span class="cq-spacer"></span>
    <span class="cq-count" id="count"></span>
  </div>

  <div id="timeline"><p class="wh-state" id="state">Reading both lists&hellip;</p></div>

  <footer class="pp-footer">
    <p class="pp-footer-flourish">&#9813; &mdash;&mdash;&mdash;&mdash; &#9876; &mdash;&mdash;&mdash;&mdash; &#9813;</p>
    <p class="pp-footer-estab">Princess &amp; Paladin</p>
    <p>Est. 2021</p>
  </footer>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyAdNZBoh1pH80-ZFBbOlcrlsLdMi3D62Wg",
  authDomain: "princess-paladin.firebaseapp.com",
  projectId: "princess-paladin",
  storageBucket: "princess-paladin.appspot.com",
  messagingSenderId: "282931655557",
  appId: "1:282931655557:web:cae6ccd23f32cb9be54aec"
};

/* The two trackers this page reads. Adding a third watch list later means
   adding a line here and nothing else. */
const SOURCES = [
  { key:"couch",  label:"Couch Quest",  doc:"sidequest/couch-list",
    page:"/side-quests/couch-quest.html",  cache:"pp_couch_list",  spooky:false },
  { key:"spooky", label:"Spooky Quest", doc:"sidequest/spooky-list",
    page:"/side-quests/spooky-quest.html", cache:"pp_spooky_list", spooky:true  }
];

const WHO_LABEL = { together:"Together", danni:"D only", brendon:"B only", family:"Family" };
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

let entries = [];
let fSource = "all", fWho = "all", fYear = "all";

/* ---------------- dates ----------------
   Dates are stored as plain YYYY-MM-DD strings. Parsing one with `new Date()`
   treats it as UTC and can shift it a day backwards in our timezone, so it's
   split by hand instead. */
function parts(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d || ""));
  return m ? { y:+m[1], m:+m[2], d:+m[3] } : null;
}
function fmtDate(d){
  const p = parts(d);
  return p ? `${p.d} ${MONTHS[p.m-1].slice(0,3)} ${p.y}` : "";
}

/* ---------------- building the list ----------------
   A film is one row. A series is one row per season, because the season is
   what carries a finish date. Prefer the date you FINISHED on; fall back to
   the start date and say so, rather than dropping the row. */
function rowsFor(item, source){
  const base = {
    source: source.key,
    sourceLabel: source.label,
    page: source.page,
    spooky: source.spooky,
    title: item.title || "Untitled",
    image: item.image || "",
    who: item.who || "together",
    tradition: !!item.tradition,
    id: item.id
  };

  /* Every viewing after the first is its own row, dated when it happened —
     that's the whole point of a chronology. They're marked so a rewatch never
     reads as a first watch. */
  const again = (item.rewatches || []).filter(Boolean).map(d => Object.assign({}, base, {
    unit: item.type === "movie" ? "Film" : "Rewatch",
    date: d,
    started: false,
    again: true
  }));

  if(item.type === "movie" || !Array.isArray(item.seasons) || !item.seasons.length){
    if(item.status !== "watched") return again;
    return [Object.assign({}, base, {
      unit: item.type === "movie" ? "Film" : "",
      date: item.endDate || item.startDate || "",
      started: !item.endDate && !!item.startDate
    })].concat(again);
  }

  const out = again.slice();
  item.seasons.forEach(s => {
    /* A season counts as watched when every episode is ticked, or when the
       whole title is marked watched and the season has a finish date on it. */
    const total = s.episodes || 0;
    const seen  = Array.isArray(s.watched) ? s.watched.length : (s.watchedCount || 0);
    const done  = (total > 0 && seen >= total) || (item.status === "watched" && s.endDate);
    if(!done) return;
    out.push(Object.assign({}, base, {
      unit: "Season " + (s.number != null ? s.number : "?"),
      date: s.endDate || s.startDate || "",
      started: !s.endDate && !!s.startDate
    }));
  });
  return out;
}

/* ---------------- de-duplication ----------------
   A title can sit on both lists — a horror series you're working through on
   Couch Quest that also gets pulled onto the spooky list, say. That's one
   thing you watched once, so it gets one card.

   Matching is on title + unit, so Season 1 and Season 2 stay separate while
   the same season on two lists collapses. Rather than picking a winner and
   throwing the other away, the two are merged: the card is marked spooky if
   EITHER list is the spooky one, it names both lists underneath, and it keeps
   the earlier finish date — the first time you actually got to the end of it. */
function dedupeKey(e){
  /* The date is part of the key for rewatches, so two viewings of the same
     film stay two rows while the same season on two lists still collapses. */
  return e.title.trim().toLowerCase().replace(/\s+/g, " ") + "|" + (e.unit || "") +
         (e.again ? "|" + e.date : "");
}

function merge(a, b){
  const spookySide = a.spooky ? a : b;
  const dated = [a, b].filter(x => x.date);

  /* Earliest real date wins; a "started" date only stands in if neither has a
     finish date. */
  let keep = a;
  if(dated.length === 2)      keep = a.date <= b.date ? a : b;
  else if(dated.length === 1) keep = dated[0];

  const labels = [];
  [a, b].forEach(x => { if(labels.indexOf(x.sourceLabel) === -1) labels.push(x.sourceLabel); });

  return Object.assign({}, keep, {
    again: a.again || b.again,
    spooky: a.spooky || b.spooky,
    tradition: a.tradition || b.tradition,
    /* Clicking through should land on the spooky tracker when it's on one,
       since that's the list with the extra machinery on it. */
    page: (a.spooky || b.spooky) ? spookySide.page : keep.page,
    sourceLabel: labels.join(" + "),
    image: keep.image || a.image || b.image,
    bothLists: labels.length > 1
  });
}

function build(lists){
  let all = [];
  lists.forEach(({ source, items }) => {
    (items || []).forEach(item => { all = all.concat(rowsFor(item, source)); });
  });

  const byKey = new Map();
  all.forEach(e => {
    const k = dedupeKey(e);
    byKey.set(k, byKey.has(k) ? merge(byKey.get(k), e) : e);
  });
  entries = Array.from(byKey.values());

  /* Newest first. Undated rows sink to the bottom in title order. */
  entries.sort((a, b) => {
    if(!a.date && !b.date) return a.title.localeCompare(b.title);
    if(!a.date) return 1;
    if(!b.date) return -1;
    if(a.date === b.date) return a.title.localeCompare(b.title);
    return a.date < b.date ? 1 : -1;
  });

  fillYears();
  render();
}

function fillYears(){
  const years = new Set();
  entries.forEach(e => { const p = parts(e.date); if(p) years.add(p.y); });
  const sel = $("fYear");
  const keep = sel.value;
  sel.innerHTML = '<option value="all">Any year</option>';
  Array.from(years).sort((a,b) => b-a).forEach(y => {
    const o = document.createElement("option");
    o.value = String(y); o.textContent = String(y);
    sel.appendChild(o);
  });
  sel.value = years.has(parseInt(keep,10)) ? keep : "all";
  fYear = sel.value;
}

function visible(){
  return entries.filter(e => {
    if(fSource !== "all" && e.source !== fSource) return false;
    if(fWho !== "all" && e.who !== fWho) return false;
    if(fYear !== "all"){
      const p = parts(e.date);
      if(!p || p.y !== parseInt(fYear,10)) return false;
    }
    return true;
  });
}

/* ---------------- summary ---------------- */
function renderStats(rows){
  const thisYear = new Date().getFullYear();
  const spooky = rows.filter(e => e.spooky).length;
  const titles = new Set(rows.map(e => e.title.trim().toLowerCase())).size;
  const inYear = rows.filter(e => { const p = parts(e.date); return p && p.y === thisYear; }).length;

  $("stats").innerHTML = `
    <div class="pp-panel pp-panel-tight wh-stat"><b>${rows.length}</b><span>Entries</span></div>
    <div class="pp-panel pp-panel-tight wh-stat"><b>${titles}</b><span>Titles</span></div>
    <div class="pp-panel pp-panel-tight wh-stat"><b>${inYear}</b><span>In ${thisYear}</span></div>
    <div class="pp-panel pp-panel-tight wh-stat spooky"><b>${spooky}</b><span>Spooky season</span></div>`;
}

/* ---------------- the spine ---------------- */
function render(){
  const rows = visible();
  const box = $("timeline");
  renderStats(rows);

  $("count").textContent = rows.length === entries.length
    ? (entries.length ? `${entries.length} watched, all time` : "")
    : `Showing ${rows.length} of ${entries.length}`;

  if(!rows.length){
    box.innerHTML = `<p class="wh-state">${
      entries.length ? "Nothing matches those filters."
                     : "Nothing finished yet. Tick something off on either tracker and it lands here."
    }</p>`;
    return;
  }

  /* Group by year, then by month, and lay each month out as a grid. Order is
     already right, so this walks the sorted list and opens a new heading or a
     new grid whenever the bucket changes. */
  let html = "", curYear = "\u0000", curMonth = "\u0000", gridOpen = false;
  const closeGrid = () => { if(gridOpen){ html += `</div>`; gridOpen = false; } };

  rows.forEach(e => {
    const p = parts(e.date);
    const year = p ? String(p.y) : null;

    if(year !== curYear){
      closeGrid();
      curYear = year; curMonth = "\u0000";
      const n = rows.filter(x => {
        const q = parts(x.date);
        return (q ? String(q.y) : null) === year;
      }).length;
      html += `<div class="wh-year${year ? "" : " undated"}">
        <h2>${year || "Date not recorded"}</h2>
        <span class="rule"></span><span class="n">${n}</span></div>`;
    }

    const month = p ? MONTHS[p.m-1] : "";
    if(month !== curMonth){
      closeGrid();
      curMonth = month;
      if(month) html += `<div class="wh-month">${month}</div>`;
    }

    if(!gridOpen){ html += `<div class="wh-grid">`; gridOpen = true; }

    const sub = [e.again ? "Rewatch" : e.unit, WHO_LABEL[e.who] || e.who]
      .filter(Boolean).join(" · ");
    const day = p ? (e.started ? "From " + p.d : String(p.d)) : "";
    const full = p ? (e.started ? "Started " + fmtDate(e.date) : fmtDate(e.date)) : "no date";

    html += `<a class="wh-card${e.spooky ? " is-spooky" : ""}" href="${esc(e.page)}"
                title="${esc(e.title + " — " + full + " — " + e.sourceLabel)}">
      <div class="wh-postwrap">
        ${e.image
          ? `<img class="wh-poster" src="${esc(e.image)}" alt="" loading="lazy"
                  onerror="this.outerHTML='<div class=\'wh-noposter\'>${esc(e.title)}</div>'">`
          : `<div class="wh-noposter">${esc(e.title)}</div>`}
        ${e.spooky ? `<span class="wh-pumpkin" aria-label="Spooky season">&#127875;</span>` : ""}
        ${e.again ? `<span class="wh-again" aria-label="Rewatch">&#8635;</span>`
                  : (e.tradition ? `<span class="wh-trad">Tradition</span>` : "")}
        ${day ? `<span class="wh-day">${esc(day)}</span>` : ""}
      </div>
      <div class="wh-cardbody">
        <p class="wh-title">${esc(e.title)}</p>
        <p class="wh-sub">${esc(sub)}</p>
        <p class="wh-sub">${esc(e.sourceLabel)}</p>
      </div>
    </a>`;
  });

  closeGrid();

  box.innerHTML = html;
}

/* ---------------- loading ----------------
   Read-only. Each list falls back to whatever the tracker last cached in this
   browser, so the page still shows something if Firestore is unreachable. */
async function load(){
  let db = null;
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(err){
    console.error("Firebase init failed:", err);
  }

  const lists = await Promise.all(SOURCES.map(async source => {
    if(db){
      try{
        const snap = await db.doc(source.doc).get();
        if(snap.exists){
          const data = snap.data();
          if(Array.isArray(data.items)) return { source, items: data.items };
        }
      }catch(err){
        console.error("Could not read " + source.doc + ":", err);
      }
    }
    try{
      const raw = JSON.parse(localStorage.getItem(source.cache) || "null");
      if(raw && Array.isArray(raw.items)) return { source, items: raw.items };
    }catch(e){}
    return { source, items: [] };
  }));

  build(lists);
}

/* ---------------- events ---------------- */
$("fSource").onchange = e => { fSource = e.target.value; render(); };
$("fWho").onchange    = e => { fWho    = e.target.value; render(); };
$("fYear").onchange   = e => { fYear   = e.target.value; render(); };
$("reset").onclick = () => {
  fSource = fWho = fYear = "all";
  $("fSource").value = $("fWho").value = $("fYear").value = "all";
  render();
};

load();
</script>
<script src="/assets/pp-nav.js" defer></script>
</body>
</html>
