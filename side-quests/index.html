<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side Quests — Princess &amp; Paladin</title>

<link rel="stylesheet" href="/assets/pp.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  .pp-sidequest{
    background-image: linear-gradient(135deg,#EFEAF4 0%,#DFD5EC 100%);
    background-attachment: fixed;
  }

  .sq-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 18px;
    margin: 0 0 40px;
  }

  .sq-tile{
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    padding: 18px;
    color: var(--ink);
    text-decoration: none;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .sq-tile:hover,
  .sq-tile:focus-visible{
    transform: translateY(-3px);
    border-color: var(--burgundy);
    box-shadow: var(--lift-lg);
    text-decoration: none;
  }

  .sq-icon{ width: 54px; height: 54px; display: block; }

  .sq-tile h3{
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 1.08rem;
    line-height: 1.2;
    margin: 0;
  }
  .sq-tile p{
    font-family: var(--font-body);
    font-size: .74rem;
    color: var(--ink-soft);
    line-height: 1.35;
    margin: 0;
  }

  /* the icon leans in a touch when you hover the tile */
  .sq-tile .sq-icon{ transition: transform .22s ease; }
  .sq-tile:hover .sq-icon{ transform: scale(1.06) rotate(-2deg); }

  /* empty slot, waiting to be filled in */
  .sq-empty{
    border-style: dashed;
    border-color: var(--line-strong);
    background: rgba(255,253,248,.55);
    box-shadow: none;
    cursor: default;
  }
  .sq-empty::before{ display: none; }
  .sq-empty:hover{ transform: none; box-shadow: none; border-color: var(--line-strong); }
  .sq-empty span{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .95rem;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce){
    .sq-tile:hover .sq-icon{ transform: none; }
  }
</style>
</head>

<body class="pp-sidequest">

  <div class="pp-wrap">


    <header class="pp-hero">
      <div class="pp-emblem">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M8 44 L4 20 L20 32 L32 12 L44 32 L60 20 L56 44 Z"
                fill="#E87CA6" stroke="#C85D87" stroke-width="2" stroke-linejoin="round"/>
          <path d="M8 44 H56" stroke="#C85D87" stroke-width="3" stroke-linecap="round"/>
          <circle cx="32" cy="10" r="3.5" fill="#9C7440"/>
          <circle cx="4"  cy="19" r="2.5" fill="#9C7440"/>
          <circle cx="60" cy="19" r="2.5" fill="#9C7440"/>
          <circle cx="32" cy="36" r="3" fill="#9C7440"/>
        </svg>
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M32 4 L38 14 V38 H26 V14 Z"
                fill="#B23A3A" stroke="#7C1F2A" stroke-width="2" stroke-linejoin="round"/>
          <rect x="14" y="38" width="36" height="6" rx="3" fill="#9C7440"/>
          <rect x="29" y="44" width="6" height="12" fill="#9C7440"/>
          <circle cx="32" cy="58" r="4" fill="#9C7440" stroke="#7C5B30" stroke-width="1.5"/>
        </svg>
      </div>
      
      <nav class="pp-nav" style="margin-top:28px;">
        <a href="/">Home</a>
        <a href="/dannelore/">Princess</a>
        <a href="/vmprman/">Paladin</a>
        <a href="/castle/">Castle Keep</a>
        <a href="/side-quests/">Side Quests</a>
        <a href="/templates/">Templates</a>
      </nav>
      
      <h1 class="pp-title">Side Quests</h1>
      <p class="pp-tagline">The things we do for the joy of it</p>
    </header>

    <div class="sq-grid">

      <!-- ---------- Bucket Quest ---------- -->
      <a class="pp-panel pp-panel-tight sq-tile" href="/side-quest/bucket-quest/">
        <svg class="sq-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- handle -->
          <path d="M13 19 A11 11 0 0 1 35 19" stroke="#9C7440" stroke-width="2" stroke-linecap="round"/>
          <!-- pail -->
          <path d="M11 19 H37 L33.5 41 H14.5 Z" fill="#8FA37E" stroke="#6D8259" stroke-width="2" stroke-linejoin="round"/>
          <path d="M11 19 H37" stroke="#6D8259" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M17 25 L15.8 37" stroke="#F7F1E4" stroke-width="1.6" stroke-linecap="round" opacity=".65"/>
          <!-- a sprig, because it's a list of lovely things -->
          <path d="M28 19 C28 13 31 9 35 7" stroke="#6D8259" stroke-width="1.8" stroke-linecap="round"/>
          <ellipse cx="36" cy="6" rx="3.6" ry="2.4" transform="rotate(-28 36 6)" fill="#E87CA6"/>
          <ellipse cx="30.5" cy="12" rx="3.2" ry="2.1" transform="rotate(18 30.5 12)" fill="#E87CA6" opacity=".8"/>
        </svg>
        <h3>Bucket Quest</h3>
        <p>Bucket list</p>
      </a>

      <!-- ---------- Couch Quest ---------- -->
      <a class="pp-panel pp-panel-tight sq-tile" href="/side-quest/couch-quest/">
        <svg class="sq-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- rabbit ears -->
          <path d="M18 14 L11 5" stroke="#9C7440" stroke-width="2" stroke-linecap="round"/>
          <path d="M30 14 L37 5" stroke="#9C7440" stroke-width="2" stroke-linecap="round"/>
          <circle cx="11" cy="4.5" r="2" fill="#9C7440"/>
          <circle cx="37" cy="4.5" r="2" fill="#9C7440"/>
          <!-- set -->
          <rect x="5" y="14" width="38" height="27" rx="5" fill="#6E2430" stroke="#4E1A22" stroke-width="1.6"/>
          <rect x="9.5" y="18.5" width="24" height="18" rx="3" fill="#F7F1E4"/>
          <path d="M12.5 21.5 L17 21.5" stroke="#E87CA6" stroke-width="2" stroke-linecap="round" opacity=".7"/>
          <circle cx="38" cy="23" r="2.4" fill="#9C7440"/>
          <circle cx="38" cy="31" r="2.4" fill="#9C7440"/>
          <!-- feet -->
          <path d="M14 41 L11 45" stroke="#4E1A22" stroke-width="2" stroke-linecap="round"/>
          <path d="M34 41 L37 45" stroke="#4E1A22" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h3>Couch Quest</h3>
        <p>Watch list</p>
      </a>

      <!-- ---------- Spooky Quest ---------- -->
      <a class="pp-panel pp-panel-tight sq-tile" href="/side-quest/spooky-quest/">
        <svg class="sq-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- stem + curl -->
          <path d="M24 13 V8" stroke="#6D8259" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M25 9 C29 6 32 8 31 11" stroke="#6D8259" stroke-width="1.8" stroke-linecap="round"/>
          <!-- body -->
          <ellipse cx="24" cy="28" rx="17" ry="14" fill="#9C7440" stroke="#7C5B30" stroke-width="1.8"/>
          <path d="M24 14 C20 19 20 37 24 42" stroke="#7C5B30" stroke-width="1.4" opacity=".7"/>
          <path d="M15 16 C12 21 12 35 15 40" stroke="#7C5B30" stroke-width="1.4" opacity=".55"/>
          <path d="M33 16 C36 21 36 35 33 40" stroke="#7C5B30" stroke-width="1.4" opacity=".55"/>
          <!-- face -->
          <path d="M17 25 L20.5 30 L13.5 30 Z" fill="#2E241F"/>
          <path d="M31 25 L34.5 30 L27.5 30 Z" fill="#2E241F"/>
          <path d="M17 34 Q24 39 31 34 Q28 36.5 24 36.5 Q20 36.5 17 34 Z" fill="#2E241F"/>
        </svg>
        <h3>Spooky Quest</h3>
        <p>1 September – 31 October</p>
      </a>
     
    </div>

    <footer class="pp-footer">
      <p class="pp-footer-flourish">♕ ───────── ⚔ ───────── ♕</p>
      <p class="pp-footer-estab">Princess &amp; Paladin</p>
      <p>Est. 2021</p>
    </footer>

  </div>

</body>
</html>
