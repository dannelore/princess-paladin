<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side Quests — Princess &amp; Paladin</title>

<link rel="stylesheet" href="/assets/pp.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  /* ---- background for /side-quest/ (move this into pp.css section 3) ---- */
  .pp-sidequest{
    background-image: linear-gradient(135deg,#EFEAF4 0%,#DFD5EC 100%);
    background-attachment: fixed;
  }

  /* ---- square tiles ---- */
  .sq-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 18px;
    margin: 0 0 40px;
  }

  .sq-tile{
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
    padding: 18px;
    color: var(--ink);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .sq-tile:hover,
  .sq-tile:focus-visible{
    transform: translateY(-3px);
    border-color: var(--burgundy);
    box-shadow: var(--lift-lg);
    text-decoration: none;
  }
  .sq-tile svg{ width: 24px; height: 24px; color: var(--burgundy); }
  .sq-tile h3{
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 1.05rem;
    line-height: 1.2;
    margin: 0;
  }
  .sq-tile p{
    font-family: var(--font-body);
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0;
  }

  /* empty slot, waiting to be filled in */
  .sq-empty{
    border-style: dashed;
    border-color: var(--line-strong);
    background: rgba(255,253,248,0.55);
    box-shadow: none;
    cursor: default;
  }
  .sq-empty::before{ display: none; }
  .sq-empty:hover{ transform: none; box-shadow: none; border-color: var(--line-strong); }
  .sq-empty span{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 0.95rem;
    color: var(--ink-soft);
  }
</style>
</head>
