<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classics Quest &middot; Side Quests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/pp.css">
<link rel="stylesheet" href="/assets/themes/side-quests.css">
<link rel="stylesheet" href="/assets/pp-progress.css">
<link rel="stylesheet" href="/assets/pp-tracker.css">

<style>
  /* ======================================================================
     THE QUEST TO BECOMING INSUFFERABLY WELL-READ

     An A-to-Z reading list, and Danni's alone. Unlike the watch trackers there
     is no "who" here at all — no Brendon column, no together/solo split, no
     ?who= switch. One person, one status and one finish date per book.

     Firestore: sidequest/classics-list
     The hundred titles are seeded from SEED below by id, once each, so
     anything you add or edit later is safe. Titles dropped from the list are
     listed in RETIRED and swept off only while nothing has been tracked
     against them -- see seed().

     ONE SHELF, TWO PAGES
     Reading Quest (/side-quests/reading-quest.html) reads and writes this
     same document, with the same shape per book. Every book carries
     `classic`: true for anything on this shelf, false for a book added over
     there. This page only ever shows and counts the classics -- see shelf()
     -- but saves the whole document, so nothing added on the other page is
     lost. Changes made on either page arrive on the other live, through the
     snapshot listener in load().
     ====================================================================== */

  .clq-intro{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 1.02rem;
    color: var(--ink-soft);
    text-align: center;
    max-width: 640px;
    margin: 0 auto 22px;
    line-height: 1.5;
  }

  /* ---- progress ---- */
  .clq-progress{ margin-bottom: 20px; display: flex; flex-direction: column; gap: 14px; }
  .clq-track{ padding: 18px 22px; }
  .clq-track h3{
    font-family: var(--font-body);
    font-size: .66rem;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--dusk-deep);
    margin: 0 0 10px;
  }

  /* Round 1: a letter grid marking which shelf-letters already have a
     finished book, so "complete the alphabet before doubling up" is
     something to glance at rather than tally by hand. */
  .clq-rgrid{ display: flex; flex-wrap: wrap; gap: 6px; }
  .clq-rletter{
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px;
    font-family: var(--font-body); font-size: .74rem; font-weight: 600;
    color: var(--ink-soft);
    background: var(--parchment); border: 1px solid var(--parchment-border);
    border-radius: var(--radius-sm);
  }
  .clq-rletter.is-done{
    color: #fff; background: var(--sage); border-color: var(--sage-deep);
  }
  .clq-rnote{
    font-family: var(--font-serif); font-style: italic; font-size: .85rem;
    color: var(--ink-soft); margin: 10px 0 0;
  }

  /* ---- controls ---- */
  .cq-form{ display: none; margin-bottom: 22px; }

  .clq-bar{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .clq-bar .spacer{ flex: 1 1 auto; }
  .clq-count{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .95rem;
    color: var(--ink-soft);
  }
  .clq-sync{
    font-family: var(--font-body);
    font-size: .7rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .clq-sync[data-state="saving"]{ color: var(--gold); }
  .clq-sync[data-state="error"]{ color: var(--blade); }

  /* ---- the shelf ----
     Poster-forward, like the watch trackers, so a shelf of covers reads as a
     shelf. Anything without a cover falls back to a drop-cap letter tile, so
     the grid never has a hole in it. */
  .clq-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }

  .clq-card{
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
    text-align: left;
    cursor: pointer;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    box-shadow: var(--lift);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .clq-card:hover,
  .clq-card:focus-visible{
    transform: translateY(-3px);
    box-shadow: var(--lift-lg);
    border-color: var(--dusk);
  }
  .clq-card.is-read{ border-color: var(--sage); }
  .clq-card.is-dnf{ border-color: var(--line-strong); }

  .clq-coverwrap{ position: relative; }
  .clq-cover{
    display: block;
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    background: var(--parchment);
  }
  /* Covers dim once you've read the book, the way a finished card does on the
     watch trackers — done things shouldn't shout as loudly as the queue. */
  .clq-card.is-read .clq-cover{ opacity: .72; }
  .clq-card.is-dnf  .clq-cover{ opacity: .5; filter: grayscale(.5); }

  /* No cover: the letter carries the tile instead. */
  .clq-nocover{
    aspect-ratio: 2/3;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 30% 25%, rgba(107,74,120,.16), transparent 62%), var(--parchment);
    font-family: var(--font-display);
    font-size: 3.4rem;
    font-weight: 600;
    line-height: 1;
    color: var(--dusk);
  }

  /* The letter, always visible, top-left over the cover. */
  .clq-letter{
    position: absolute;
    top: 6px; left: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1;
    color: var(--dusk-deep);
    background: rgba(255,253,248,.94);
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(46,36,31,.22);
  }
  .clq-card.is-read .clq-letter{ color: #fff; background: var(--sage-deep); }

  /* The list marks, top-right so they never crowd the letter: a star for an
     Ultimate Classic, a "100" for the 100% Club. A title can wear both. */
  .clq-marks{
    position: absolute;
    top: 6px; right: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .clq-mark{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(255,253,248,.94);
    box-shadow: 0 1px 4px rgba(46,36,31,.22);
    line-height: 1;
  }
  .clq-mark[data-mark="star"]{ color: var(--gold-deep); font-size: .85rem; }
  .clq-mark[data-mark="hundred"]{
    color: var(--dusk-deep);
    font-family: var(--font-body);
    font-size: .5rem;
    font-weight: 700;
    letter-spacing: .02em;
  }

  /* Same two marks spelled out under the title in the detail panel. */
  .clq-marknote{
    font-family: var(--font-body);
    font-size: .6rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin: 4px 0 0;
  }

  .clq-body{ padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 2px; }
  .clq-title{
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: .95rem;
    line-height: 1.2;
    margin: 0;
    color: var(--ink);
    word-break: break-word;
  }
  .clq-author{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .82rem;
    color: var(--ink-soft);
    margin: 0;
  }

  /* One status pill, sitting on the cover's foot. */
  .clq-status{
    position: absolute;
    bottom: 6px; left: 6px; right: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    font-size: .56rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 3px 8px;
    color: var(--ink-soft);
    background: rgba(255,253,248,.92);
    border: 1px solid var(--line-strong);
  }
  .clq-status[data-state="reading"]{
    border-style: dashed;
    color: var(--gold-deep);
    border-color: var(--gold);
  }
  .clq-status[data-state="read"]{
    color: #fff;
    background: var(--sage-deep);
    border-color: var(--sage-deep);
  }
  .clq-status[data-state="dnf"]{
    color: #fff;
    background: var(--unavail);
    border-color: var(--unavail);
  }

  .clq-when{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .78rem;
    color: var(--ink-soft);
    margin: 7px 0 0;
  }

  .clq-cardprogress{
    display: block;
    height: 4px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
    margin: 7px 0 3px;
  }
  .clq-cardprogress-fill{ display: block; height: 100%; background: var(--sage); }
  .clq-progresstext{
    display: block;
    font-family: var(--font-body);
    font-size: .68rem;
    color: var(--ink-soft);
  }

  /* ---- detail ---- */
  .clq-detail{
    display: none;
    position: fixed;
    inset: auto 0 0 0;
    z-index: 120;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: 0 -8px 40px rgba(46,36,31,.28);
  }
  .clq-detail.open{ display: block; }
  @media (min-width: 720px){
    .clq-detail{
      inset: 50% auto auto 50%;
      transform: translate(-50%,-50%);
      width: min(560px, 92vw);
      border-radius: var(--radius-lg);
    }
  }
  .clq-detail-head{ display: flex; gap: 16px; align-items: flex-start; margin-bottom: 4px; }
  .clq-detail-head h2{ margin: 0 0 2px; font-size: 1.4rem; }

  /* A bigger copy of the cover, and the controls for changing it. */
  .clq-detail-cover{
    flex: 0 0 auto;
    width: 92px;
    aspect-ratio: 2/3;
    object-fit: cover;
    border-radius: var(--radius-sm);
    background: var(--parchment);
    border: 1px solid var(--line);
  }
  .clq-detail-nocover{
    flex: 0 0 auto;
    width: 92px;
    aspect-ratio: 2/3;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    background: var(--parchment);
    border: 1px solid var(--line);
    font-family: var(--font-display);
    font-size: 2.4rem;
    font-weight: 600;
    color: var(--dusk);
  }
  .clq-coverrow{ display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .clq-coverrow input{ flex: 1 1 200px; min-width: 0; }
  .clq-coverstate{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .85rem;
    color: var(--ink-soft);
  }

  .clq-progressrow{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .clq-progressrow label{
    font-family: var(--font-body);
    font-size: .64rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold);
    flex: 1 1 100%;
  }
  .clq-progressrow input{
    width: 64px;
    flex: 0 0 auto;
  }
  .clq-progressrow span{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .85rem;
    color: var(--ink-soft);
  }

  .clq-block{ padding: 14px 0; border-top: 1px solid var(--line); }
  .clq-block-name{
    font-family: var(--font-body);
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .clq-states{ display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .clq-states button{
    font-family: var(--font-body);
    font-size: .72rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 13px;
    cursor: pointer;
  }
  .clq-states button[aria-pressed="true"]{
    color: #fff;
    background: var(--dusk);
    border-color: var(--dusk);
  }
  .clq-finished{ display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .clq-finished label{
    font-family: var(--font-body);
    font-size: .64rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .clq-finished input[type="date"]{
    font-family: var(--font-body);
    font-size: .84rem;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 5px 9px;
  }

  .clq-empty{
    grid-column: 1 / -1;
    text-align: center;
    padding: 36px;
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--ink-soft);
  }

  @media (max-width: 420px){
    .clq-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>

<body class="pp-sidequest" data-nav-eyebrow="Side Quests" data-nav-title="Classics Quest">

<div class="pp-wrap">

  <div class="pp-page-title">
    <h2>The Quest to Becoming Insufferably Well-Read</h2>
  </div>

  <p class="clq-intro">
    A hundred classics, every letter of the alphabet covered. Read them in any
    order, at any pace, and be unbearable about it afterwards.
  </p>

  <div class="clq-progress" id="progress"></div>

  <div class="clq-bar">
    <button class="pp-pill" data-filter="all" aria-pressed="true">All</button>
    <button class="pp-pill" data-filter="unread" aria-pressed="false">Unread</button>
    <button class="pp-pill" data-filter="reading" aria-pressed="false">Reading</button>
    <button class="pp-pill" data-filter="read" aria-pressed="false">Read</button>
    <button class="pp-pill" data-filter="dnf" aria-pressed="false">Abandoned</button>
    <button class="pp-pill" data-filter="star" aria-pressed="false">&#9733; Ultimate</button>
    <button class="pp-pill" data-filter="hundred" aria-pressed="false">100% Club</button>
    <span class="spacer"></span>
    <button class="pp-btn" id="addBtn">+ Add a book</button>
    <span class="clq-count" id="count"></span>
    <span class="clq-sync" id="sync"></span>
  </div>

  <div class="cq-selects">
    <div class="cq-pick">
      <label for="sortBy">Sort</label>
      <select id="sortBy">
        <option value="title-asc">Title (A–Z)</option>
        <option value="title-desc">Title (Z–A)</option>
        <option value="author-asc">Author last name (A–Z)</option>
        <option value="author-desc">Author last name (Z–A)</option>
        <option value="progress-desc">% complete (high to low)</option>
        <option value="progress-asc">% complete (low to high)</option>
        <option value="year-asc">Year written (oldest first)</option>
        <option value="year-desc">Year written (newest first)</option>
        <option value="pages-asc">Estimated pages (shortest first)</option>
        <option value="pages-desc">Estimated pages (longest first)</option>
      </select>
    </div>
  </div>

  <section class="pp-panel cq-form" id="form">
    <h2 class="pp-panel-title" id="formTitle">Add a book</h2>

    <div class="cq-fields">
      <div class="cq-field wide">
        <label for="fTitle">Title</label>
        <div class="cq-inline">
          <input id="fTitle" type="text" placeholder="The Bell Jar" autocomplete="off">
          <button class="pp-btn pp-btn-quiet" id="lookupBtn" style="white-space:nowrap;">Look it up</button>
        </div>
        <span class="cq-hint" id="lookupHint"></span>
        <div class="cq-results" id="results"></div>
      </div>

      <div class="cq-field">
        <label for="fAuthor">Author</label>
        <input id="fAuthor" type="text" placeholder="Sylvia Plath" autocomplete="off">
      </div>

      <div class="cq-field">
        <label for="fLetter">Shelf letter</label>
        <input id="fLetter" type="text" maxlength="1" style="text-transform:uppercase;max-width:4em;" autocomplete="off">
      </div>

      <div class="cq-field">
        <label for="fYear">Year written</label>
        <input id="fYear" type="number" placeholder="1949" autocomplete="off">
      </div>

      <div class="cq-field">
        <label for="fEstPages">Estimated pages</label>
        <input id="fEstPages" type="number" min="0" placeholder="Looked up when known, or type your own" autocomplete="off">
      </div>
    </div>

    <div class="cq-actions">
      <button class="pp-btn" id="saveBookBtn">Save</button>
      <button class="pp-btn pp-btn-quiet" id="cancelBookBtn">Cancel</button>
      <span class="cq-spacer"></span>
      <button class="pp-btn pp-btn-quiet" id="deleteBookBtn" style="display:none;">Delete</button>
    </div>
  </section>

  <div class="clq-grid" id="grid"></div>

  <footer class="pp-footer">
    <p class="pp-footer-flourish">&#9813; &mdash;&mdash;&mdash;&mdash; &#9876; &mdash;&mdash;&mdash;&mdash; &#9813;</p>
    <p class="pp-footer-estab">Princess &amp; Paladin</p>
    <p>Est. 2021</p>
  </footer>

</div>

<div class="pp-overlay" id="overlay"></div>
<div class="pp-panel pp-panel-lg clq-detail" id="detail"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="/assets/pp-firebase.js"></script>
<script src="/assets/pp-progress.js" defer></script>
<script>
"use strict";

const firebaseConfig = window.PPFirebaseConfig;

const DOC_PATH  = "sidequest/classics-list";
const CACHE_KEY = "pp_classics_list";

/* The shelf: the final hundred. Ids are stable so re-seeding can never
   duplicate a row, and letters are shelving letters -- "The Bell Jar" lives
   under B, and 1984 keeps the N it was shelved under as Nineteen Eighty-Four.

     star    = an Ultimate Classic.
     hundred = the 100% Club, the ones predicted to land dead-on.

   A letter can hold several books; Round 1 below only asks for one finished
   book from each. */
const SEED = [
  { id:"a2",  letter:"A", title:"Alice\u2019s Adventures in Wonderland", author:"Lewis Carroll" },
  { id:"a4",  letter:"A", title:"All My Sons", author:"Arthur Miller" },
  { id:"a",   letter:"A", title:"Animal Farm", author:"George Orwell", star:true },
  { id:"a3",  letter:"A", title:"The Adventures of Huckleberry Finn", author:"Mark Twain", star:true },
  { id:"a6",  letter:"A", title:"The Awakening", author:"Kate Chopin", star:true },
  { id:"b3",  letter:"B", title:"Beloved", author:"Toni Morrison", star:true },
  { id:"b2",  letter:"B", title:"Brave New World", author:"Aldous Huxley", star:true },
  { id:"b",   letter:"B", title:"The Bell Jar", author:"Sylvia Plath", star:true },
  { id:"c7",  letter:"C", title:"Candide", author:"Voltaire", star:true },
  { id:"c4",  letter:"C", title:"Carrie", author:"Stephen King", star:true },
  { id:"c6",  letter:"C", title:"Catch-22", author:"Joseph Heller", star:true },
  { id:"c3",  letter:"C", title:"Charlotte\u2019s Web", author:"E. B. White" },
  { id:"c",   letter:"C", title:"The Catcher in the Rye", author:"J. D. Salinger", star:true },
  { id:"c8",  letter:"C", title:"The Canterbury Tales", author:"Geoffrey Chaucer", star:true },
  { id:"c9",  letter:"C", title:"The Collector", author:"John Fowles", hundred:true },
  { id:"c10", letter:"C", title:"Crime and Punishment", author:"Fyodor Dostoevsky", star:true },
  { id:"c2",  letter:"C", title:"The Crucible", author:"Arthur Miller", star:true },
  { id:"d5",  letter:"D", title:"A Doll\u2019s House", author:"Henrik Ibsen", star:true },
  { id:"d3",  letter:"D", title:"Death of a Salesman", author:"Arthur Miller", star:true },
  { id:"d4",  letter:"D", title:"Do Androids Dream of Electric Sheep?", author:"Philip K. Dick" },
  { id:"d",   letter:"D", title:"Dracula", author:"Bram Stoker", star:true },
  { id:"d2",  letter:"D", title:"The Diary of a Young Girl", author:"Anne Frank", star:true },
  { id:"e2",  letter:"E", title:"Ethan Frome", author:"Edith Wharton" },
  { id:"f5",  letter:"F", title:"A Farewell to Arms", author:"Ernest Hemingway" },
  { id:"f6",  letter:"F", title:"Fahrenheit 451", author:"Ray Bradbury", star:true },
  { id:"f",   letter:"F", title:"Frankenstein", author:"Mary Shelley", star:true },
  { id:"f2",  letter:"F", title:"The Fall of the House of Usher", author:"Edgar Allan Poe", star:true },
  { id:"g2",  letter:"G", title:"The Gift of the Magi", author:"O. Henry" },
  { id:"g3",  letter:"G", title:"The Glass Menagerie", author:"Tennessee Williams", star:true },
  { id:"g",   letter:"G", title:"The Great Gatsby", author:"F. Scott Fitzgerald", star:true, hundred:true },
  { id:"g4",  letter:"G", title:"Great Expectations", author:"Charles Dickens", star:true },
  { id:"h2",  letter:"H", title:"Hamlet", author:"William Shakespeare", star:true },
  { id:"h",   letter:"H", title:"The Handmaid\u2019s Tale", author:"Margaret Atwood", star:true },
  { id:"h3",  letter:"H", title:"The Haunting of Hill House", author:"Shirley Jackson", star:true },
  { id:"h6",  letter:"H", title:"The Hunchback of Notre-Dame", author:"Victor Hugo", star:true },
  { id:"i",   letter:"I", title:"The Importance of Being Earnest", author:"Oscar Wilde" },

/* ---------------- dates ----------------
   Plain YYYY-MM-DD, split by hand so a UTC parse can't shift the day. */
function today(){
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
}
function fmtDate(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d || ""));
  if(!m) return "";
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${+m[3]} ${MONTHS[+m[2]-1]} ${m[1]}`;
}

/* ---------------- shape ----------------
   status is "unread" | "reading" | "read"; date is the day you finished.

   An earlier draft of this page kept a record per reader under `readers`.
   Nothing should have been saved in that shape, but if anything was, fold
   Danni's half up and drop the rest rather than losing a finish date. */
function normalize(item){
  if(item.readers && typeof item.readers === "object"){
    const mine = item.readers.danni;
    if(mine && typeof mine === "object"){
      if(item.status == null) item.status = mine.status;
      if(item.date == null)   item.date   = mine.date;
    }
    delete item.readers;
  }
  if(!STATES.some(st => st.key === item.status)) item.status = "unread";
  if(typeof item.date !== "string") item.date = "";
  if(typeof item.notes !== "string") item.notes = "";

  /* Shared with Reading Quest. Anything saved before `classic` existed was
     on this shelf, so missing reads as true; books added over there say
     false. A book from over there has no shelf letter until it's promoted,
     so derive one rather than let the letter sort trip on undefined. */
  if(typeof item.title !== "string") item.title = "";
  if(typeof item.author !== "string") item.author = "";
  if(typeof item.classic !== "boolean") item.classic = true;
  if(typeof item.letter !== "string" || !item.letter) item.letter = deriveLetter(item.title);
  if(typeof item.started !== "string") item.started = "";
  if(typeof item.added !== "string") item.added = "";
  if(typeof item.rating !== "number" || !isFinite(item.rating)) item.rating = 0;
  if(typeof item.cover !== "string") item.cover = "";
  /* Set once a lookup has been attempted, hit or miss, so a book Open Library
     has no cover for isn't re-queried on every single page load. */
  if(typeof item.coverTried !== "boolean") item.coverTried = false;

  /* Format + ownership + per-format progress. Every book keeps all three
     progress shapes so switching format later doesn't lose what was
     tracked under the old one. */
  if(!FORMATS.some(f => f.key === item.format)) item.format = "";
  if(!OWNERSHIP.some(o => o.key === item.ownership)) item.ownership = "";
  if(typeof item.pct !== "number" || !isFinite(item.pct)) item.pct = 0;
  if(typeof item.page !== "number" || !isFinite(item.page)) item.page = 0;
  if(typeof item.pages !== "number" || !isFinite(item.pages)) item.pages = 0;
  if(typeof item.mins !== "number" || !isFinite(item.mins)) item.mins = 0;
  if(typeof item.totalMins !== "number" || !isFinite(item.totalMins)) item.totalMins = 0;
  if(typeof item.year !== "number" || !isFinite(item.year)) item.year = null;
  if(typeof item.estPages !== "number" || !isFinite(item.estPages)){
    const known = PAGE_ESTIMATES[item.title];
    item.estPages = (typeof known === "number") ? known : null;
  }

  /* The two list marks. Books added by hand carry neither unless you say so,
     and seed() re-applies whatever SEED currently says for the hundred. */
  if(typeof item.star !== "boolean") item.star = false;
  if(typeof item.hundred !== "boolean") item.hundred = false;
  return item;
}

/* A book is "untouched" while it holds nothing worth keeping — no status, no
   finish date, no notes, no tracked progress. Only those are safe for the
   retirement sweep to clear. Covers don't count: most were fetched
   automatically, and a cover is not a reading record. */
function untouched(item){
  return item.status === "unread"
    && !item.date && !item.started && !item.notes && !item.rating
    && !item.format && !item.ownership
    && !item.pct && !item.page && !item.mins;
}

/* The books this page is about: everything flagged classic. Reading Quest
   keeps its own additions in the same document, and they're skipped here. */
function shelf(){
  return state.items.filter(i => i.classic);
}

/* Seeds anything missing by id, sweeps off retired titles that were never
   touched, and leaves everything else exactly as it was. The two list marks
   are the one exception: they're re-read from SEED every load, so editing
   the hundred here updates a shelf that's already been saved. */
function seed(){
  if(!Array.isArray(state.items)) state.items = [];
  let changed = 0;

  const retired = new Set(RETIRED);
  const swept = state.items.filter(i => retired.has(i.id) && untouched(i));
  if(swept.length){
    const gone = new Set(swept.map(i => i.id));
    state.items = state.items.filter(i => !gone.has(i.id));
    changed += swept.length;
  }

  SEED.forEach(book => {
    const have = state.items.find(i => i.id === book.id);
    if(have){
      if(have.star !== !!book.star || have.hundred !== !!book.hundred){
        have.star    = !!book.star;
        have.hundred = !!book.hundred;
        changed++;
      }
      return;
    }
    state.items.push(normalize(Object.assign({}, book,
      { classic:true, status:"unread", date:"", notes:"", cover:"", coverTried:false })));
    changed++;
  });

  state.items.forEach(normalize);
  state.items.sort((a,b) => a.letter === b.letter
    ? a.title.localeCompare(b.title)
    : a.letter.localeCompare(b.letter));
  return changed;
}

const stateLabel = key => (STATES.find(st => st.key === key) || STATES[0]).label;

/* The corner badges: a star for an Ultimate Classic, a 100 for the 100% Club.
   Titles carry one, both or neither. */
function marks(item){
  if(!item.star && !item.hundred) return "";
  return `<span class="clq-marks">` +
    (item.star    ? `<span class="clq-mark" data-mark="star" title="Ultimate Classic">★</span>` : "") +
    (item.hundred ? `<span class="clq-mark" data-mark="hundred" title="100% Club">100</span>` : "") +
    `</span>`;
}

/* 0–1 fraction complete, by format. Unset totals read as 0 rather than
   dividing by zero. */
function progressFrac(item){
  if(item.format === "ebook")    return Math.max(0, Math.min(100, item.pct)) / 100;
  if(item.format === "physical") return item.pages > 0 ? Math.max(0, Math.min(item.page, item.pages)) / item.pages : 0;
  if(item.format === "audio")    return item.totalMins > 0 ? Math.max(0, Math.min(item.mins, item.totalMins)) / item.totalMins : 0;
  return 0;
}

function hm(mins){ return `${Math.floor(mins / 60)}h ${mins % 60}m`; }

function progressText(item){
  if(item.format === "ebook")    return Math.round(Math.max(0, Math.min(100, item.pct))) + "%";
  if(item.format === "physical") return `page ${item.page || 0} of ${item.pages || 0}`;
  if(item.format === "audio")    return `${hm(item.mins || 0)} of ${hm(item.totalMins || 0)}`;
  return "";
}

/* ---------------- covers ----------------
   Open Library, which needs no key and no account. The search endpoint gives
   back a cover id; the covers endpoint serves the image.

   Editions vary wildly for books this old, so the first hit with a cover wins
   and you can always paste your own URL in the detail panel instead. Whatever
   is found gets stored on the book, so this runs once per title and never
   again — the page is not calling out to anyone on a normal load. */
const OL_SEARCH = "https://openlibrary.org/search.json";
const OL_COVER  = "https://covers.openlibrary.org/b/id/";

async function findCover(item){
  const url = OL_SEARCH +
    "?title="  + encodeURIComponent(item.title) +
    "&author=" + encodeURIComponent(item.author) +
    "&limit=5&fields=cover_i,title,author_name";
  const res  = await fetch(url);
  if(!res.ok) throw new Error("Open Library said " + res.status);
  const data = await res.json();
  const hit  = (data.docs || []).find(doc => doc.cover_i);
  return hit ? OL_COVER + hit.cover_i + "-M.jpg" : "";
}

/* Walks the shelf one book at a time. Sequential and spaced out on purpose —
   it's a free public API and there's no hurry. Cards fill in as they arrive. */
async function fillCovers(){
  const todo = state.items.filter(i => !i.cover && !i.coverTried);
  if(!todo.length) return;

  setSync("Finding covers\u2026", "saving");
  let found = 0;

  for(const item of todo){
    try{
      item.cover = await findCover(item);
      if(item.cover) found++;
    }catch(err){
      console.error("Cover lookup failed for " + item.title + ":", err);
      /* Leave coverTried false so a later visit can try again — a network
         blip shouldn't permanently mark a book as coverless. */
      continue;
    }
    item.coverTried = true;
    render();
    await new Promise(r => setTimeout(r, 120));
  }

  save();
  setSync(found ? "Found " + found + " covers" : "No new covers");
}

/* ---------------- add / edit ----------------
   A general title search, separate from findCover() above (which searches by
   an exact title+author pair for one missing cover). This one is driven by
   whatever's currently typed and shows several picks, same as the lookup on
   Couch Quest / Spooky Quest. */
function searchBooks(q){
  $("lookupHint").textContent = "Searching\u2026";
  const url = OL_SEARCH + "?q=" + encodeURIComponent(q) +
    "&fields=title,author_name,first_publish_year,number_of_pages_median,cover_i&limit=8";
  fetch(url)
    .then(res => { if(!res.ok) throw new Error("bad status"); return res.json(); })
    .then(data => showBookResults((data.docs || []).map(d => ({
      raw: d,
      name: d.title,
      image: d.cover_i ? (OL_COVER + d.cover_i + "-M.jpg") : "",
      meta: [(d.author_name || [])[0] || "", d.first_publish_year || ""].filter(Boolean).join(" \u00b7 ")
    }))))
    .catch(err => {
      console.error("Book lookup failed:", err);
      $("lookupHint").textContent = "Couldn't reach Open Library \u2014 fill it in by hand.";
    });
}

function showBookResults(rows){
  const box = $("results");
  box.innerHTML = "";
  if(!rows.length){
    $("lookupHint").textContent = "Nothing found. Check the spelling, or fill it in by hand.";
    box.classList.remove("open");
    return;
  }
  $("lookupHint").textContent = "Pick the right one:";
  rows.forEach(r => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cq-result";
    b.innerHTML =
      (r.image ? `<img src="${esc(r.image)}" alt="" loading="lazy">`
               : `<div class="clq-nocover" style="aspect-ratio:2/3;">${esc((r.name || "?").slice(0,1))}</div>`) +
      `<div class="cq-rname">${esc(r.name)}</div>` +
      `<div class="cq-rmeta">${esc(r.meta)}</div>`;
    b.onclick = () => pickBook(r);
    box.appendChild(b);
  });
  box.classList.add("open");
}

function pickBook(r){
  $("fTitle").value  = r.name;
  $("fAuthor").value = (r.raw.author_name || [])[0] || "";
  $("fLetter").value = deriveLetter($("fTitle").value);
  if(r.raw.first_publish_year) $("fYear").value = r.raw.first_publish_year;
  if(r.raw.number_of_pages_median) $("fEstPages").value = r.raw.number_of_pages_median;
  pendingCover = r.image || "";
  $("results").classList.remove("open");
  $("lookupHint").textContent = pendingCover
    ? "Cover found."
    : "No cover on file for that edition \u2014 you can add one after saving.";
}

/* Library-style alphabetizing: "The Bell Jar" shelves under B, same as the
   original 27 already do. Falls back to the raw first letter if nothing
   alphabetic follows the stripped article. */
function deriveLetter(title){
  const stripped = String(title || "").trim().replace(/^(the|an?)\s+/i, "");
  const m = /[a-zA-Z]/.exec(stripped) || /[a-zA-Z]/.exec(title || "");
  return m ? m[0].toUpperCase() : "?";
}

function openForm(item){
  closeDetail();
  editId = item ? item.id : null;
  pendingCover = "";
  $("formTitle").textContent = item ? "Edit book" : "Add a book";

  $("fAuthor").value = item ? item.author : "";
  $("fLetter").value = item ? item.letter : "";
  $("fYear").value = item && item.year != null ? item.year : "";
  $("fEstPages").value = item && item.estPages != null ? item.estPages : "";
  $("results").innerHTML = "";
  $("results").classList.remove("open");
  $("lookupHint").textContent = "";
  $("deleteBookBtn").style.display = item ? "inline-block" : "none";
  $("form").classList.add("open");
  $("fTitle").focus();
}

function closeForm(){
  $("form").classList.remove("open");
  editId = null;
  pendingCover = "";
}

function saveBook(){
  const title = $("fTitle").value.trim();
  if(!title){ $("fTitle").focus(); return; }
  const author = $("fAuthor").value.trim();
  const letterInput = $("fLetter").value.trim();
  const letter = (letterInput || deriveLetter(title)).slice(0,1).toUpperCase();
  const yearInput = $("fYear").value.trim();
  const year = yearInput ? parseInt(yearInput, 10) : null;
  const pagesInput = $("fEstPages").value.trim();
  const estPages = pagesInput ? parseInt(pagesInput, 10) : null;

  if(editId){
    const item = state.items.find(i => i.id === editId);
    if(item){
      item.title    = title;
      item.author   = author;
      item.letter   = letter;
      item.year     = (year != null && isFinite(year)) ? year : null;
      item.estPages = (estPages != null && isFinite(estPages)) ? estPages : null;
      if(pendingCover){ item.cover = pendingCover; item.coverTried = true; }
    }
  }else{
    state.items.push(normalize({
      id: uid(), letter, title, author, classic: true,
      year: (year != null && isFinite(year)) ? year : null,
      estPages: (estPages != null && isFinite(estPages)) ? estPages : null,
      status: "unread", started: "", date: "", added: today(), notes: "",
      cover: pendingCover, coverTried: !!pendingCover
    }));
  }

  state.items.sort((a,b) => a.letter === b.letter
    ? a.title.localeCompare(b.title)
    : a.letter.localeCompare(b.letter));

  closeForm();
  save();
}

function deleteBook(){
  if(!editId) return;
  if(!confirm("Remove this book from the shelf?")) return;
  state.items = state.items.filter(i => i.id !== editId);
  closeForm();
  save();
}

/* ---------------- storage ---------------- */
function setSync(text, stateName){
  $("sync").textContent = text;
  if(stateName) $("sync").setAttribute("data-state", stateName);
  else $("sync").removeAttribute("data-state");
}

function save(){
  localStorage.setItem(CACHE_KEY, JSON.stringify(state));
  render();
  if(!docRef) return;
  setSync("Saving\u2026", "saving");
  docRef.set(state)
    .then(() => setSync("Saved"))
    .catch(err => { console.error("Sync failed:", err); setSync("Offline \u2014 saved here", "error"); });
}

async function load(){
  try{
    const raw = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if(raw && Array.isArray(raw.items)) state = raw;
  }catch(e){}

  try{
    firebase.initializeApp(firebaseConfig);
    docRef = firebase.firestore().doc(DOC_PATH);
    const snap = await docRef.get();
    if(snap.exists){
      const data = snap.data();
      if(Array.isArray(data.items)) state = data;
    }
  }catch(err){
    console.error("Firestore unavailable, working from the local copy:", err);
    setSync("Offline", "error");
  }

  const added = seed();
  render();
  if(added) save();
  else setSync(docRef ? "Synced" : "Offline");

  /* Live updates from Reading Quest (or this page in another tab). Our own
     writes come back through here too, flagged as pending, and are skipped. */
  if(docRef){
    docRef.onSnapshot(s => {
      if(!s.exists || s.metadata.hasPendingWrites) return;
      const data = s.data();
      if(Array.isArray(data.items)) applyRemote(data);
    }, err => console.error("Live sync stopped:", err));
  }

  fillCovers();
}

/* JSON with keys in a fixed order, so two copies of the same shelf compare
   equal however their objects were built. */
const canon = v => JSON.stringify(v, (k, val) =>
  (val && typeof val === "object" && !Array.isArray(val))
    ? Object.keys(val).sort().reduce((o, key) => { o[key] = val[key]; return o; }, {})
    : val);

/* A change that arrived from the other page (or another tab). Swap the shelf
   in and redraw. If the detail panel is open, redraw that too, but keep any
   half-typed note -- it hasn't been saved yet and it's yours. No seeding or
   saving here: the other page never removes a seeded title, so there's
   nothing to put back, and writing on receipt would ping-pong. */
function applyRemote(data){
  const items = data.items.map(i => normalize(Object.assign({}, i)));
  if(canon(items) === canon(state.items)) return;

  const draft = openId && $("notes") ? $("notes").value : null;
  state = Object.assign({}, data, { items });
  state.items.sort((a,b) => a.letter === b.letter
    ? a.title.localeCompare(b.title)
    : a.letter.localeCompare(b.letter));
  localStorage.setItem(CACHE_KEY, JSON.stringify(state));
  render();

  if(openId){
    if(state.items.some(i => i.id === openId)){
      openDetail(openId);
      if(draft != null && $("notes")) $("notes").value = draft;
    }else{
      openId = null;
      $("detail").classList.remove("open");
      $("overlay").classList.remove("open");
    }
  }
  setSync("Updated");
}

/* ---------------- rendering ---------------- */
function visible(){
  return shelf().filter(i => {
    if(filter === "all") return true;
    if(filter === "star") return i.star;
    if(filter === "hundred") return i.hundred;
    return i.status === filter;         /* unread | reading | read | dnf */
  });
}

/* ---------------- sorting ----------------
   Default matches the shelf's own order (letter, ignoring "The"/"A"/"An",
   then title) so picking "Title (A-Z)" never visibly reshuffles anything. */
function authorLastName(author){
  const parts = String(author || "").trim().split(/\s+/).filter(Boolean);
  return parts.length ? parts[parts.length - 1] : "";
}

/* A book marked Read counts as fully complete even if its page/percent
   tracking was never filled in — the status is the more trustworthy signal. */
function completionFrac(item){
  if(item.status === "read") return 1;
  if(item.status === "unread") return 0;
  return progressFrac(item);
}

/* Books with no year sit at the end no matter which direction is picked,
   rather than clustering at "year zero" on an ascending sort. */
function yearCompare(a, b, ascending){
  const ay = a.year, by = b.year;
  if(ay == null && by == null) return a.title.localeCompare(b.title);
  if(ay == null) return 1;
  if(by == null) return -1;
  return ascending ? (ay - by) : (by - ay);
}

/* Same null-last shape as yearCompare — a book with no estimate yet sits at
   the end of the list either way, rather than sorting as if it were 0 pages. */
function pagesCompare(a, b, ascending){
  const ap = a.estPages, bp = b.estPages;
  if(ap == null && bp == null) return a.title.localeCompare(b.title);
  if(ap == null) return 1;
  if(bp == null) return -1;
  return ascending ? (ap - bp) : (bp - ap);
}

function sorted(rows){
  const out = rows.slice();
  if(sortBy === "title-desc"){
    out.sort((a,b) => b.letter === a.letter
      ? b.title.localeCompare(a.title)
      : b.letter.localeCompare(a.letter));
  }else if(sortBy === "author-asc"){
    out.sort((a,b) => authorLastName(a.author).localeCompare(authorLastName(b.author)) || a.title.localeCompare(b.title));
  }else if(sortBy === "author-desc"){
    out.sort((a,b) => authorLastName(b.author).localeCompare(authorLastName(a.author)) || b.title.localeCompare(a.title));
  }else if(sortBy === "progress-desc"){
    out.sort((a,b) => completionFrac(b) - completionFrac(a) || a.title.localeCompare(b.title));
  }else if(sortBy === "progress-asc"){
    out.sort((a,b) => completionFrac(a) - completionFrac(b) || a.title.localeCompare(b.title));
  }else if(sortBy === "year-asc"){
    out.sort((a,b) => yearCompare(a, b, true));
  }else if(sortBy === "year-desc"){
    out.sort((a,b) => yearCompare(a, b, false));
  }else if(sortBy === "pages-asc"){
    out.sort((a,b) => pagesCompare(a, b, true));
  }else if(sortBy === "pages-desc"){
    out.sort((a,b) => pagesCompare(a, b, false));
  }else{
    out.sort((a,b) => a.letter === b.letter
      ? a.title.localeCompare(b.title)
      : a.letter.localeCompare(b.letter));
  }
  return out;
}

const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

/* Danni's own house rule: read in any order, but no second book from a
   letter until every letter has had a first finished book. This just makes
   that visible — it doesn't stop anything on its own (see setStatus). */
function readLetters(){
  return new Set(shelf().filter(i => i.status === "read").map(i => i.letter));
}

function renderRoundOne(){
  const covered = readLetters();
  const missing = ALPHABET.filter(l => !covered.has(l));
  const cells = ALPHABET.map(l =>
    `<span class="clq-rletter${covered.has(l) ? " is-done" : ""}">${l}</span>`
  ).join("");
  const note = missing.length
    ? `${covered.size} of 26 letters have a finished book — still need a first read for ${missing.join(", ")}.`
    : "Every letter has a finished book. Doubles are fair game.";
  return `
    <div class="pp-panel pp-panel-tight clq-track">
      <h3>Round 1 — one from every letter</h3>
      <div class="clq-rgrid">${cells}</div>
      <p class="clq-rnote">${note}</p>
    </div>`;
}

function renderProgress(){
  const books = shelf();
  const total = books.length;
  const done  = books.filter(i => i.status === "read").length;

  $("progress").innerHTML = `
    <div class="pp-panel pp-panel-tight clq-track">
      <h3>Books read</h3>
      <div class="pp-progress" data-color="sage"
           data-current="${done}" data-total="${total}" data-format="both"></div>
    </div>
    ${renderRoundOne()}`;

  if(window.PPProgress) PPProgress.draw($("progress"));
}

function render(){
  renderProgress();

  const rows = sorted(visible());
  const total = shelf().length;
  $("count").textContent = rows.length === total
    ? `${total} books`
    : `Showing ${rows.length} of ${total}`;

  if(!rows.length){
    $("grid").innerHTML = `<p class="clq-empty">Nothing in that shelf yet.</p>`;
    return;
  }

  $("grid").innerHTML = rows.map(item => {
    let when = "";
    if(item.status === "read" && item.date)            when = `<p class="clq-when">Finished ${esc(fmtDate(item.date))}</p>`;
    else if(item.status === "reading" && item.started) when = `<p class="clq-when">Started ${esc(fmtDate(item.started))}</p>`;
    else if(item.status === "dnf" && item.date)        when = `<p class="clq-when">Put down ${esc(fmtDate(item.date))}</p>`;

    const prog = item.status === "reading" && item.format
      ? `<span class="clq-cardprogress" aria-hidden="true"><span class="clq-cardprogress-fill" style="width:${Math.round(progressFrac(item) * 100)}%"></span></span>
         <span class="clq-progresstext">${esc(progressText(item))}</span>`
      : "";

    /* If the stored cover URL 404s later, swap the tile for the letter rather
       than leaving a broken-image box on the shelf. */
    const art = item.cover
      ? `<img class="clq-cover" src="${esc(item.cover)}" alt="" loading="lazy"
              onerror="this.outerHTML='<div class=\'clq-nocover\'>${esc(item.letter)}</div>'">`
      : `<div class="clq-nocover">${esc(item.letter)}</div>`;

    const cls = item.status === "read" ? " is-read" : item.status === "dnf" ? " is-dnf" : "";

    return `<button class="clq-card${cls}" data-open="${esc(item.id)}">
      <span class="clq-coverwrap">
        ${art}
        <span class="clq-letter" aria-hidden="true">${esc(item.letter)}</span>
        ${marks(item)}
        <span class="clq-status" data-state="${item.status}">${esc(stateLabel(item.status))}</span>
      </span>
      <span class="clq-body">
        <span class="clq-title">${esc(item.title)}</span>
        <span class="clq-author">${esc(item.author)}</span>
        ${item.estPages != null ? `<span class="clq-when">~${item.estPages}pp</span>` : ""}
        ${when}
        ${prog}
      </span>
    </button>`;
  }).join("");
}

/* ---------------- detail ---------------- */

function closeDetail(){
  if(openId){
    const item = state.items.find(i => i.id === openId);
    const box = $("notes");
    if(item && box && box.value !== item.notes){ item.notes = box.value; save(); }
  }
  openId = null;
  $("detail").classList.remove("open");
  $("overlay").classList.remove("open");
}

/* Starting a book stamps today as the start date if there isn't one, and
   marking it read (or putting it down) stamps today as the finish, because
   the day you tick it is almost always the day it happened. Moving back off
   a state keeps its dates, so a mis-tap doesn't lose the record. Same rule
   as Reading Quest, so the two pages stamp the same thing. */
function setStatus(id, status){
  const item = state.items.find(i => i.id === id);
  if(!item) return;

  if(status === "read" && item.status !== "read"){
    const covered = readLetters();
    if(covered.has(item.letter)){
      const missing = ALPHABET.filter(l => !covered.has(l));
      if(missing.length){
        const ok = confirm(
          `You've already got a ${item.letter} finished. Still missing a first ` +
          `read for: ${missing.join(", ")}. Mark this one read anyway?`
        );
        if(!ok) return;
      }
    }
  }

  item.status = status;
  if(status !== "unread" && !item.started) item.started = today();
  if((status === "read" || status === "dnf") && !item.date) item.date = today();
  save();
  openDetail(id);
}

function setFormat(id, format){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  item.format = item.format === format ? "" : format;
  save();
  openDetail(id);
}

function setOwnership(id, ownership){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  item.ownership = item.ownership === ownership ? "" : ownership;
  save();
  openDetail(id);
}

/* Reads whichever progress inputs are on screen for the item's current
   format, clamps them, and saves. Called on change of any progress field. */
function updateProgress(id){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  if(item.format === "ebook" && $("pgPct")){
    item.pct = Math.max(0, Math.min(100, parseFloat($("pgPct").value) || 0));
  } else if(item.format === "physical" && $("pgPage")){
    item.page  = Math.max(0, parseInt($("pgPage").value, 10)  || 0);
    item.pages = Math.max(0, parseInt($("pgPages").value, 10) || 0);
  } else if(item.format === "audio" && $("pgMinsH")){
    const h  = Math.max(0, parseInt($("pgMinsH").value, 10)  || 0);
    const m  = Math.max(0, Math.min(59, parseInt($("pgMinsM").value, 10) || 0));
    const th = Math.max(0, parseInt($("pgTotalH").value, 10) || 0);
    const tm = Math.max(0, Math.min(59, parseInt($("pgTotalM").value, 10) || 0));
    item.mins = h * 60 + m;
    item.totalMins = th * 60 + tm;
  } else {
    return;
  }
  save();
  openDetail(id);
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const card = e.target.closest("[data-open]");
  if(card){ openDetail(card.getAttribute("data-open")); return; }

  if(e.target.id === "closeDetail" || e.target.id === "overlay"){ closeDetail(); return; }

  if(e.target.id === "coverFind"){ lookupOne(openId); return; }
  if(e.target.id === "coverClear"){ setCover(openId, ""); return; }

  if(e.target.id === "addBtn"){ openForm(null); return; }
  if(e.target.id === "editBook" && openId){ openForm(state.items.find(i => i.id === openId)); return; }
  if(e.target.id === "lookupBtn"){
    const q = $("fTitle").value.trim();
    if(q) searchBooks(q);
    return;
  }
  if(e.target.id === "saveBookBtn"){ saveBook(); return; }
  if(e.target.id === "cancelBookBtn"){ closeForm(); return; }
  if(e.target.id === "deleteBookBtn"){ deleteBook(); return; }

  const set = e.target.closest("[data-set]");
  if(set && openId){
    setStatus(openId, set.getAttribute("data-set"));
    return;
  }

  const setFmt = e.target.closest("[data-set-format]");
  if(setFmt && openId){
    setFormat(openId, setFmt.getAttribute("data-set-format"));
    return;
  }

  const setOwn = e.target.closest("[data-set-owner]");
  if(setOwn && openId){
    setOwnership(openId, setOwn.getAttribute("data-set-owner"));
    return;
  }

  const pill = e.target.closest(".clq-bar [data-filter]");
  if(pill){
    filter = pill.getAttribute("data-filter");
    document.querySelectorAll(".clq-bar [data-filter]").forEach(b =>
      b.setAttribute("aria-pressed", b === pill ? "true" : "false"));
    render();
  }
});

document.addEventListener("change", e => {
  if(!openId) return;

  if(e.target.id === "coverUrl"){ setCover(openId, e.target.value.trim()); return; }

  if(["pgPct","pgPage","pgPages","pgMinsH","pgMinsM","pgTotalH","pgTotalM"].indexOf(e.target.id) > -1){
    updateProgress(openId);
    return;
  }

  const item = state.items.find(i => i.id === openId);
  if(!item) return;
  if(e.target.id === "startedOn"){ item.started = e.target.value; save(); return; }
  if(e.target.id === "finishedOn"){ item.date = e.target.value; save(); return; }
});

/* A cover you set by hand counts as tried, so the automatic pass leaves it
   alone from then on. */
function setCover(id, url){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  item.cover = url;
  item.coverTried = true;
  save();
  openDetail(id);
}

async function lookupOne(id){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  const note = $("coverState");
  if(note) note.textContent = "Looking\u2026";
  try{
    const url = await findCover(item);
    if(url){ setCover(id, url); }
    else if(note){ note.textContent = "Open Library has no cover for this one. Paste a URL instead."; }
  }catch(err){
    console.error("Cover lookup failed:", err);
    if(note) note.textContent = "Couldn't reach Open Library just now.";
  }
}

document.addEventListener("keydown", e => { if(e.key === "Escape" && openId) closeDetail(); });

$("sortBy").onchange = e => { sortBy = e.target.value; render(); };

load();
</script>
