<html lang="en">

<meta charset="UTF-8">

<title>Classics Quest &middot; Side Quests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  /* ======================================================================
     THE QUEST TO BECOMING INSUFFERABLY WELL-READ

     An A-to-Z reading list, and Danni's alone. Unlike the watch trackers there
     is no "who" here at all — no Brendon column, no together/solo split, no
     ?who= switch. One person, one status and one finish date per book.

     Firestore: sidequest/classics-list
     The 27 titles are seeded from SEED below on first load and are never
     re-seeded after that, so anything you add or edit later is safe.
     ====================================================================== */

  .clq-intro{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 1.02rem;
    color: var(--ink-soft);
    text-align: center;
    max-width: 640px;
    margin: 0 auto 22px;
    line-height: 1.5;
  }

  /* ---- progress ---- */
  .clq-progress{ margin-bottom: 20px; }
  .clq-track{ padding: 18px 22px; }
  .clq-track h3{
    font-family: var(--font-body);
    font-size: .66rem;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--dusk-deep);
    margin: 0 0 10px;
  }

  /* ---- controls ---- */
  .clq-bar{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .clq-bar .spacer{ flex: 1 1 auto; }
  .clq-count{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .95rem;
    color: var(--ink-soft);
  }
  .clq-sync{
    font-family: var(--font-body);
    font-size: .7rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .clq-sync[data-state="saving"]{ color: var(--gold); }
  .clq-sync[data-state="error"]{ color: var(--blade); }

  /* ---- the shelf ----
     Poster-forward, like the watch trackers, so a shelf of covers reads as a
     shelf. Anything without a cover falls back to a drop-cap letter tile, so
     the grid never has a hole in it. */
  .clq-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }

  .clq-card{
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
    text-align: left;
    cursor: pointer;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    box-shadow: var(--lift);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .clq-card:hover,
  .clq-card:focus-visible{
    transform: translateY(-3px);
    box-shadow: var(--lift-lg);
    border-color: var(--dusk);
  }
  .clq-card.is-read{ border-color: var(--sage); }

  .clq-coverwrap{ position: relative; }
  .clq-cover{
    display: block;
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    background: var(--parchment);
  }
  /* Covers dim once you've read the book, the way a finished card does on the
     watch trackers — done things shouldn't shout as loudly as the queue. */
  .clq-card.is-read .clq-cover{ opacity: .72; }

  /* No cover: the letter carries the tile instead. */
  .clq-nocover{
    aspect-ratio: 2/3;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 30% 25%, rgba(107,74,120,.16), transparent 62%), var(--parchment);
    font-family: var(--font-display);
    font-size: 3.4rem;
    font-weight: 600;
    line-height: 1;
    color: var(--dusk);
  }

  /* The letter, always visible, top-left over the cover. */
  .clq-letter{
    position: absolute;
    top: 6px; left: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1;
    color: var(--dusk-deep);
    background: rgba(255,253,248,.94);
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(46,36,31,.22);
  }
  .clq-card.is-read .clq-letter{ color: #fff; background: var(--sage-deep); }

  .clq-body{ padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 2px; }
  .clq-title{
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: .95rem;
    line-height: 1.2;
    margin: 0;
    color: var(--ink);
    word-break: break-word;
  }
  .clq-author{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .82rem;
    color: var(--ink-soft);
    margin: 0;
  }

  /* One status pill, sitting on the cover's foot. */
  .clq-status{
    position: absolute;
    bottom: 6px; left: 6px; right: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    font-size: .56rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 3px 8px;
    color: var(--ink-soft);
    background: rgba(255,253,248,.92);
    border: 1px solid var(--line-strong);
  }
  .clq-status[data-state="reading"]{
    border-style: dashed;
    color: var(--gold-deep);
    border-color: var(--gold);
  }
  .clq-status[data-state="read"]{
    color: #fff;
    background: var(--sage-deep);
    border-color: var(--sage-deep);
  }

  .clq-when{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .78rem;
    color: var(--ink-soft);
    margin: 7px 0 0;
  }

  .clq-cardprogress{
    display: block;
    height: 4px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
    margin: 7px 0 3px;
  }
  .clq-cardprogress-fill{ display: block; height: 100%; background: var(--sage); }
  .clq-progresstext{
    display: block;
    font-family: var(--font-body);
    font-size: .68rem;
    color: var(--ink-soft);
  }

  /* ---- detail ---- */
  .clq-detail{
    display: none;
    position: fixed;
    inset: auto 0 0 0;
    z-index: 120;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: 0 -8px 40px rgba(46,36,31,.28);
  }
  .clq-detail.open{ display: block; }
  @media (min-width: 720px){
    .clq-detail{
      inset: 50% auto auto 50%;
      transform: translate(-50%,-50%);
      width: min(560px, 92vw);
      border-radius: var(--radius-lg);
    }
  }
  .clq-detail-head{ display: flex; gap: 16px; align-items: flex-start; margin-bottom: 4px; }
  .clq-detail-head h2{ margin: 0 0 2px; font-size: 1.4rem; }

  /* A bigger copy of the cover, and the controls for changing it. */
  .clq-detail-cover{
    flex: 0 0 auto;
    width: 92px;
    aspect-ratio: 2/3;
    object-fit: cover;
    border-radius: var(--radius-sm);
    background: var(--parchment);
    border: 1px solid var(--line);
  }
  .clq-detail-nocover{
    flex: 0 0 auto;
    width: 92px;
    aspect-ratio: 2/3;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    background: var(--parchment);
    border: 1px solid var(--line);
    font-family: var(--font-display);
    font-size: 2.4rem;
    font-weight: 600;
    color: var(--dusk);
  }
  .clq-coverrow{ display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .clq-coverrow input{ flex: 1 1 200px; min-width: 0; }
  .clq-coverstate{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .85rem;
    color: var(--ink-soft);
  }

  .clq-progressrow{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .clq-progressrow label{
    font-family: var(--font-body);
    font-size: .64rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold);
    flex: 1 1 100%;
  }
  .clq-progressrow input{
    width: 64px;
    flex: 0 0 auto;
  }
  .clq-progressrow span{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .85rem;
    color: var(--ink-soft);
  }

  .clq-block{ padding: 14px 0; border-top: 1px solid var(--line); }
  .clq-block-name{
    font-family: var(--font-body);
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .clq-states{ display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .clq-states button{
    font-family: var(--font-body);
    font-size: .72rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 13px;
    cursor: pointer;
  }
  .clq-states button[aria-pressed="true"]{
    color: #fff;
    background: var(--dusk);
    border-color: var(--dusk);
  }
  .clq-finished{ display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .clq-finished label{
    font-family: var(--font-body);
    font-size: .64rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .clq-finished input[type="date"]{
    font-family: var(--font-body);
    font-size: .84rem;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 5px 9px;
  }

  .clq-empty{
    grid-column: 1 / -1;
    text-align: center;
    padding: 36px;
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--ink-soft);
  }

  @media (max-width: 420px){
    .clq-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>

<body class="pp-sidequest" data-nav-eyebrow="Side Quests" data-nav-title="Classics Quest">

<script>
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyAdNZBoh1pH80-ZFBbOlcrlsLdMi3D62Wg",
  authDomain: "princess-paladin.firebaseapp.com",
  projectId: "princess-paladin",
  storageBucket: "princess-paladin.appspot.com",
  messagingSenderId: "282931655557",
  appId: "1:282931655557:web:cae6ccd23f32cb9be54aec"
};

const DOC_PATH  = "sidequest/classics-list";
const CACHE_KEY = "pp_classics_list";

/* The starting shelf. Ids are stable so re-seeding can never duplicate a row,
   and P has two books because two of them earned it. */
const SEED = [
  { id:"a",  letter:"A", title:"Animal Farm",                     author:"George Orwell" },
  { id:"b",  letter:"B", title:"The Bell Jar",                    author:"Sylvia Plath" },
  { id:"c",  letter:"C", title:"The Catcher in the Rye",          author:"J. D. Salinger" },
  { id:"d",  letter:"D", title:"Dracula",                         author:"Bram Stoker" },
  { id:"e",  letter:"E", title:"Emma",                            author:"Jane Austen" },
  { id:"f",  letter:"F", title:"Frankenstein",                    author:"Mary Shelley" },
  { id:"g",  letter:"G", title:"The Great Gatsby",                author:"F. Scott Fitzgerald" },
  { id:"h",  letter:"H", title:"The Handmaid\u2019s Tale",        author:"Margaret Atwood" },
  { id:"i",  letter:"I", title:"The Importance of Being Earnest", author:"Oscar Wilde" },
  { id:"j",  letter:"J", title:"Jane Eyre",                       author:"Charlotte Bront\u00eb" },
  { id:"k",  letter:"K", title:"The Kite Runner",                 author:"Khaled Hosseini" },
  { id:"l",  letter:"L", title:"Lord of the Flies",               author:"William Golding" },
  { id:"m",  letter:"M", title:"Murder on the Orient Express",    author:"Agatha Christie" },
  { id:"n",  letter:"N", title:"Night",                           author:"Elie Wiesel" },
  { id:"o",  letter:"O", title:"Oliver Twist",                    author:"Charles Dickens" },
  { id:"p1", letter:"P", title:"Pride and Prejudice",             author:"Jane Austen" },
  { id:"p2", letter:"P", title:"The Picture of Dorian Gray",      author:"Oscar Wilde" },
  { id:"q",  letter:"Q", title:"Quicksand",                       author:"Nella Larsen" },
  { id:"r",  letter:"R", title:"The Raven",                       author:"Edgar Allan Poe" },
  { id:"s",  letter:"S", title:"The Shining",                     author:"Stephen King" },
  { id:"t",  letter:"T", title:"A Tale of Two Cities",            author:"Charles Dickens" },
  { id:"u",  letter:"U", title:"Uncle Tom\u2019s Cabin",          author:"Harriet Beecher Stowe" },
  { id:"v",  letter:"V", title:"The Virgin Suicides",             author:"Jeffrey Eugenides" },
  { id:"w",  letter:"W", title:"Wuthering Heights",               author:"Emily Bront\u00eb" },
  { id:"x",  letter:"X", title:"1984",                            author:"George Orwell" },
  { id:"y",  letter:"Y", title:"The Yellow Wallpaper",            author:"Charlotte Perkins Gilman" },
  { id:"z",  letter:"Z", title:"Zastrozzi",                       author:"Percy Bysshe Shelley" }
];

const STATES = [
  { key:"unread",  label:"Not started" },
  { key:"reading", label:"Reading" },
  { key:"read",    label:"Read" }
];

/* Format decides how progress is tracked on a current read: e-book by
   percent, physical by page number, audiobook by time listened. */
const FORMATS = [
  { key:"ebook",    label:"E-book" },
  { key:"physical", label:"Physical" },
  { key:"audio",    label:"Audiobook" }
];
const OWNERSHIP = [
  { key:"owned",    label:"Owned" },
  { key:"borrowed", label:"Borrowed" },
  { key:"rented",   label:"Rented" }
];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

let state = { items: [] };
let docRef = null, openId = null, filter = "all";

/* ---------------- dates ----------------
   Plain YYYY-MM-DD, split by hand so a UTC parse can't shift the day. */
function fmtDate(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d || ""));
  if(!m) return "";
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${+m[3]} ${MONTHS[+m[2]-1]} ${m[1]}`;
}

/* ---------------- shape ----------------
   status is "unread" | "reading" | "read"; date is the day you finished.

   An earlier draft of this page kept a record per reader under `readers`.
   Nothing should have been saved in that shape, but if anything was, fold
   Danni's half up and drop the rest rather than losing a finish date. */
function normalize(item){
  if(item.readers && typeof item.readers === "object"){
    const mine = item.readers.danni;
    if(mine && typeof mine === "object"){
      if(item.status == null) item.status = mine.status;
      if(item.date == null)   item.date   = mine.date;
    }
    delete item.readers;
  }
  if(!STATES.some(st => st.key === item.status)) item.status = "unread";
  if(typeof item.date !== "string") item.date = "";
  if(typeof item.notes !== "string") item.notes = "";
  if(typeof item.cover !== "string") item.cover = "";
  /* Set once a lookup has been attempted, hit or miss, so a book Open Library
     has no cover for isn't re-queried on every single page load. */
  if(typeof item.coverTried !== "boolean") item.coverTried = false;

  /* Format + ownership + per-format progress. Every book keeps all three
     progress shapes so switching format later doesn't lose what was
     tracked under the old one. */
  if(!FORMATS.some(f => f.key === item.format)) item.format = "";
  if(!OWNERSHIP.some(o => o.key === item.ownership)) item.ownership = "";
  if(typeof item.pct !== "number" || !isFinite(item.pct)) item.pct = 0;
  if(typeof item.page !== "number" || !isFinite(item.page)) item.page = 0;
  if(typeof item.pages !== "number" || !isFinite(item.pages)) item.pages = 0;
  if(typeof item.mins !== "number" || !isFinite(item.mins)) item.mins = 0;
  if(typeof item.totalMins !== "number" || !isFinite(item.totalMins)) item.totalMins = 0;
  return item;
}

/* Seeds anything missing by id, and leaves everything already there alone. */
function seed(){
  if(!Array.isArray(state.items)) state.items = [];
  let added = 0;
  SEED.forEach(book => {
    if(state.items.some(i => i.id === book.id)) return;
    state.items.push(normalize(Object.assign({}, book,
      { status:"unread", date:"", notes:"", cover:"", coverTried:false })));
    added++;
  });
  state.items.forEach(normalize);
  state.items.sort((a,b) => a.letter === b.letter
    ? a.title.localeCompare(b.title)
    : a.letter.localeCompare(b.letter));
  return added;
}

const stateLabel = key => (STATES.find(st => st.key === key) || STATES[0]).label;

/* 0–1 fraction complete, by format. Unset totals read as 0 rather than
   dividing by zero. */
function progressFrac(item){
  if(item.format === "ebook")    return Math.max(0, Math.min(100, item.pct)) / 100;
  if(item.format === "physical") return item.pages > 0 ? Math.max(0, Math.min(item.page, item.pages)) / item.pages : 0;
  if(item.format === "audio")    return item.totalMins > 0 ? Math.max(0, Math.min(item.mins, item.totalMins)) / item.totalMins : 0;
  return 0;
}

function hm(mins){ return `${Math.floor(mins / 60)}h ${mins % 60}m`; }

function progressText(item){
  if(item.format === "ebook")    return Math.round(Math.max(0, Math.min(100, item.pct))) + "%";
  if(item.format === "physical") return `page ${item.page || 0} of ${item.pages || 0}`;
  if(item.format === "audio")    return `${hm(item.mins || 0)} of ${hm(item.totalMins || 0)}`;
  return "";
}

/* ---------------- covers ----------------
   Open Library, which needs no key and no account. The search endpoint gives
   back a cover id; the covers endpoint serves the image.

   Editions vary wildly for books this old, so the first hit with a cover wins
   and you can always paste your own URL in the detail panel instead. Whatever
   is found gets stored on the book, so this runs once per title and never
   again — the page is not calling out to anyone on a normal load. */
const OL_SEARCH = "https://openlibrary.org/search.json";
const OL_COVER  = "https://covers.openlibrary.org/b/id/";

async function findCover(item){
  const url = OL_SEARCH +
    "?title="  + encodeURIComponent(item.title) +
    "&author=" + encodeURIComponent(item.author) +
    "&limit=5&fields=cover_i,title,author_name";
  const res  = await fetch(url);
  if(!res.ok) throw new Error("Open Library said " + res.status);
  const data = await res.json();
  const hit  = (data.docs || []).find(doc => doc.cover_i);
  return hit ? OL_COVER + hit.cover_i + "-M.jpg" : "";
}

/* Walks the shelf one book at a time. Sequential and spaced out on purpose —
   it's a free public API and there's no hurry. Cards fill in as they arrive. */
async function fillCovers(){
  const todo = state.items.filter(i => !i.cover && !i.coverTried);
  if(!todo.length) return;

  setSync("Finding covers\u2026", "saving");
  let found = 0;

  for(const item of todo){
    try{
      item.cover = await findCover(item);
      if(item.cover) found++;
    }catch(err){
      console.error("Cover lookup failed for " + item.title + ":", err);
      /* Leave coverTried false so a later visit can try again — a network
         blip shouldn't permanently mark a book as coverless. */
      continue;
    }
    item.coverTried = true;
    render();
    await new Promise(r => setTimeout(r, 120));
  }

  save();
  setSync(found ? "Found " + found + " covers" : "No new covers");
}

/* ---------------- storage ---------------- */
function setSync(text, stateName){
  $("sync").textContent = text;
  if(stateName) $("sync").setAttribute("data-state", stateName);
  else $("sync").removeAttribute("data-state");
}

function save(){
  localStorage.setItem(CACHE_KEY, JSON.stringify(state));
  render();
  if(!docRef) return;
  setSync("Saving\u2026", "saving");
  docRef.set(state)
    .then(() => setSync("Saved"))
    .catch(err => { console.error("Sync failed:", err); setSync("Offline \u2014 saved here", "error"); });
}

async function load(){
  try{
    const raw = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if(raw && Array.isArray(raw.items)) state = raw;
  }catch(e){}

  try{
    firebase.initializeApp(firebaseConfig);
    docRef = firebase.firestore().doc(DOC_PATH);
    const snap = await docRef.get();
    if(snap.exists){
      const data = snap.data();
      if(Array.isArray(data.items)) state = data;
    }
  }catch(err){
    console.error("Firestore unavailable, working from the local copy:", err);
    setSync("Offline", "error");
  }

  const added = seed();
  render();
  if(added) save();
  else setSync(docRef ? "Synced" : "Offline");

  fillCovers();
}

/* ---------------- rendering ---------------- */
function visible(){
  return state.items.filter(i => {
    if(filter === "all") return true;
    return i.status === filter;         /* unread | reading | read */
  });
}

function renderProgress(){
  const total = state.items.length;
  const done  = state.items.filter(i => i.status === "read").length;

  $("progress").innerHTML = `
    <div class="pp-panel pp-panel-tight clq-track">
      <h3>Books read</h3>
      <div class="pp-progress" data-color="sage"
           data-current="${done}" data-total="${total}" data-format="both"></div>
    </div>`;

  if(window.PPProgress) PPProgress.draw($("progress"));
}

function render(){
  renderProgress();

  const rows = visible();
  const total = state.items.length;
  $("count").textContent = rows.length === total
    ? `${total} books`
    : `Showing ${rows.length} of ${total}`;

  if(!rows.length){
    $("grid").innerHTML = `<p class="clq-empty">Nothing in that shelf yet.</p>`;
    return;
  }

  $("grid").innerHTML = rows.map(item => {
    const when = item.status === "read" && item.date
      ? `<p class="clq-when">Finished ${esc(fmtDate(item.date))}</p>`
      : "";

    const prog = item.status === "reading" && item.format
      ? `<span class="clq-cardprogress" aria-hidden="true"><span class="clq-cardprogress-fill" style="width:${Math.round(progressFrac(item) * 100)}%"></span></span>
         <span class="clq-progresstext">${esc(progressText(item))}</span>`
      : "";

    /* If the stored cover URL 404s later, swap the tile for the letter rather
       than leaving a broken-image box on the shelf. */
    const art = item.cover
      ? `<img class="clq-cover" src="${esc(item.cover)}" alt="" loading="lazy"
              onerror="this.outerHTML='<div class=\'clq-nocover\'>${esc(item.letter)}</div>'">`
      : `<div class="clq-nocover">${esc(item.letter)}</div>`;

    return `<button class="clq-card${item.status === "read" ? " is-read" : ""}" data-open="${esc(item.id)}">
      <span class="clq-coverwrap">
        ${art}
        <span class="clq-letter" aria-hidden="true">${esc(item.letter)}</span>
        <span class="clq-status" data-state="${item.status}">${esc(stateLabel(item.status))}</span>
      </span>
      <span class="clq-body">
        <span class="clq-title">${esc(item.title)}</span>
        <span class="clq-author">${esc(item.author)}</span>
        ${when}
        ${prog}
      </span>
    </button>`;
  }).join("");
}

/* ---------------- detail ---------------- */
function openDetail(id){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  openId = id;

  $("detail").innerHTML = `
    <div class="clq-detail-head">
      ${item.cover
        ? `<img class="clq-detail-cover" src="${esc(item.cover)}" alt=""
                onerror="this.outerHTML='<div class=\'clq-detail-nocover\'>${esc(item.letter)}</div>'">`
        : `<div class="clq-detail-nocover">${esc(item.letter)}</div>`}
      <div style="flex:1 1 auto;min-width:0;">
        <h2>${esc(item.title)}</h2>
        <p class="clq-author">${esc(item.author)}</p>
      </div>
      <button class="pp-btn pp-btn-quiet pp-btn-sm" id="closeDetail">Close</button>
    </div>

    <div class="clq-block">
      <div class="clq-block-name">Where you are</div>
      <div class="clq-states">
        ${STATES.map(st => `<button data-set="${st.key}"
            aria-pressed="${item.status === st.key}">${esc(st.label)}</button>`).join("")}
      </div>
      <div class="clq-finished" ${item.status === "read" ? "" : 'style="display:none;"'}>
        <label for="finishedOn">Finished</label>
        <input id="finishedOn" type="date" value="${esc(item.date)}">
      </div>
    </div>

    <div class="clq-block">
      <div class="clq-block-name">Format</div>
      <div class="clq-states">
        ${FORMATS.map(f => `<button data-set-format="${f.key}"
            aria-pressed="${item.format === f.key}">${esc(f.label)}</button>`).join("")}
      </div>
    </div>

    <div class="clq-block">
      <div class="clq-block-name">Ownership</div>
      <div class="clq-states">
        ${OWNERSHIP.map(o => `<button data-set-owner="${o.key}"
            aria-pressed="${item.ownership === o.key}">${esc(o.label)}</button>`).join("")}
      </div>
    </div>

    ${item.status === "reading" && item.format ? `<div class="clq-block">
      <div class="clq-block-name">Progress</div>
      <div class="pp-progress" data-color="sage" id="progressBar"
           data-current="${Math.round(progressFrac(item) * 1000)}" data-total="1000"
           data-format="none" data-text="${esc(progressText(item))}"></div>
      <div class="clq-progressrow">
        ${item.format === "ebook" ? `
          <label for="pgPct">Percent complete</label>
          <input id="pgPct" class="pp-input" type="number" min="0" max="100" value="${item.pct}"> %
        ` : ""}
        ${item.format === "physical" ? `
          <label for="pgPage">Page</label>
          <input id="pgPage" class="pp-input" type="number" min="0" value="${item.page}">
          <span>of</span>
          <input id="pgPages" class="pp-input" type="number" min="0" value="${item.pages}">
        ` : ""}
        ${item.format === "audio" ? `
          <label for="pgMinsH">Time listened</label>
          <input id="pgMinsH" class="pp-input" type="number" min="0" value="${Math.floor(item.mins / 60)}">h
          <input id="pgMinsM" class="pp-input" type="number" min="0" max="59" value="${item.mins % 60}">m
          <span>of</span>
          <input id="pgTotalH" class="pp-input" type="number" min="0" value="${Math.floor(item.totalMins / 60)}">h
          <input id="pgTotalM" class="pp-input" type="number" min="0" max="59" value="${item.totalMins % 60}">m
        ` : ""}
      </div>
    </div>` : ""}

    <div class="clq-block">
      <div class="clq-block-name">Cover</div>
      <div class="clq-coverrow">
        <input class="pp-input" id="coverUrl" type="url" placeholder="Paste an image URL"
               value="${esc(item.cover)}">
        <button class="pp-btn pp-btn-quiet pp-btn-sm" id="coverFind">Find one</button>
        ${item.cover ? `<button class="pp-btn pp-btn-quiet pp-btn-sm" id="coverClear">Clear</button>` : ""}
      </div>
      <p class="clq-coverstate" id="coverState">Found automatically. Paste your own if you'd rather have a different edition.</p>
    </div>

    <div class="clq-block">
      <div class="clq-block-name">Notes</div>
      <div class="pp-field">
        <textarea id="notes" placeholder="Anything worth being insufferable about.">${esc(item.notes)}</textarea>
      </div>
    </div>`;

  $("detail").classList.add("open");
  $("overlay").classList.add("open");
  if(window.PPProgress) PPProgress.draw($("detail"));
}

function closeDetail(){
  if(openId){
    const item = state.items.find(i => i.id === openId);
    const box = $("notes");
    if(item && box && box.value !== item.notes){ item.notes = box.value; save(); }
  }
  openId = null;
  $("detail").classList.remove("open");
  $("overlay").classList.remove("open");
}

/* Marking a book read stamps today's date if there isn't one, because the day
   you tick it is almost always the day you finished it. Moving off "read"
   keeps the date, so a mis-tap doesn't lose the record. */
function setStatus(id, status){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  item.status = status;
  if(status === "read" && !item.date){
    const t = new Date();
    item.date = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
  }
  save();
  openDetail(id);
}

function setFormat(id, format){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  item.format = item.format === format ? "" : format;
  save();
  openDetail(id);
}

function setOwnership(id, ownership){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  item.ownership = item.ownership === ownership ? "" : ownership;
  save();
  openDetail(id);
}

/* Reads whichever progress inputs are on screen for the item's current
   format, clamps them, and saves. Called on change of any progress field. */
function updateProgress(id){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  if(item.format === "ebook" && $("pgPct")){
    item.pct = Math.max(0, Math.min(100, parseFloat($("pgPct").value) || 0));
  } else if(item.format === "physical" && $("pgPage")){
    item.page  = Math.max(0, parseInt($("pgPage").value, 10)  || 0);
    item.pages = Math.max(0, parseInt($("pgPages").value, 10) || 0);
  } else if(item.format === "audio" && $("pgMinsH")){
    const h  = Math.max(0, parseInt($("pgMinsH").value, 10)  || 0);
    const m  = Math.max(0, Math.min(59, parseInt($("pgMinsM").value, 10) || 0));
    const th = Math.max(0, parseInt($("pgTotalH").value, 10) || 0);
    const tm = Math.max(0, Math.min(59, parseInt($("pgTotalM").value, 10) || 0));
    item.mins = h * 60 + m;
    item.totalMins = th * 60 + tm;
  } else {
    return;
  }
  save();
  openDetail(id);
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const card = e.target.closest("[data-open]");
  if(card){ openDetail(card.getAttribute("data-open")); return; }

  if(e.target.id === "closeDetail" || e.target.id === "overlay"){ closeDetail(); return; }

  if(e.target.id === "coverFind"){ lookupOne(openId); return; }
  if(e.target.id === "coverClear"){ setCover(openId, ""); return; }

  const set = e.target.closest("[data-set]");
  if(set && openId){
    setStatus(openId, set.getAttribute("data-set"));
    return;
  }

  const setFmt = e.target.closest("[data-set-format]");
  if(setFmt && openId){
    setFormat(openId, setFmt.getAttribute("data-set-format"));
    return;
  }

  const setOwn = e.target.closest("[data-set-owner]");
  if(setOwn && openId){
    setOwnership(openId, setOwn.getAttribute("data-set-owner"));
    return;
  }

  const pill = e.target.closest(".clq-bar [data-filter]");
  if(pill){
    filter = pill.getAttribute("data-filter");
    document.querySelectorAll(".clq-bar [data-filter]").forEach(b =>
      b.setAttribute("aria-pressed", b === pill ? "true" : "false"));
    render();
  }
});

document.addEventListener("change", e => {
  if(!openId) return;

  if(e.target.id === "coverUrl"){ setCover(openId, e.target.value.trim()); return; }

  if(["pgPct","pgPage","pgPages","pgMinsH","pgMinsM","pgTotalH","pgTotalM"].indexOf(e.target.id) > -1){
    updateProgress(openId);
    return;
  }

  if(e.target.id !== "finishedOn") return;
  const item = state.items.find(i => i.id === openId);
  if(!item) return;
  item.date = e.target.value;
  save();
});

/* A cover you set by hand counts as tried, so the automatic pass leaves it
   alone from then on. */
function setCover(id, url){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  item.cover = url;
  item.coverTried = true;
  save();
  openDetail(id);
}

async function lookupOne(id){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  const note = $("coverState");
  if(note) note.textContent = "Looking\u2026";
  try{
    const url = await findCover(item);
    if(url){ setCover(id, url); }
    else if(note){ note.textContent = "Open Library has no cover for this one. Paste a URL instead."; }
  }catch(err){
    console.error("Cover lookup failed:", err);
    if(note) note.textContent = "Couldn't reach Open Library just now.";
  }
}

document.addEventListener("keydown", e => { if(e.key === "Escape" && openId) closeDetail(); });

load();
</script>
<script src="/assets/pp-nav.js" defer></script>
