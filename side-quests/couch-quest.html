<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couch Quest — Princess &amp; Paladin</title>

<link rel="stylesheet" href="/assets/pp.css">
<link rel="stylesheet" href="/assets/pp-progress.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  .pp-sidequest{
    background-image: linear-gradient(135deg,#EFEAF4 0%,#DFD5EC 100%);
    background-attachment: fixed;
  }

  /* ---------- toolbar ---------- */
  .cq-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:14px; }
  .cq-bar .cq-spacer{ flex:1 1 auto; }

  .cq-filter{
    font-family:var(--font-body); font-size:.74rem; font-weight:500;
    letter-spacing:.1em; text-transform:uppercase; color:var(--gold);
    background:var(--panel); border:1px solid var(--line-gold);
    border-radius:999px; padding:7px 15px; cursor:pointer;
    transition:color .15s ease, background .15s ease, border-color .15s ease;
  }
  .cq-filter:hover{ color:#fff; background:var(--pink); border-color:var(--pink); }
  .cq-filter[aria-pressed="true"]{ color:#fff; background:var(--sage); border-color:var(--sage); }

  /* dropdown row */
  .cq-selects{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
  .cq-pick{ display:flex; align-items:center; gap:6px; }
  .cq-pick label{
    font-family:var(--font-body); font-size:.66rem; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; color:var(--gold);
  }
  .cq-pick select{
    font-family:var(--font-body); font-size:.84rem; color:var(--ink);
    background:var(--panel); border:1px solid var(--line-gold);
    border-radius:999px; padding:6px 12px; cursor:pointer;
  }
  .cq-pick select:focus{ outline:2px solid var(--pink); outline-offset:1px; }
  .cq-reset{
    font-family:var(--font-serif); font-style:italic; font-size:.88rem;
    color:var(--ink-soft); background:none; border:0; cursor:pointer; padding:4px 2px;
  }
  .cq-reset:hover{ color:var(--burgundy); }

  .cq-count{ font-family:var(--font-serif); font-style:italic; font-size:.95rem; color:var(--ink-soft); }
  .cq-sync{ font-family:var(--font-body); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); }
  .cq-sync[data-state="saving"]{ color:var(--gold); }
  .cq-sync[data-state="error"]{ color:var(--blade); }

  /* ---------- form + detail ---------- */
  .cq-form, .cq-detail{ display:none; margin-bottom:22px; }
  .cq-form.open, .cq-detail.open{ display:block; }

  .cq-fields{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .cq-field{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .cq-field.wide{ grid-column:1 / -1; }
  .cq-field.hidden{ display:none; }

  .cq-field label{
    font-family:var(--font-body); font-size:.72rem; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; color:var(--gold);
  }
  .cq-field input, .cq-field select{
    font-family:var(--font-body); font-size:.95rem; color:var(--ink);
    background:#fff; border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:9px 12px; width:100%;
  }
  .cq-field input:focus, .cq-field select:focus{ outline:2px solid var(--pink); outline-offset:1px; }

  .cq-hint{ font-family:var(--font-serif); font-style:italic; font-size:.85rem; color:var(--ink-soft); }
  .cq-inline{ display:flex; gap:8px; align-items:flex-start; }
  .cq-inline input{ flex:1 1 auto; }

  .cq-results{ display:none; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px; margin-top:12px; }
  .cq-results.open{ display:grid; }
  .cq-result{
    text-align:left; padding:0; overflow:hidden; cursor:pointer;
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-sm); transition:border-color .15s ease, transform .15s ease;
  }
  .cq-result:hover{ border-color:var(--pink); transform:translateY(-2px); }
  .cq-result img{ width:100%; aspect-ratio:2/3; object-fit:cover; display:block; background:var(--parchment); }
  .cq-rname{ font-family:var(--font-serif); font-weight:600; font-size:.86rem; line-height:1.2; padding:7px 8px 2px; color:var(--ink); }
  .cq-rmeta{ font-family:var(--font-body); font-size:.7rem; color:var(--ink-soft); padding:0 8px 8px; }

  .cq-tagpick{ display:flex; flex-wrap:wrap; gap:6px; }
  .cq-tagpick button{
    font-family:var(--font-body); font-size:.74rem; color:var(--ink-soft);
    background:var(--parchment); border:1px solid var(--parchment-border);
    border-radius:999px; padding:4px 11px; cursor:pointer;
  }
  .cq-tagpick button[aria-pressed="true"]{ color:#fff; background:var(--sage); border-color:var(--sage); }

  .cq-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }

  /* ---------- detail ---------- */
  .cq-detail-head{ display:flex; gap:16px; align-items:flex-start; margin-bottom:20px; }
  .cq-detail-head img{ width:84px; aspect-ratio:2/3; object-fit:cover; border-radius:var(--radius-sm); flex-shrink:0; background:var(--parchment); }
  .cq-detail-head h2{ margin:0 0 4px; font-size:1.5rem; }
  .cq-detail-meta{ font-family:var(--font-serif); font-style:italic; color:var(--ink-soft); margin:0 0 10px; }

  .cq-block{ padding:14px 0; border-top:1px solid var(--line); }
  .cq-block:first-child{ border-top:0; }
  .cq-block-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:9px; }
  .cq-block-name{ font-family:var(--font-body); font-size:.72rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
  .cq-block-count{ font-family:var(--font-serif); font-style:italic; font-size:.9rem; color:var(--ink-soft); }

  .cq-step{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .cq-step button{
    font-family:var(--font-body); font-size:.78rem; font-weight:500;
    min-width:34px; height:30px; padding:0 10px; line-height:1;
    color:var(--gold); background:var(--panel); border:1px solid var(--line-gold);
    border-radius:999px; cursor:pointer;
  }
  .cq-step button:hover{ color:#fff; background:var(--pink); border-color:var(--pink); }
  .cq-step input{
    font-family:var(--font-body); font-size:.9rem; width:70px; text-align:center;
    color:var(--ink); background:#fff; border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:6px 8px;
  }
  .cq-step .cq-steplabel{ font-family:var(--font-serif); font-style:italic; font-size:.86rem; color:var(--ink-soft); }

  /* ---------- grid ---------- */
  .cq-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px; }

  .cq-card{
    position:relative; display:flex; flex-direction:column; padding:0; overflow:hidden;
    border-radius:var(--radius-sm); background:var(--panel); border:1px solid var(--line);
    box-shadow:var(--lift); transition:transform .18s ease, box-shadow .18s ease;
  }
  .cq-card:hover{ transform:translateY(-3px); box-shadow:var(--lift-lg); }
  .cq-card.is-done{ opacity:.62; }

  .cq-posterwrap{ position:relative; cursor:pointer; }
  .cq-poster{ aspect-ratio:2/3; width:100%; object-fit:cover; display:block; background:var(--parchment); }
  .cq-poster-none{
    aspect-ratio:2/3; display:flex; align-items:center; justify-content:center;
    padding:14px; text-align:center;
    background:radial-gradient(ellipse at 30% 25%,rgba(156,116,64,.14),transparent 60%),var(--parchment);
    font-family:var(--font-serif); font-style:italic; font-size:.95rem;
    color:var(--gold-deep); line-height:1.3;
  }
  .cq-ring{ position:absolute; bottom:7px; right:7px; background:rgba(255,253,248,.92); border-radius:50%; padding:3px; }

  /* corner badge for who watches it */
  .cq-who{
    position:absolute; top:7px; left:7px;
    font-family:var(--font-body); font-size:.6rem; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase; color:#fff;
    background:rgba(110,36,48,.86); border-radius:999px; padding:3px 8px;
  }
  .cq-who[data-who="danni"]{ background:rgba(200,93,135,.9); }
  .cq-who[data-who="brendon"]{ background:rgba(109,130,89,.92); }

  .cq-body{ padding:11px 12px 13px; display:flex; flex-direction:column; gap:7px; }
  .cq-name{ font-family:var(--font-serif); font-weight:600; font-size:1rem; line-height:1.2; margin:0; color:var(--ink); word-break:break-word; }
  .cq-where{ font-family:var(--font-serif); font-style:italic; font-size:.85rem; color:var(--ink-soft); }

  .cq-meta{ display:flex; flex-wrap:wrap; gap:5px; align-items:center; }

  .cq-status{
    font-family:var(--font-body); font-size:.68rem; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:#fff; border:none;
    border-radius:999px; padding:4px 11px; cursor:pointer;
  }
  .cq-status[data-status="want"]{ background:var(--gold); }
  .cq-status[data-status="watching"]{ background:var(--pink); }
  .cq-status[data-status="watched"]{ background:var(--sage-deep); }

  .cq-pri{
    font-family:var(--font-body); font-size:.66rem; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase;
    border-radius:999px; padding:3px 9px;
    border:1px solid transparent;
  }
  .cq-pri[data-tier="high"]{ color:#fff; background:var(--burgundy); }
  .cq-pri[data-tier="mid"]{ color:var(--gold-deep); background:var(--parchment); border-color:var(--parchment-border); }
  .cq-pri[data-tier="low"]{ color:var(--ink-soft); background:rgba(46,36,31,.07); }

  .cq-tags{ display:flex; flex-wrap:wrap; gap:4px; }
  .cq-tags span{
    font-family:var(--font-body); font-size:.68rem; color:var(--ink-soft);
    background:rgba(46,36,31,.07); border-radius:999px; padding:2px 8px;
  }

  .cq-tools{ position:absolute; top:7px; right:7px; display:flex; gap:5px; opacity:0; transition:opacity .15s ease; }
  .cq-card:hover .cq-tools, .cq-card:focus-within .cq-tools{ opacity:1; }
  .cq-tools button{
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    font-size:.8rem; color:var(--ink); background:rgba(255,253,248,.94);
    border:1px solid var(--line); border-radius:999px; cursor:pointer; line-height:1;
  }
  .cq-tools button:hover{ color:#fff; background:var(--burgundy); border-color:var(--burgundy); }
  @media (hover:none){ .cq-tools{ opacity:1; } }

  @media (max-width:560px){
    .cq-fields{ grid-template-columns:1fr; }
    .cq-grid{ grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); }
    .cq-selects{ gap:8px; }
  }
</style>
</head>

<body class="pp-sidequest">
<div class="pp-wrap">

  <nav class="pp-nav" style="margin-top:28px;">
    <a href="/">Home</a>
    <a href="/castle-keep/">Castle Keeping</a>
    <a href="/dannelore/quest-log/">Quest Log</a>
    <a href="/side-quest/">Side Quests</a>
    <a href="/templates/">Templates</a>
  </nav>

  <header class="pp-hero" style="padding:8px 0 28px;">
    <div class="pp-emblem pp-emblem-sm">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M8 44 L4 20 L20 32 L32 12 L44 32 L60 20 L56 44 Z" fill="#E87CA6" stroke="#C85D87" stroke-width="2" stroke-linejoin="round"/>
        <path d="M8 44 H56" stroke="#C85D87" stroke-width="3" stroke-linecap="round"/>
        <circle cx="32" cy="10" r="3.5" fill="#9C7440"/><circle cx="4" cy="19" r="2.5" fill="#9C7440"/>
        <circle cx="60" cy="19" r="2.5" fill="#9C7440"/><circle cx="32" cy="36" r="3" fill="#9C7440"/>
      </svg>
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M32 4 L38 14 V38 H26 V14 Z" fill="#B23A3A" stroke="#7C1F2A" stroke-width="2" stroke-linejoin="round"/>
        <rect x="14" y="38" width="36" height="6" rx="3" fill="#9C7440"/>
        <rect x="29" y="44" width="6" height="12" fill="#9C7440"/>
        <circle cx="32" cy="58" r="4" fill="#9C7440" stroke="#7C5B30" stroke-width="1.5"/>
      </svg>
    </div>
    <h1 class="pp-title" style="font-size:clamp(2.2rem,6vw,3.6rem);">Couch Quest</h1>
    <p class="pp-tagline">Everything we said we'd get around to watching</p>
  </header>

  <!-- status chips -->
  <div class="cq-bar">
    <button class="cq-filter" data-filter="all" aria-pressed="true">All</button>
    <button class="cq-filter" data-filter="want" aria-pressed="false">Want to watch</button>
    <button class="cq-filter" data-filter="watching" aria-pressed="false">Watching</button>
    <button class="cq-filter" data-filter="watched" aria-pressed="false">Watched</button>
    <span class="cq-spacer"></span>
    <button class="pp-btn" id="addBtn">Add something</button>
  </div>

  <!-- dropdown filters + sort -->
  <div class="cq-selects">
    <div class="cq-pick">
      <label for="fltKind">Kind</label>
      <select id="fltKind">
        <option value="all">All</option>
        <option value="series">Series</option>
        <option value="movie">Films</option>
      </select>
    </div>

    <div class="cq-pick">
      <label for="fltWho">Who</label>
      <select id="fltWho">
        <option value="all">All</option>
        <option value="together">Together</option>
        <option value="danni">D only</option>
        <option value="brendon">B only</option>
      </select>
    </div>

    <div class="cq-pick">
      <label for="fltPri">Priority</label>
      <select id="fltPri">
        <option value="all">All</option>
        <option value="high">High</option>
        <option value="mid">Medium</option>
        <option value="low">Low</option>
        <option value="none">Unrated</option>
      </select>
    </div>

    <div class="cq-pick">
      <label for="fltTag">Tag</label>
      <select id="fltTag"><option value="all">All</option></select>
    </div>

    <div class="cq-pick">
      <label for="sortBy">Sort</label>
      <select id="sortBy">
        <option value="priority">Priority, high first</option>
        <option value="progress">Progress, furthest along</option>
        <option value="title">Title, A–Z</option>
        <option value="added">Recently added</option>
      </select>
    </div>

    <button class="cq-reset" id="resetBtn">Clear filters</button>
  </div>

  <div class="cq-bar" style="margin-bottom:14px;">
    <span class="cq-count" id="count"></span>
    <span class="cq-spacer"></span>
    <span class="cq-sync" id="sync" data-state="idle">Connecting</span>
  </div>

  <!-- ---------------- add / edit ---------------- -->
  <section class="pp-panel cq-form" id="form">
    <h2 class="pp-panel-title" id="formTitle">Add something</h2>

    <div class="cq-fields">
      <div class="cq-field">
        <label for="fType">Kind</label>
        <select id="fType">
          <option value="series">Series</option>
          <option value="movie">Film</option>
        </select>
      </div>

      <div class="cq-field">
        <label for="fStatus">Status</label>
        <select id="fStatus">
          <option value="want">Want to watch</option>
          <option value="watching">Watching</option>
          <option value="watched">Watched</option>
        </select>
      </div>

      <div class="cq-field wide">
        <label for="fTitle">Title</label>
        <div class="cq-inline">
          <input id="fTitle" type="text" placeholder="Over the Garden Wall" autocomplete="off">
          <button class="pp-btn pp-btn-quiet" id="lookupBtn" style="white-space:nowrap;">Look it up</button>
        </div>
        <span class="cq-hint" id="lookupHint"></span>
        <div class="cq-results" id="results"></div>
      </div>

      <div class="cq-field">
        <label for="fWho">Who's watching</label>
        <select id="fWho">
          <option value="together">Together</option>
          <option value="danni">D only</option>
          <option value="brendon">B only</option>
        </select>
      </div>

      <div class="cq-field hidden" id="runtimeField">
        <label for="fRuntime">Runtime in minutes</label>
        <input id="fRuntime" type="number" min="0" step="1" placeholder="118">
      </div>

      <div class="cq-field">
        <label for="fPriD">D's priority</label>
        <select id="fPriD">
          <option value="0">Not rated</option>
          <option value="1">Low</option>
          <option value="2">Medium</option>
          <option value="3">High</option>
        </select>
      </div>

      <div class="cq-field">
        <label for="fPriB">B's priority</label>
        <select id="fPriB">
          <option value="0">Not rated</option>
          <option value="1">Low</option>
          <option value="2">Medium</option>
          <option value="3">High</option>
        </select>
      </div>

      <div class="cq-field wide">
        <label for="fImage">Poster image link</label>
        <input id="fImage" type="url" placeholder="https://… (optional)" autocomplete="off">
      </div>

      <div class="cq-field wide">
        <label for="fNewTag">Add a new tag</label>
        <input id="fNewTag" type="text" placeholder="Press Enter to save" autocomplete="off">
      </div>

      <div class="cq-field wide">
        <label>Tags</label>
        <div class="cq-tagpick" id="tagPick"></div>
      </div>
    </div>

    <div class="cq-actions">
      <button class="pp-btn" id="saveBtn">Save</button>
      <button class="pp-btn pp-btn-quiet" id="cancelBtn">Cancel</button>
      <span class="cq-spacer"></span>
      <button class="pp-btn pp-btn-quiet" id="deleteBtn" style="display:none;">Delete</button>
    </div>
  </section>

  <!-- ---------------- detail ---------------- -->
  <section class="pp-panel cq-detail" id="detail">
    <div class="cq-detail-head">
      <img id="dImg" alt="">
      <div style="flex:1 1 auto; min-width:0;">
        <h2 id="dTitle"></h2>
        <p class="cq-detail-meta" id="dMeta"></p>
        <div class="pp-progress" id="dOverall" data-color="pink"></div>
      </div>
    </div>
    <div id="detailBody"></div>
    <div class="cq-actions">
      <button class="pp-btn pp-btn-quiet" id="detailClose">Close</button>
      <button class="pp-btn pp-btn-quiet" id="refetchBtn">Refresh seasons</button>
    </div>
  </section>

  <div class="cq-grid" id="grid"></div>
  <p class="pp-empty" id="empty" style="display:none;">Nothing here yet. Add the first one.</p>

  <footer class="pp-footer">
    <p class="pp-footer-flourish">♕ ───────── ⚔ ───────── ♕</p>
    <p><a class="pp-back" href="/side-quest/">Back to Side Quests</a></p>
  </footer>

</div>

<script src="/assets/pp-progress.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
/* ------------------------------------------------------------------
   1. PASTE YOUR FIREBASE CONFIG HERE — same block as your quest-log page.
------------------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "PASTE_FROM_QUEST_LOG",
  authDomain: "princess-paladin.firebaseapp.com",
  projectId: "princess-paladin",
  storageBucket: "princess-paladin.appspot.com",
  messagingSenderId: "PASTE_FROM_QUEST_LOG",
  appId: "PASTE_FROM_QUEST_LOG"
};

/* ------------------------------------------------------------------
   2. YOUR TMDB KEY — films only. Series come from TVmaze, no key needed.
------------------------------------------------------------------- */
const TMDB_KEY = "PASTE_YOUR_TMDB_KEY";

const DOC_PATH  = "sidequest/couch-list";
const CACHE_KEY = "pp_couch_list";
const TVMAZE    = "https://api.tvmaze.com";
const TMDB      = "https://api.themoviedb.org/3";
const TMDB_IMG  = "https://image.tmdb.org/t/p/w500";

const DEFAULT_TAGS = ["Comedy","Drama","Horror","Fantasy","Documentary","Animated","Rewatch","Cozy"];

const HINT_SERIES = "Searches TV shows and pulls in the poster and every season.";
const HINT_MOVIE  = "Searches films and pulls in the poster and the runtime.";
const HINT_NOKEY  = "Film lookup needs a TMDB key — see the note near the top of this page's code. You can still type the title, runtime and poster link in by hand.";

const hasTmdb = () => TMDB_KEY && TMDB_KEY.indexOf("PASTE") !== 0;

let state  = { items: [], tagOptions: DEFAULT_TAGS.slice() };
let editId = null, openId = null, pickedTags = [];
let filter = "all", fltKind = "all", fltWho = "all", fltPri = "all", fltTag = "all", sortBy = "priority";
let pendingLookup = null;
let saving = false, docRef = null, saveTimer = null;

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const toHttps = u => (u || "").replace(/^http:\/\//, "https://");

function setSync(s, t){ const e = $("sync"); e.dataset.state = s; e.textContent = t; }

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

function hm(min){
  min = Math.max(0, Math.round(min || 0));
  const h = Math.floor(min / 60), m = min % 60;
  if(!h) return m + "m";
  return h + "h" + (m ? " " + m + "m" : "");
}

/* ---------------- who ---------------- */
const WHO_LABEL = { together:"Both", danni:"D only", brendon:"B only" };

/* ---------------- priority ----------------
   Two raters, three levels each, so the average only ever lands on
   1, 1.5, 2, 2.5 or 3. Five clean labels, no decimals on screen. */
function priAvg(item){
  const vals = [item.priD || 0, item.priB || 0].filter(v => v > 0);
  if(!vals.length) return 0;
  return vals.reduce((a,b) => a + b, 0) / vals.length;
}

function priLabel(avg){
  if(!avg) return "";
  if(avg >= 3)    return "High";
  if(avg >= 2.5)  return "Med–High";
  if(avg >= 2)    return "Medium";
  if(avg >= 1.5)  return "Low–Med";
  return "Low";
}

function priTier(avg){
  if(!avg) return "none";
  if(avg >= 2.5) return "high";
  if(avg >= 1.5) return "mid";
  return "low";
}

/* ---------------- progress maths ---------------- */
function totals(item){
  if(item.type === "movie"){
    const total = item.runtime || 0;
    return { done: Math.min(item.watchedMin || 0, total), total: total, kind: total ? "movie" : "none" };
  }
  if(Array.isArray(item.seasons) && item.seasons.length){
    let done = 0, total = 0;
    item.seasons.forEach(s => { done += (s.watched || 0); total += (s.episodes || 0); });
    return { done: done, total: total, kind: total ? "series" : "none" };
  }
  return { done: 0, total: 0, kind: "none" };
}

function pctOf(item){
  const t = totals(item);
  if(t.kind === "none") return item.status === "watched" ? 1 : 0;
  return t.total ? t.done / t.total : 0;
}

function position(item){
  const t = totals(item);
  if(t.kind === "none") return "";
  if(t.done >= t.total) return "Finished";
  if(t.kind === "movie"){
    if(!t.done) return hm(t.total);
    return "Up to " + hm(t.done) + " of " + hm(t.total);
  }
  for(const s of item.seasons){
    if((s.watched || 0) < (s.episodes || 0)){
      return "Up next: S" + s.number + " E" + ((s.watched || 0) + 1);
    }
  }
  return "";
}

function syncStatus(item){
  const t = totals(item);
  if(t.kind === "none" || !t.total) return;
  if(t.done === 0)          item.status = "want";
  else if(t.done < t.total) item.status = "watching";
  else                      item.status = "watched";
}

/* ---------------- migration ----------------
   Older entries predate who/priority. Fill in sane defaults, and turn the
   old "Together" tag into the proper field. */
function migrate(){
  let touched = false;
  state.items.forEach(it => {
    if(!it.who){
      it.who = "together";
      touched = true;
    }
    if(Array.isArray(it.tags) && it.tags.includes("Together")){
      it.tags = it.tags.filter(t => t !== "Together");
      it.who = "together";
      touched = true;
    }
    if(it.priD == null){ it.priD = 0; touched = true; }
    if(it.priB == null){ it.priB = 0; touched = true; }
  });
  if(Array.isArray(state.tagOptions) && state.tagOptions.includes("Together")){
    state.tagOptions = state.tagOptions.filter(t => t !== "Together");
    touched = true;
  }
  return touched;
}

/* ---------------- storage ---------------- */
function loadCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && Array.isArray(p.items)) state = p;
    }
  }catch(e){}
  if(!Array.isArray(state.tagOptions) || !state.tagOptions.length) state.tagOptions = DEFAULT_TAGS.slice();
  migrate();
}
function writeCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(state)); }catch(e){} }

function startFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    docRef = firebase.firestore().doc(DOC_PATH);
    docRef.onSnapshot(snap => {
      if(saving) return;
      if(!snap.exists){ save(); return; }
      const d = snap.data();
      state = {
        items: Array.isArray(d.items) ? d.items : [],
        tagOptions: Array.isArray(d.tagOptions) && d.tagOptions.length ? d.tagOptions : DEFAULT_TAGS.slice()
      };
      const changed = migrate();
      writeCache();
      renderTagFilter();
      render();
      if(openId) openDetail(openId);
      setSync("idle","Synced");
      if(changed) save();          // push the tidied-up records back once
    }, err => { console.error(err); setSync("error","Offline — this device only"); });
  }catch(e){ console.error(e); setSync("error","Offline — this device only"); }
}

function save(){
  writeCache();
  renderTagFilter();
  render();
  if(openId) openDetail(openId);
  if(!docRef) return;
  setSync("saving","Saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saving = true;
    docRef.set({ items: state.items, tagOptions: state.tagOptions, updated: Date.now() })
      .then(() => setSync("idle","Synced"))
      .catch(e => { console.error(e); setSync("error","Couldn't save"); })
      .finally(() => { saving = false; });
  }, 500);
}

/* ---------------- lookup ---------------- */
function lookup(q){
  return ($("fType").value === "movie") ? lookupMovie(q) : lookupSeries(q);
}

function showResults(rows, onPick){
  const box = $("results");
  box.innerHTML = "";
  if(!rows.length){
    $("lookupHint").textContent = "Nothing found. Check the spelling, or fill it in by hand.";
    box.classList.remove("open");
    return;
  }
  $("lookupHint").textContent = "Pick the right one:";
  rows.forEach(r => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cq-result";
    b.innerHTML =
      (r.image ? `<img src="${esc(r.image)}" alt="" loading="lazy">`
               : `<div class="cq-poster-none" style="font-size:.8rem;">${esc(r.name)}</div>`) +
      `<div class="cq-rname">${esc(r.name)}</div>` +
      `<div class="cq-rmeta">${esc(r.meta)}</div>`;
    b.onclick = () => onPick(r);
    box.appendChild(b);
  });
  box.classList.add("open");
}

function lookupSeries(q){
  $("lookupHint").textContent = "Searching…";
  fetch(TVMAZE + "/search/shows?q=" + encodeURIComponent(q))
    .then(r => r.json())
    .then(rows => {
      showResults(rows.slice(0,8).map(row => {
        const s = row.show;
        const year = s.premiered ? s.premiered.slice(0,4) : "";
        const net  = (s.network && s.network.name) || (s.webChannel && s.webChannel.name) || "";
        return {
          raw: s,
          name: s.name,
          image: s.image ? toHttps(s.image.medium) : "",
          full:  s.image ? toHttps(s.image.original || s.image.medium) : "",
          meta: [year, net].filter(Boolean).join(" · ")
        };
      }), pickSeries);
    })
    .catch(e => { console.error(e); $("lookupHint").textContent = "Lookup failed — fill it in by hand."; });
}

function pickSeries(r){
  $("fTitle").value = r.name;
  $("fImage").value = r.full;
  $("results").classList.remove("open");
  $("lookupHint").textContent = "Fetching seasons…";

  fetchSeasons(r.raw.id)
    .then(seasons => {
      pendingLookup = { type:"series", tvmazeId: r.raw.id, seasons: seasons };
      const eps = seasons.reduce((n,s) => n + s.episodes, 0);
      $("lookupHint").textContent =
        seasons.length + (seasons.length === 1 ? " season, " : " seasons, ") + eps + " episodes found.";
    })
    .catch(e => {
      console.error(e);
      pendingLookup = { type:"series", tvmazeId: r.raw.id, seasons: [] };
      $("lookupHint").textContent = "Got the show, but the seasons didn't load. Try Refresh seasons after saving.";
    });
}

function lookupMovie(q){
  if(!hasTmdb()){ $("lookupHint").textContent = HINT_NOKEY; return; }
  $("lookupHint").textContent = "Searching…";
  fetch(TMDB + "/search/movie?api_key=" + encodeURIComponent(TMDB_KEY) +
        "&include_adult=false&query=" + encodeURIComponent(q))
    .then(r => { if(r.status === 401) throw new Error("bad key"); return r.json(); })
    .then(data => {
      showResults((data.results || []).slice(0,8).map(m => ({
        raw: m,
        name: m.title,
        image: m.poster_path ? (TMDB_IMG + m.poster_path) : "",
        full:  m.poster_path ? (TMDB_IMG + m.poster_path) : "",
        meta: m.release_date ? m.release_date.slice(0,4) : ""
      })), pickMovie);
    })
    .catch(e => {
      console.error(e);
      $("lookupHint").textContent = (e.message === "bad key")
        ? "TMDB rejected that key. Check it was copied whole."
        : "Film lookup failed — fill it in by hand.";
    });
}

function pickMovie(r){
  $("fTitle").value = r.name;
  $("fImage").value = r.full;
  $("results").classList.remove("open");
  $("lookupHint").textContent = "Fetching runtime…";

  fetch(TMDB + "/movie/" + r.raw.id + "?api_key=" + encodeURIComponent(TMDB_KEY))
    .then(res => res.json())
    .then(d => {
      const mins = d.runtime || 0;
      $("fRuntime").value = mins || "";
      pendingLookup = { type:"movie", runtime: mins };
      $("lookupHint").textContent = mins ? ("Runtime " + hm(mins) + ".") : "No runtime listed — type it in.";
    })
    .catch(e => { console.error(e); $("lookupHint").textContent = "Got the film, but no runtime came back. Type it in."; });
}

function fetchSeasons(showId){
  return fetch(TVMAZE + "/shows/" + showId + "?embed=episodes")
    .then(r => r.json())
    .then(data => {
      const eps = (data._embedded && data._embedded.episodes) || [];
      const bySeason = {};
      eps.forEach(ep => {
        if(!ep.season || ep.number == null) return;
        bySeason[ep.season] = (bySeason[ep.season] || 0) + 1;
      });
      return Object.keys(bySeason).map(Number).sort((a,b) => a - b)
        .map(n => ({ number:n, episodes:bySeason[n], watched:0 }));
    });
}

function mergeSeasons(oldSeasons, fresh){
  const prev = {};
  (oldSeasons || []).forEach(s => { prev[s.number] = s.watched || 0; });
  return fresh.map(s => ({
    number: s.number,
    episodes: s.episodes,
    watched: Math.min(prev[s.number] || 0, s.episodes)
  }));
}

/* ---------------- filter + sort ---------------- */
const LABEL = { want:"Want to watch", watching:"Watching", watched:"Watched" };
const NEXT  = { want:"watching", watching:"watched", watched:"want" };

function visibleItems(){
  let rows = state.items.filter(i => {
    if(filter !== "all"  && i.status !== filter) return false;
    if(fltKind !== "all" && (i.type || "series") !== fltKind) return false;
    if(fltWho !== "all"  && (i.who || "together") !== fltWho) return false;
    if(fltTag !== "all"  && !(i.tags || []).includes(fltTag)) return false;
    if(fltPri !== "all"){
      const tier = priTier(priAvg(i));
      if(fltPri === "none" && tier !== "none") return false;
      if(fltPri !== "none" && tier !== fltPri) return false;
    }
    return true;
  });

  rows.sort((a,b) => {
    if(sortBy === "title")    return a.title.localeCompare(b.title, undefined, { sensitivity:"base" });
    if(sortBy === "added")    return (b.added || 0) - (a.added || 0);
    if(sortBy === "progress"){
      const d = pctOf(b) - pctOf(a);
      return d !== 0 ? d : a.title.localeCompare(b.title);
    }
    /* priority: rated things first, then by score, then title */
    const d = priAvg(b) - priAvg(a);
    return d !== 0 ? d : a.title.localeCompare(b.title);
  });

  return rows;
}

function renderTagFilter(){
  const sel = $("fltTag");
  const keep = sel.value;
  sel.innerHTML = '<option value="all">All</option>';
  state.tagOptions.forEach(t => {
    const o = document.createElement("option");
    o.value = t; o.textContent = t;
    sel.appendChild(o);
  });
  sel.value = state.tagOptions.includes(keep) ? keep : "all";
  fltTag = sel.value;
}

/* ---------------- render ---------------- */
function render(){
  const grid  = $("grid");
  const shown = visibleItems();
  grid.innerHTML = "";
  $("empty").style.display = shown.length ? "none" : "block";
  $("empty").textContent = state.items.length ? "Nothing matches those filters." : "Nothing here yet. Add the first one.";

  shown.forEach(item => {
    const t = totals(item);
    const card = document.createElement("div");
    card.className = "cq-card" + (item.status === "watched" ? " is-done" : "");

    const art = item.image
      ? `<img class="cq-poster" src="${esc(item.image)}" alt="" loading="lazy"
           onerror="this.outerHTML='<div class=&quot;cq-poster-none&quot;>${esc(item.title)}</div>'">`
      : `<div class="cq-poster-none">${esc(item.title)}</div>`;

    const ring = (t.kind !== "none")
      ? `<div class="cq-ring"><div class="pp-progress-ring" data-color="pink"
           data-current="${t.done}" data-total="${t.total}" data-size="38"></div></div>`
      : "";

    const who = item.who || "together";
    const whoBadge = `<span class="cq-who" data-who="${who}">${esc(WHO_LABEL[who])}</span>`;

    const avg = priAvg(item);
    const pri = avg
      ? `<span class="cq-pri" data-tier="${priTier(avg)}">${esc(priLabel(avg))}</span>`
      : "";

    const where = position(item);
    const tags  = (item.tags || []).map(x => `<span>${esc(x)}</span>`).join("");

    card.innerHTML = `
      <div class="cq-posterwrap" data-open="${item.id}">${art}${whoBadge}${ring}</div>
      <div class="cq-tools">
        <button data-edit="${item.id}" aria-label="Edit ${esc(item.title)}">✎</button>
        <button data-del="${item.id}" aria-label="Remove ${esc(item.title)}">✕</button>
      </div>
      <div class="cq-body">
        <h3 class="cq-name">${esc(item.title)}</h3>
        ${where ? `<div class="cq-where">${esc(where)}</div>` : ""}
        <div class="cq-meta">
          <button class="cq-status" data-status="${item.status}" data-cycle="${item.id}">${LABEL[item.status]}</button>
          ${pri}
        </div>
        ${tags ? `<div class="cq-tags">${tags}</div>` : ""}
      </div>`;
    grid.appendChild(card);
  });

  PPProgress.draw(grid);

  const done = state.items.filter(i => i.status === "watched").length;
  const base = state.items.length ? `${done} watched of ${state.items.length}` : "";
  $("count").textContent = (shown.length !== state.items.length)
    ? `Showing ${shown.length} of ${state.items.length} · ${base}`
    : base;
}

function openDetail(id){
  const item = state.items.find(x => x.id === id);
  if(!item){ closeDetail(); return; }
  openId = id;

  const t = totals(item);
  const avg = priAvg(item);
  $("dTitle").textContent = item.title;
  $("dImg").src = item.image || "";
  $("dImg").style.display = item.image ? "" : "none";

  const bits = [position(item) || LABEL[item.status], WHO_LABEL[item.who || "together"]];
  if(avg){
    const pieces = [];
    if(item.priD) pieces.push("D " + ["","low","med","high"][item.priD]);
    if(item.priB) pieces.push("B " + ["","low","med","high"][item.priB]);
    bits.push(priLabel(avg) + " priority (" + pieces.join(", ") + ")");
  }
  $("dMeta").textContent = bits.join(" · ");

  const overall = $("dOverall");
  overall.setAttribute("data-current", t.done);
  overall.setAttribute("data-total", t.total || 0);
  overall.setAttribute("data-label", t.kind === "movie" ? "Runtime" : "Overall");
  overall.setAttribute("data-text",
    t.kind === "movie" ? (hm(t.done) + " of " + hm(t.total)) : (t.done + " of " + t.total));
  overall.style.display = (t.kind !== "none") ? "" : "none";

  const body = $("detailBody");
  body.innerHTML = "";
  $("refetchBtn").style.display = (item.type === "series") ? "" : "none";

  if(item.type === "movie"){
    if(!item.runtime){
      body.innerHTML = `<p class="pp-empty">No runtime set. Edit this one and add it.</p>`;
    }else{
      const row = document.createElement("div");
      row.className = "cq-block";
      row.innerHTML = `
        <div class="cq-block-head">
          <span class="cq-block-name">Where we are</span>
          <span class="cq-block-count">${hm(item.watchedMin || 0)} of ${hm(item.runtime)}</span>
        </div>
        <div class="cq-step">
          <button data-min="-15">−15</button>
          <button data-min="-5">−5</button>
          <button data-min="5">+5</button>
          <button data-min="15">+15</button>
          <span class="cq-steplabel">or jump to</span>
          <input id="minInput" type="number" min="0" max="${item.runtime}" step="1" value="${item.watchedMin || 0}">
          <span class="cq-steplabel">min</span>
          <button data-min="finish">Finished</button>
          <button data-min="restart">Start over</button>
        </div>`;
      body.appendChild(row);
    }
  }else{
    if(t.kind === "none"){
      body.innerHTML = `<p class="pp-empty">No seasons yet. Use Refresh seasons to pull them in.</p>`;
    }else{
      item.seasons.forEach(s => {
        const row = document.createElement("div");
        row.className = "cq-block";
        row.innerHTML = `
          <div class="cq-block-head">
            <span class="cq-block-name">Season ${s.number}</span>
            <span class="cq-block-count">${s.watched || 0} of ${s.episodes}</span>
          </div>
          <div class="pp-chips" data-color="pink" data-clickable="true" data-chip-label="EP"
               data-season="${s.number}" data-current="${s.watched || 0}" data-total="${s.episodes}"></div>
          <div class="cq-step">
            <button data-minus="${s.number}">− one</button>
            <button data-plus="${s.number}">+ one</button>
            <button data-all="${s.number}">Whole season</button>
            <button data-none="${s.number}">Clear</button>
          </div>`;
        body.appendChild(row);
      });
    }
  }

  $("detail").classList.add("open");
  PPProgress.draw($("detail"));
}

function closeDetail(){ openId = null; $("detail").classList.remove("open"); }

function setSeason(itemId, seasonNo, watched){
  const item = state.items.find(x => x.id === itemId);
  if(!item) return;
  const s = (item.seasons || []).find(x => x.number === seasonNo);
  if(!s) return;
  s.watched = Math.max(0, Math.min(watched, s.episodes));
  syncStatus(item);
  save();
}

function setMinutes(itemId, mins){
  const item = state.items.find(x => x.id === itemId);
  if(!item || !item.runtime) return;
  item.watchedMin = Math.max(0, Math.min(Math.round(mins), item.runtime));
  syncStatus(item);
  save();
}

function renderTagPicker(){
  const box = $("tagPick");
  box.innerHTML = "";
  state.tagOptions.forEach(tag => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = tag;
    b.setAttribute("aria-pressed", pickedTags.includes(tag) ? "true" : "false");
    b.onclick = () => {
      pickedTags = pickedTags.includes(tag) ? pickedTags.filter(t => t !== tag) : pickedTags.concat(tag);
      renderTagPicker();
    };
    box.appendChild(b);
  });
}

/* ---------------- form ---------------- */
function syncTypeUI(){
  const isMovie = $("fType").value === "movie";
  $("runtimeField").classList.toggle("hidden", !isMovie);
  $("lookupHint").textContent = isMovie ? (hasTmdb() ? HINT_MOVIE : HINT_NOKEY) : HINT_SERIES;
  $("lookupBtn").style.display = (isMovie && !hasTmdb()) ? "none" : "";
  $("fTitle").placeholder = isMovie ? "Practical Magic" : "Over the Garden Wall";
  $("results").classList.remove("open");
}

function openForm(item){
  closeDetail();
  editId = item ? item.id : null;
  pendingLookup = null;
  pickedTags = item ? (item.tags || []).slice() : [];
  $("formTitle").textContent = item ? "Edit" : "Add something";
  $("fTitle").value   = item ? item.title : "";
  $("fImage").value   = item ? (item.image || "") : "";
  $("fStatus").value  = item ? item.status : "want";
  $("fType").value    = item ? (item.type || "series") : "series";
  $("fWho").value     = item ? (item.who || "together") : "together";
  $("fPriD").value    = item ? String(item.priD || 0) : "0";
  $("fPriB").value    = item ? String(item.priB || 0) : "0";
  $("fRuntime").value = item && item.runtime ? item.runtime : "";
  $("fNewTag").value  = "";
  syncTypeUI();
  $("deleteBtn").style.display = item ? "inline-block" : "none";
  renderTagPicker();
  $("form").classList.add("open");
  $("fTitle").focus();
}
function closeForm(){ $("form").classList.remove("open"); editId = null; pickedTags = []; pendingLookup = null; }

/* ---------------- events ---------------- */
$("addBtn").onclick      = () => openForm(null);
$("cancelBtn").onclick   = closeForm;
$("detailClose").onclick = closeDetail;
$("fType").onchange      = syncTypeUI;

$("lookupBtn").onclick = () => { const q = $("fTitle").value.trim(); if(q) lookup(q); };
$("fTitle").onkeydown  = e => { if(e.key === "Enter"){ e.preventDefault(); $("lookupBtn").click(); } };

$("saveBtn").onclick = () => {
  const title = $("fTitle").value.trim();
  if(!title){ $("fTitle").focus(); return; }

  const isMovie = $("fType").value === "movie";
  const payload = {
    title: title,
    image: $("fImage").value.trim(),
    status: $("fStatus").value,
    type: $("fType").value,
    who: $("fWho").value,
    priD: parseInt($("fPriD").value, 10) || 0,
    priB: parseInt($("fPriB").value, 10) || 0,
    tags: pickedTags.slice(),
    runtime: isMovie ? (parseInt($("fRuntime").value, 10) || 0) : 0
  };

  if(editId){
    const i = state.items.findIndex(x => x.id === editId);
    if(i > -1){
      const merged = Object.assign({}, state.items[i], payload);
      if(pendingLookup && pendingLookup.type === "series"){
        merged.tvmazeId = pendingLookup.tvmazeId;
        merged.seasons  = mergeSeasons(state.items[i].seasons, pendingLookup.seasons);
      }
      if(isMovie) merged.watchedMin = Math.min(merged.watchedMin || 0, merged.runtime);
      state.items[i] = merged;
    }
  }else{
    const item = Object.assign({ id: uid(), added: Date.now(), seasons: [], watchedMin: 0 }, payload);
    if(pendingLookup && pendingLookup.type === "series"){
      item.tvmazeId = pendingLookup.tvmazeId;
      item.seasons  = pendingLookup.seasons;
    }
    if(item.status === "watched"){
      if(isMovie) item.watchedMin = item.runtime;
      else item.seasons.forEach(s => { s.watched = s.episodes; });
    }
    state.items.unshift(item);
  }
  closeForm();
  save();
};

$("deleteBtn").onclick = () => {
  if(!editId) return;
  const item = state.items.find(x => x.id === editId);
  if(!confirm(`Remove "${item ? item.title : "this"}" from the list?`)) return;
  state.items = state.items.filter(x => x.id !== editId);
  closeForm();
  save();
};

$("refetchBtn").onclick = () => {
  const item = state.items.find(x => x.id === openId);
  if(!item) return;
  if(!item.tvmazeId){ alert("This one wasn't added by lookup. Edit it and use Look it up first."); return; }
  $("dMeta").textContent = "Refreshing…";
  fetchSeasons(item.tvmazeId)
    .then(fresh => { item.seasons = mergeSeasons(item.seasons, fresh); syncStatus(item); save(); })
    .catch(e => { console.error(e); $("dMeta").textContent = "Refresh failed."; });
};

$("fNewTag").onkeydown = e => {
  if(e.key !== "Enter") return;
  e.preventDefault();
  const tag = e.target.value.trim();
  if(!tag) return;
  if(!state.tagOptions.includes(tag)) state.tagOptions.push(tag);
  if(!pickedTags.includes(tag)) pickedTags.push(tag);
  e.target.value = "";
  renderTagPicker();
  renderTagFilter();
};

$("grid").onclick = e => {
  const cycle = e.target.closest("[data-cycle]");
  if(cycle){
    const item = state.items.find(x => x.id === cycle.dataset.cycle);
    if(item){
      item.status = NEXT[item.status];
      const t = totals(item);
      if(t.kind === "movie"){
        if(item.status === "watched") item.watchedMin = item.runtime;
        if(item.status === "want")    item.watchedMin = 0;
      }else if(t.kind === "series"){
        if(item.status === "watched") item.seasons.forEach(s => { s.watched = s.episodes; });
        if(item.status === "want")    item.seasons.forEach(s => { s.watched = 0; });
      }
      save();
    }
    return;
  }
  const edit = e.target.closest("[data-edit]");
  if(edit){ const i = state.items.find(x => x.id === edit.dataset.edit); if(i) openForm(i); return; }

  const del = e.target.closest("[data-del]");
  if(del){
    const i = state.items.find(x => x.id === del.dataset.del);
    if(i && confirm(`Remove "${i.title}" from the list?`)){
      if(openId === i.id) closeDetail();
      state.items = state.items.filter(x => x.id !== i.id);
      save();
    }
    return;
  }
  const open = e.target.closest("[data-open]");
  if(open) openDetail(open.dataset.open);
};

$("detailBody").addEventListener("pp-progress-change", e => {
  const box = e.target.closest("[data-season]");
  if(!box || !openId) return;
  setSeason(openId, parseInt(box.getAttribute("data-season"), 10), e.detail.current);
});

$("detailBody").onclick = e => {
  if(!openId) return;
  const item = state.items.find(x => x.id === openId);
  if(!item) return;

  const minBtn = e.target.closest("[data-min]");
  if(minBtn){
    const v = minBtn.getAttribute("data-min");
    if(v === "finish")       setMinutes(openId, item.runtime);
    else if(v === "restart") setMinutes(openId, 0);
    else                     setMinutes(openId, (item.watchedMin || 0) + parseInt(v, 10));
    return;
  }

  const btn = e.target.closest("[data-plus],[data-minus],[data-all],[data-none]");
  if(!btn) return;
  const attr = ["data-plus","data-minus","data-all","data-none"].find(a => btn.hasAttribute(a));
  const no = parseInt(btn.getAttribute(attr), 10);
  const s = (item.seasons || []).find(x => x.number === no);
  if(!s) return;

  if(attr === "data-plus")  setSeason(openId, no, (s.watched || 0) + 1);
  if(attr === "data-minus") setSeason(openId, no, (s.watched || 0) - 1);
  if(attr === "data-all")   setSeason(openId, no, s.episodes);
  if(attr === "data-none")  setSeason(openId, no, 0);
};

$("detailBody").onchange = e => {
  if(e.target.id === "minInput" && openId) setMinutes(openId, parseInt(e.target.value, 10) || 0);
};

/* filters */
document.querySelectorAll(".cq-filter").forEach(btn => {
  btn.onclick = () => {
    filter = btn.dataset.filter;
    document.querySelectorAll(".cq-filter").forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
    render();
  };
});

$("fltKind").onchange = e => { fltKind = e.target.value; render(); };
$("fltWho").onchange  = e => { fltWho  = e.target.value; render(); };
$("fltPri").onchange  = e => { fltPri  = e.target.value; render(); };
$("fltTag").onchange  = e => { fltTag  = e.target.value; render(); };
$("sortBy").onchange  = e => { sortBy  = e.target.value; render(); };

$("resetBtn").onclick = () => {
  filter = fltKind = fltWho = fltPri = fltTag = "all";
  $("fltKind").value = $("fltWho").value = $("fltPri").value = $("fltTag").value = "all";
  document.querySelectorAll(".cq-filter").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.filter === "all" ? "true" : "false"));
  render();
};

loadCache();
renderTagFilter();
render();
startFirebase();
</script>
</body>
</html>
