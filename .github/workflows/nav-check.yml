name: Nav Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-nav-links:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check pp-nav.js links resolve to real files
        run: python .github/scripts/check_nav_links.py
