<style>
/* ---- meal planner only ---- */
.btn{ margin-top:0; }

.weeknav{ display:flex; justify-content:center; align-items:center; gap:14px; margin-bottom:16px; }
.weeknav strong{ font-family:var(--font-serif); font-size:1.1rem; }
.toolbar{ text-align:center; margin-bottom:20px; }

.day-block{ padding:12px 0; border-bottom:1px solid var(--line); }
.day-block:last-child{ border-bottom:none; }
.day-heading{ font-family:var(--font-serif); font-weight:600; font-size:1.05rem; margin-bottom:6px; }
.day-date{ font-family:var(--font-body); font-weight:400; font-size:.8rem; color:var(--ink-soft); margin-left:6px; }
.day-row{ display:flex; align-items:center; gap:12px; padding:4px 0; flex-wrap:wrap; }
.meal-label{ width:64px; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); }
.day-select{ flex:1 1 220px; min-width:0; font-family:var(--font-body); font-size:.92rem; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff; }

/* Lunch is worked out for you and just shown as words. "Change" swaps the
   words for a short box to type your own; "Automatic" swaps back. */
.lunch-auto{ flex:1 1 160px; font-size:.92rem; }
.lunch-auto.none{ color:var(--ink-soft); font-style:italic; }
.lunch-text, .dinner-other{ flex:1 1 110px; min-width:0; max-width:240px; font-family:var(--font-body); font-size:.92rem; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff; }

/* Under each dinner: one tick per day it makes lunch for. Days on or before
   the night it's cooked are greyed out (.off), and so are days another
   dinner already covers or that have a typed lunch (.taken). After the ticks
   comes the leftover count, which turns red when it's ticked for more
   lunches than the recipe makes. */
.lunch-for{ display:flex; align-items:center; gap:4px 10px; flex-wrap:wrap; flex:1 1 220px; }
.lunch-for-caption{ font-size:.78rem; color:var(--ink-soft); }
.lf-day{ display:inline-flex; flex-direction:column; align-items:center; gap:1px; font-size:.66rem; letter-spacing:.03em; color:var(--ink-soft); cursor:pointer; }
.lf-day input{ margin:0; width:16px; height:16px; accent-color:var(--sage-deep); cursor:pointer; }
.lf-day.off{ opacity:.35; cursor:default; }
.lf-day.off input{ cursor:default; }
.lf-day.taken{ opacity:.6; cursor:not-allowed; }
.lf-day.taken input{ cursor:not-allowed; }
.lf-left{ font-size:.78rem; color:var(--ink-soft); white-space:nowrap; }
.lf-left.short{ color:var(--burgundy); font-weight:600; }
.lf-reset{ background:none; border:none; padding:0 2px; font-family:var(--font-body); font-size:.74rem; color:var(--sage-deep); text-decoration:underline; cursor:pointer; }

.two-col{ display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
.two-col > .panel{ flex:1 1 320px; margin-bottom:0; }
.plan-and-shop{ margin-bottom:18px; align-items:stretch; }
.plan-and-shop > .panel{ flex:1 1 400px; }
@media (max-width: 900px){ .plan-and-shop > .panel + .panel{ margin-top:18px; } }

.shop-cat{ margin-bottom:16px; }
.shop-cat h4{ color:var(--sage-deep); margin-bottom:6px; }
.shop-item{ display:flex; align-items:flex-start; gap:8px; padding:4px 0; font-size:.92rem; }
.shop-item.checked label{ text-decoration:line-through; color:var(--ink-soft); }
.shop-item small{ display:block; color:var(--ink-soft); font-size:.74rem; }
.addextra{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.addextra input{ flex:1 1 120px; font-family:var(--font-body); padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-sm); }

.pantry-rail{ position:fixed; top:50%; right:0; transform:translateY(-50%); z-index:120;
  display:flex; flex-direction:column; gap:5px; align-items:flex-end; }
.pantry-tab-btn{ background:var(--sage); color:#fff; border:none; border-radius:12px 0 0 12px;
  padding:11px 8px; font-family:var(--font-body); font-size:.66rem; font-weight:600;
  text-transform:uppercase; letter-spacing:.06em; cursor:pointer;
  writing-mode:vertical-rl; text-orientation:mixed;
  box-shadow:-3px 0 12px rgba(46,36,31,.16); transition:background .15s ease, padding .15s ease; }
.pantry-tab-btn:hover{ background:var(--sage-deep); padding-right:12px; }
.pantry-tab-btn:nth-child(even){ background:var(--sage-deep); }
.pantry-tab-btn:nth-child(even):hover{ background:var(--sage); }
.rail-dot{ display:inline-block; background:var(--pink); color:#fff; border-radius:999px;
  padding:1px 5px; margin-top:6px; font-size:.6rem; }
.pantry-count{ font-size:.72rem; color:var(--ink-soft); font-style:italic; margin:0 0 8px; }
.shop-qty{ font-weight:500; }
.pantry-item{ display:flex; align-items:flex-start; gap:8px; padding:3px 0; font-size:.9rem; line-height:1.4; }
.pantry-item-body{ flex:1; min-width:0; }
.pantry-item label{ cursor:default; }
.pantry-remove{ flex:0 0 auto; background:none; border:none; cursor:pointer; padding:0 2px;
  font-size:1.05rem; line-height:1.2; color:var(--line-strong); }
.pantry-remove:hover{ color:var(--burgundy); }
.pantry-item.checked > label{ color:var(--sage-deep); font-weight:500; }
.pantry-item.needed{ background:var(--parchment); border:1px solid var(--parchment-border); border-radius:var(--radius-sm); padding:5px 8px; margin:0 -8px 4px; }
.pantry-item input[type=checkbox]{ margin-top:3px; }
.needed-badge{ display:block; font-size:.72rem; color:var(--gold); font-style:italic; margin-top:2px; }

.pantry-overlay{ position:fixed; inset:0; background:rgba(46,36,31,.35); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:150; }
.pantry-overlay.open{ opacity:1; pointer-events:auto; }
.pantry-sidebar{ position:fixed; top:0; right:-340px; width:320px; max-width:88vw; height:100vh;
  background:var(--panel); box-shadow:-10px 0 28px rgba(46,36,31,.2); padding:22px; overflow-y:auto;
  transition:right .25s ease; z-index:200; }
.pantry-sidebar.open{ right:0; }
.pantry-sidebar-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.pantry-close{ background:none; border:none; font-size:1.4rem; line-height:1; cursor:pointer; color:var(--ink-soft); }
.pantry-close:hover{ color:var(--sage-deep); }

/* ---- the printed week ----
   A plain one-page table of the week, filled in by renderPrintSheet(). It's
   hidden on screen; on paper (or "Save as PDF") it's the only thing shown. */
.print-sheet{ display:none; }
@media print{
  @page{ margin:16mm; }
  body{ background:#fff !important; }
  .pp-ribbon, .weeknav, .toolbar, .plan-and-shop, .pantry-rail, .pantry-overlay, .pantry-sidebar{ display:none !important; }
  .shell{ max-width:none; margin:0; padding:0; }
  .print-sheet{ display:block; color:#000; }
  .print-sheet h1{ font-family:var(--font-serif); font-size:26pt; font-weight:600; margin:0; text-align:center; }
  .print-week{ font-family:var(--font-body); font-size:12pt; text-align:center; margin:4pt 0 16pt; }
  .print-sheet table{ width:100%; border-collapse:collapse; font-family:var(--font-body); font-size:12pt; }
  .print-sheet th{ text-align:left; font-size:9pt; text-transform:uppercase; letter-spacing:.06em; padding:0 10pt 6pt; border-bottom:1.5pt solid #000; }
  .print-sheet td{ padding:11pt 10pt; border-bottom:.5pt solid #999; vertical-align:top; }
  .print-sheet tr{ break-inside:avoid; }
  .print-sheet .print-day{ width:24%; font-family:var(--font-serif); font-size:14pt; font-weight:600; white-space:nowrap; }
  .print-sheet .print-day small{ display:block; font-family:var(--font-body); font-size:9pt; font-weight:400; }
  .print-sheet .print-none{ color:#777; }
}
</style>

<script>
/* ============ FIREBASE SETUP ============
   Shared across Recipe Construction, Meal Planner, and Recipe Book —
   all three pages read and write the same Firestore document. */
const firebaseConfig = window.PPFirebaseConfig;
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// No login: everything reads/writes this one fixed document — same
// tradeoff as the quest log, fine for a private site nobody else knows
// the address of.
const mealDocRef = db.collection('mealplanning').doc('danni-meal-plan');

/* ============ STATE LAYER ============
   State lives in Firestore, with localStorage kept only as a same-device
   cache so the page has something to show instantly on load. */
const MEAL_STORE_KEY = 'pp-mealplanning-v1';

function defaultMealState(){
  return {
    recipes: [],
    tagOptions: ['beef','chicken','turkey','pork','pasta','quick','2 servings','4 servings','6 servings','8 servings','kid friendly','oven','stove top','slow cooker','air fryer','toaster oven'],
    mealplan: {},
    shoppingExtras: {},
    shoppingChecked: {},
    pantryItems: JSON.parse(JSON.stringify(DEFAULT_PANTRY_GROUPS)),
    pantryChecked: {}
  };
}
function loadLegacyMealState(){
  function legacyJSON(key, fallback){
    try{ const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }catch(e){ return fallback; }
  }
  const d = defaultMealState();
  return {
    recipes: legacyJSON('pp_recipes', d.recipes),
    tagOptions: legacyJSON('pp_tag_options', d.tagOptions),
    mealplan: legacyJSON('pp_mealplan', d.mealplan),
    shoppingExtras: legacyJSON('pp_shopping_extras', d.shoppingExtras),
    shoppingChecked: legacyJSON('pp_shopping_checked', d.shoppingChecked),
    pantryItems: legacyJSON('pp_pantry_items', d.pantryItems),
    pantryChecked: legacyJSON('pp_pantry_checked', d.pantryChecked)
  };
}
function saveMealState(){
  localStorage.setItem(MEAL_STORE_KEY, JSON.stringify(mealState));
  mealDocRef.set(mealState).catch(err => console.error('Sync to Firestore failed:', err));
}
async function loadMealStateFromFirestore(){
  const snap = await mealDocRef.get();
  if (snap.exists){
    mealState = Object.assign(defaultMealState(), snap.data());
  } else {
    const raw = localStorage.getItem(MEAL_STORE_KEY);
    mealState = raw ? Object.assign(defaultMealState(), JSON.parse(raw)) : loadLegacyMealState();
    await mealDocRef.set(mealState);
  }
  localStorage.setItem(MEAL_STORE_KEY, JSON.stringify(mealState));
}
let mealState = null;

const RECIPES_KEY = 'pp_recipes';
const PLAN_KEY = 'pp_mealplan';
const EXTRAS_KEY = 'pp_shopping_extras';
const CHECKED_KEY = 'pp_shopping_checked';
// The meal-plan logic shared with the home page lives in /assets/pp-meals.js:
// what a day holds, the no-recipe dinners, and how lunches are worked out.
const { DAY_KEYS, DAY_LABELS, DINNER_SPECIALS, isRecipeChoice, normalizeDay, weekStartOf } = PPMeals;

const MEAL_KEY_FIELD_MAP = {
  'pp_recipes': 'recipes',
  'pp_mealplan': 'mealplan',
  'pp_shopping_extras': 'shoppingExtras',
  'pp_shopping_checked': 'shoppingChecked',
  'pp_pantry_items': 'pantryItems',
  'pp_pantry_checked': 'pantryChecked'
};
function loadJSON(key, fallback){
  const field = MEAL_KEY_FIELD_MAP[key];
  if (field){ const v = mealState[field]; return v == null ? fallback : v; }
  try{ return JSON.parse(localStorage.getItem(key)) ?? fallback; }catch(e){ return fallback; }
}
function saveJSON(key, val){
  const field = MEAL_KEY_FIELD_MAP[key];
  if (field){ mealState[field] = val; saveMealState(); return; }
  localStorage.setItem(key, JSON.stringify(val));
}
function uid(){ return 'x_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function getRecipes(){ return loadJSON(RECIPES_KEY, []); }
function getRecipe(id){ return getRecipes().find(r => r.id === id); }

function getHousehold(){ return PPMeals.HOUSEHOLD; } // always 2 people

function addDays(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtLabel(iso){
  const start = new Date(iso+'T00:00:00'); const end = new Date(start); end.setDate(end.getDate()+6);
  const o = { month:'short', day:'numeric' };
  return `${start.toLocaleDateString(undefined,o)} – ${end.toLocaleDateString(undefined,o)}`;
}

let currentWeek = weekStartOf(new Date());

function getPlan(){ return loadJSON(PLAN_KEY, {}); }

// What a day holds (dinner, dinnerOther, lunch, lunchText, lunchFor) is
// written up at the top of /assets/pp-meals.js.
function dinnerName(day){ return PPMeals.dinnerName(day, getRecipe); }
function escHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
}

function getWeekDays(iso){
  const plan = getPlan();
  let changed = false;
  if (!plan[iso]){
    plan[iso] = {}; DAY_KEYS.forEach(k => plan[iso][k] = { dinner: null, lunch: null }); changed = true;
  } else {
    DAY_KEYS.forEach(k => {
      const normalized = normalizeDay(plan[iso][k]);
      if (JSON.stringify(normalized) !== JSON.stringify(plan[iso][k])){ plan[iso][k] = normalized; changed = true; }
    });
  }
  if (changed) saveJSON(PLAN_KEY, plan);
  return plan[iso];
}
// Changes some of a day's fields and saves. To drop an optional field, pass
// null for it — normalizeDay leaves out anything that isn't set.
function updateDay(iso, dayKey, patch){
  const plan = getPlan();
  if (!plan[iso]) getWeekDays(iso);
  const plan2 = getPlan();
  plan2[iso][dayKey] = normalizeDay(Object.assign(normalizeDay(plan2[iso][dayKey]), patch));
  saveJSON(PLAN_KEY, plan2);
}

function history(beforeWeekIso){
  const plan = getPlan();
  const entries = [];
  Object.keys(plan).forEach(w => {
    if (w >= beforeWeekIso) return;
    DAY_KEYS.forEach(k => {
      const day = normalizeDay(plan[w][k]);
      if (isRecipeChoice(day.dinner)) entries.push({ week: w, recipeId: day.dinner });
    });
  });
  return entries;
}

function buildWeek(){
  const recipes = getRecipes().filter(r => r.active !== false); // "out of circulation" recipes sit out of auto-fill
  if (!recipes.length){ alert('No recipes in circulation to build from — add some in Recipe Construction, or put an existing one back in circulation.'); return; }

  const days = getWeekDays(currentWeek);
  const hist = history(currentWeek);
  const usedLastWeek = new Set(hist.filter(h => h.week >= addDays(currentWeek, -7)).map(h => h.recipeId));
  const usedLast3 = new Set(hist.filter(h => h.week >= addDays(currentWeek, -21)).map(h => h.recipeId));

  const eligible = (r) => {
    if (r.frequency === 'biweekly') return !usedLastWeek.has(r.id);
    if (r.frequency === 'occasional') return !usedLast3.has(r.id);
    return true;
  };

  // Sunday & Tuesday are batch-cook nights that need to stretch into lunches,
  // so they're restricted to recipes tagged for a big enough batch.
  // Thursday defaults to a recipe marked "Date Night Default", unless you've
  // already chosen something for that night. Mon/Wed/Fri stick to smaller
  // 2-4 serving meals, and Saturday is reserved for kid-friendly recipes.
  const hasTag = (r, tag) => (r.tags || []).includes(tag);
  const hasMethod = (r, method) => (r.methods || (r.method ? [r.method] : [])).includes(method);
  const DAY_TAG_RULES = {
    Tue: (r) => hasTag(r, '6 servings'),
    Sun: (r) => hasTag(r, '6 servings') || hasTag(r, '8 servings'),
    Thu: (r) => r.frequency === 'date-night',
    Mon: (r) => hasTag(r, '2 servings') || hasTag(r, '4 servings'),
    Wed: (r) => hasTag(r, '2 servings') || hasTag(r, '4 servings'),
    Fri: (r) => hasTag(r, '2 servings') || hasTag(r, '4 servings'),
    Sat: (r) => hasTag(r, 'kid friendly')
  };

  // Slow Cooker meals are restricted to Sun/Wed/Fri, kid-friendly meals are
  // restricted to Saturday only, and Date Night Default meals are restricted
  // to Thursday only — these apply on top of the day rules above, ruling
  // recipes OUT of days rather than requiring them.
  const CROCKPOT_DAYS = new Set(['Sun', 'Wed', 'Fri']);
  const passesExclusions = (r, dayKey) => {
    if (hasMethod(r, 'crockpot') && !CROCKPOT_DAYS.has(dayKey)) return false;
    if (hasTag(r, 'kid friendly') && dayKey !== 'Sat') return false;
    if (r.frequency === 'date-night' && dayKey !== 'Thu') return false;
    return true;
  };

  const isQuick = (r) => hasTag(r, 'quick');
  const MIN_QUICK = 2;        // at least this many "quick" dinners per week
  const BUILD_ATTEMPTS = 200; // random tries; the best-scoring week wins

  // Days already assigned (by hand or from a previous build) count toward
  // the no-repeat rule, the beef/pasta caps, and the quick minimum, same as
  // picks made below.
  const preChosen = new Set();
  let preBeef = 0, prePasta = 0, preQuick = 0;
  const openDays = [];
  DAY_KEYS.forEach(k => {
    const existing = days[k].dinner;
    if (!existing){ openDays.push(k); return; }
    if (DINNER_SPECIALS[existing]) return; // take out, fridge cleanout, other — stays as is
    preChosen.add(existing);
    const r = getRecipe(existing);
    if (r && hasTag(r, 'beef')) preBeef++;
    if (r && hasTag(r, 'pasta')) prePasta++;
    if (r && isQuick(r)) preQuick++;
  });
  if (!openDays.length) return; // every night is already set — nothing to build

  function shuffled(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // One random pass over the open days. Days are filled in a shuffled order
  // so the quick minimum doesn't always land on the last nights of the week.
  function attemptWeek(){
    const picks = {};
    const skipped = [];
    const chosen = new Set(preChosen);
    let beefCount = preBeef, pastaCount = prePasta, quickCount = preQuick;
    let rotationBreaks = 0;
    const order = shuffled(openDays);

    order.forEach((k, idx) => {
      const dayTagFilter = DAY_TAG_RULES[k];
      let base = recipes.filter(r => passesExclusions(r, k));
      if (dayTagFilter) base = base.filter(dayTagFilter);

      // Hard rules — never loosened: no meal repeats within the same week,
      // at most 2 beef dinners AND at most 2 pasta dinners per week (separate
      // caps; a recipe tagged both needs room under each).
      base = base.filter(r => !chosen.has(r.id));
      if (beefCount >= 2) base = base.filter(r => !hasTag(r, 'beef'));
      if (pastaCount >= 2) base = base.filter(r => !hasTag(r, 'pasta'));

      if (!base.length){
        // nothing at all fits this day — leave it empty
        skipped.push(k);
        return;
      }

      // The frequency rule (occasional = hasn't run in 3 weeks, biweekly =
      // hasn't run in 1) is preferred, but gets loosened as a last resort
      // rather than leaving the day empty — and when it does, a "quick"
      // recipe is preferred for the repeat.
      let candidates = base.filter(r => eligible(r));
      let usedFallback = false;
      if (!candidates.length){
        candidates = base;
        usedFallback = true;
      }

      // At least 2 "quick" dinners per week. Once the open nights left
      // (this one included) are only just enough to reach that, this night
      // has to be quick if anything quick fits it — even a quick recipe
      // that's ahead of its normal rotation.
      const quickNeeded = MIN_QUICK - quickCount;
      const openLeft = order.length - idx;
      if (quickNeeded > 0 && quickNeeded >= openLeft){
        const quickInRotation = candidates.filter(isQuick);
        const quickAny = base.filter(isQuick);
        if (quickInRotation.length) candidates = quickInRotation;
        else if (quickAny.length){ candidates = quickAny; usedFallback = true; }
      }

      let pool;
      if (usedFallback) {
        // Repeating a recipe ahead of its normal rotation — prefer a "quick" one.
        const quickOnes = candidates.filter(isQuick);
        pool = quickOnes.length ? quickOnes : candidates;
      } else {
        // "Current Favorite" recipes go in every week — if one fits this day's
        // rules and hasn't been placed yet, it wins the slot over everything else.
        const favorites = candidates.filter(r => r.frequency === 'current-favorite');
        pool = favorites.length ? favorites : candidates;
      }

      const pick = pool[Math.floor(Math.random() * pool.length)];
      picks[k] = pick.id;
      chosen.add(pick.id);
      if (usedFallback) rotationBreaks++;
      if (hasTag(pick, 'beef')) beefCount++;
      if (hasTag(pick, 'pasta')) pastaCount++;
      if (isQuick(pick)) quickCount++;
    });

    return { picks, skipped, quickCount, quickShort: Math.max(0, MIN_QUICK - quickCount), rotationBreaks };
  }

  // Keep the best of many random weeks: fewest empty nights first, then
  // closest to the quick minimum, then fewest recipes pulled ahead of their
  // rotation. Stops early once a week is perfect on all three.
  const worse = (a, b) =>
    a.skipped.length - b.skipped.length || a.quickShort - b.quickShort || a.rotationBreaks - b.rotationBreaks;
  let best = null;
  for (let i = 0; i < BUILD_ATTEMPTS; i++){
    const tryWeek = attemptWeek();
    if (!best || worse(tryWeek, best) < 0) best = tryWeek;
    if (!best.skipped.length && !best.quickShort && !best.rotationBreaks) break;
  }

  Object.entries(best.picks).forEach(([k, id]) => { days[k].dinner = id; });

  const plan = getPlan();
  plan[currentWeek] = days;
  saveJSON(PLAN_KEY, plan);
  render();

  const notes = [];
  if (best.skipped.length){
    const emptyDays = DAY_KEYS.filter(k => best.skipped.includes(k)).map(k => DAY_LABELS[k]);
    notes.push(`Left ${emptyDays.join(' & ')} empty — nothing fits without breaking a rule. Reminder: Sun/Tue need "6/8 servings," Mon/Wed/Fri need "2/4 servings," Sat needs "kid friendly," Thu needs "Repeat this: Date Night Default," slow cooker meals are Sun/Wed/Fri only, kid-friendly meals are Saturday only, Date Night Default meals are Thursday only, at most 2 meals can be beef and at most 2 can be pasta (separate caps), and no meal repeats in the same week. Add more matching recipes, or fill it in manually.`);
  }
  if (best.quickShort){
    notes.push(`Only ${best.quickCount} "quick" dinner${best.quickCount === 1 ? '' : 's'} this week — the goal is at least ${MIN_QUICK}, but no quick recipe fits the open nights without breaking a rule (a quick recipe still has to match that night's servings/kid-friendly rules and the beef/pasta caps). Tag more recipes "quick," or swap one in by hand.`);
  }
  if (notes.length) alert(notes.join('\n\n'));
}

// Works out each day's automatic lunch, which days each dinner's ticks are
// on, and each dinner's leftover servings. The rules are written up beside
// the real thing in /assets/pp-meals.js.
function computeLunches(days){ return PPMeals.computeLunches(days, getRecipe, getHousehold()); }

// Lunch rows that are showing the type-your-own box, as "week|day". A lunch
// with something typed always shows the box; this is for the ones opened
// with "Change" that are still empty. Not saved — it's only about the screen.
const lunchEditing = new Set();

const DAY_SHORT = { Sun:'Su', Mon:'Mo', Tue:'Tu', Wed:'We', Thu:'Th', Fri:'Fr', Sat:'Sa' };

// What to show in the box for a lunch that isn't automatic.
function lunchWords(day){ return PPMeals.lunchWords(day, getRecipe); }

function renderWeekPanel(){
  document.getElementById('weekLabel').textContent = fmtLabel(currentWeek);
  const days = getWeekDays(currentWeek);
  const recipes = getRecipes().sort((a,b) => a.name.localeCompare(b.name));
  const lunches = computeLunches(days);
  const wrap = document.getElementById('weekPanel');

  const recipeOptions = (selectedId) => recipes.map(r => `<option value="${r.id}" ${selectedId===r.id ? 'selected':''}>${escHtml(r.name)}${r.active === false ? ' (inactive)' : ''}</option>`).join('');
  const specialOption = (key, selected) => `<option value="${key}" ${selected === key ? 'selected' : ''}>${DINNER_SPECIALS[key]}${key === 'OTHER' ? '…' : ''}</option>`;

  wrap.innerHTML = DAY_KEYS.map((k, idx) => {
    const day = days[k];

    // ---- lunch: the automatic answer in words, or a box to type your own ----
    const typing = !!day.lunch || lunchEditing.has(currentWeek + '|' + k);
    const lunchRow = typing
      ? `<input type="text" class="lunch-text" data-day="${k}" maxlength="60" placeholder="What's for lunch?" aria-label="${DAY_LABELS[k]} lunch" value="${escHtml(lunchWords(day))}">
         <button type="button" class="btn secondary small lunch-auto-btn" data-day="${k}">Automatic</button>`
      : `<span class="lunch-auto" data-day="${k}"></span>
         <button type="button" class="btn secondary small lunch-change-btn" data-day="${k}">Change</button>`;

    // ---- dinner: a recipe, or one of the no-recipe nights ----
    const dinnerOptions = `<option value="">— empty —</option>`
      + ['TAKEOUT', 'CLEANOUT', 'OTHER'].map(key => specialOption(key, day.dinner)).join('')
      + (day.dinner === 'SKIP' ? specialOption('SKIP', day.dinner) : '') // only on weeks that already use it
      + recipeOptions(isRecipeChoice(day.dinner) ? day.dinner : null);
    const otherBox = day.dinner === 'OTHER'
      ? `<input type="text" class="dinner-other" data-day="${k}" maxlength="60" placeholder="What is it?" aria-label="${DAY_LABELS[k]} dinner, other" value="${escHtml(day.dinnerOther || '')}">`
      : '';

    // ---- which days this dinner makes lunch for ----
    const ticks = day.dinner ? `
        <div class="day-row">
          <div class="meal-label" aria-hidden="true"></div>
          <div class="lunch-for" role="group" aria-label="${DAY_LABELS[k]} dinner makes lunch for">
            <span class="lunch-for-caption">Makes lunch for</span>
            ${DAY_KEYS.map(d => `<label class="lf-day">${DAY_SHORT[d]}<input type="checkbox" class="lf-check" data-dinner="${k}" data-day="${d}" aria-label="${DAY_LABELS[d]}"></label>`).join('')}
            ${Array.isArray(day.lunchFor) ? `<button type="button" class="lf-reset" data-day="${k}" title="Go back to working it out from the recipe's servings">reset</button>` : ''}
            <span class="lf-left" data-dinner="${k}"></span>
          </div>
        </div>` : '';

    return `
      <div class="day-block">
        <div class="day-heading">${DAY_LABELS[k]}<span class="day-date">${new Date(addDays(currentWeek, idx) + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span></div>
        <div class="day-row">
          <div class="meal-label">Lunch</div>
          ${lunchRow}
        </div>
        <div class="day-row">
          <div class="meal-label">Dinner</div>
          <select class="day-select" data-day="${k}" aria-label="${DAY_LABELS[k]} dinner">${dinnerOptions}</select>
          ${otherBox}
        </div>${ticks}
      </div>
    `;
  }).join('');

  fillLunchInfo(lunches);

  // Picking a different dinner starts its lunch ticks over: they belonged to
  // the old meal.
  wrap.querySelectorAll('.day-select').forEach(sel => {
    sel.addEventListener('change', () => {
      updateDay(currentWeek, sel.dataset.day, { dinner: sel.value || null, dinnerOther: null, lunchFor: null });
      render();
      if (sel.value === 'OTHER'){
        const box = wrap.querySelector(`.dinner-other[data-day="${sel.dataset.day}"]`);
        if (box) box.focus();
      }
    });
  });

  // The two typing boxes save without redrawing the panel. Redrawing would
  // swap out whatever you were about to click next (the change fires as you
  // click away), and that click would be lost.
  wrap.querySelectorAll('.dinner-other').forEach(box => {
    box.addEventListener('change', () => {
      updateDay(currentWeek, box.dataset.day, { dinnerOther: box.value.trim() || null });
      fillLunchInfo();
    });
  });
  wrap.querySelectorAll('.lunch-text').forEach(box => {
    box.addEventListener('change', () => {
      const words = box.value.trim();
      // Emptied = back to automatic, but the box stays open until you leave it.
      lunchEditing.add(currentWeek + '|' + box.dataset.day);
      updateDay(currentWeek, box.dataset.day, words ? { lunch: 'OTHER', lunchText: words } : { lunch: null, lunchText: null });
      fillLunchInfo();
      renderPantryRail(); renderPantryList(); renderShopList(); // an older week's lunch recipe may have just come off
    });
    box.addEventListener('keydown', e => { if (e.key === 'Enter') box.blur(); });
  });

  wrap.querySelectorAll('.lunch-change-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      lunchEditing.add(currentWeek + '|' + btn.dataset.day);
      render();
      const box = wrap.querySelector(`.lunch-text[data-day="${btn.dataset.day}"]`);
      if (box) box.focus();
    });
  });
  wrap.querySelectorAll('.lunch-auto-btn').forEach(btn => {
    const backToAuto = () => {
      lunchEditing.delete(currentWeek + '|' + btn.dataset.day);
      updateDay(currentWeek, btn.dataset.day, { lunch: null, lunchText: null });
      render();
    };
    // mousedown, so it lands before the box next to it reacts to losing
    // focus and saves what was typed; click still covers the keyboard.
    btn.addEventListener('mousedown', e => { e.preventDefault(); backToAuto(); });
    btn.addEventListener('click', backToAuto);
  });

  // Ticking a day turns that dinner's days into exactly what's ticked.
  wrap.querySelectorAll('.lf-check').forEach(cb => {
    cb.addEventListener('change', () => {
      const k = cb.dataset.dinner;
      const ticked = Array.from(wrap.querySelectorAll(`.lf-check[data-dinner="${k}"]`))
        .filter(c => c.checked && !c.disabled).map(c => c.dataset.day);
      updateDay(currentWeek, k, { lunchFor: ticked });
      render();
    });
  });
  wrap.querySelectorAll('.lf-reset').forEach(btn => {
    btn.addEventListener('click', () => {
      updateDay(currentWeek, btn.dataset.day, { lunchFor: null });
      render();
    });
  });
}

// Writes the worked-out bits into the week panel that's already on screen:
// the automatic lunch words, each dinner's ticks (which are on, and which
// are greyed out and why), and how many leftover servings it has.
function fillLunchInfo(lunches){
  const days = getWeekDays(currentWeek);
  const info = lunches || computeLunches(days);
  const wrap = document.getElementById('weekPanel');
  DAY_KEYS.forEach((k, i) => {
    const words = wrap.querySelector(`.lunch-auto[data-day="${k}"]`);
    if (words){
      const none = info.labels[i] === '—';
      words.textContent = none ? 'Nothing carried over' : info.labels[i];
      words.classList.toggle('none', none);
    }

    wrap.querySelectorAll(`.lf-check[data-dinner="${k}"]`).forEach(cb => {
      const d = cb.dataset.day, j = DAY_KEYS.indexOf(d);
      const before = j <= i;                                    // not cooked yet on those days
      const takenBy = !before && info.owner[j] && info.owner[j] !== k ? info.owner[j] : null;
      const typed = !before && !!days[d].lunch;                 // that day's lunch was typed in
      cb.checked = info.feeds[k].includes(d);
      cb.disabled = before || !!takenBy || typed;
      cb.parentNode.classList.toggle('off', before);
      cb.parentNode.classList.toggle('taken', !!takenBy || typed);
      cb.parentNode.title = DAY_LABELS[d] + (
        before  ? ' — before this is cooked' :
        typed   ? ' — lunch is typed in for that day' :
        takenBy ? ` — already lunch from ${DAY_LABELS[takenBy]}'s ${dinnerName(days[takenBy])}` : '');
    });

    const left = wrap.querySelector(`.lf-left[data-dinner="${k}"]`);
    if (left){
      const l = info.leftovers[k];
      const servings = n => `${n} serving${n === 1 ? '' : 's'}`;
      left.classList.toggle('short', !!l && l.left < 0);
      left.textContent =
        !l            ? '' :                                   // take out, other… — no servings to count
        l.total === 0 ? 'No leftovers' :
        l.left < 0    ? `Leftovers: ${servings(-l.left)} short` :
                        `Leftovers: ${l.left} of ${servings(l.total)} left`;
    }
  });
}

/* ============ SHOPPING-LIST CATEGORIES ============
   THIS is the list to edit. Each grocery item on the shopping list is matched
   against the names below and filed under whichever category you put it in.
   To move an item, just move its name from one list to another — no other code
   needs to change. Matching is by whole words and ignores plurals, quantities,
   and units, so "6 oz of frozen corn" still finds "corn (frozen)".            */
const SHOPPING_CATEGORIES = {
  Produce:      ['asparagus','bell peppers','celery','corn (fresh)','green beans (fresh)','mushrooms','onion','spinach'],
  Meat:         ['beef chuck roast','chicken breast','chicken thighs','ground beef','ground turkey','kielbasa','pork shoulder'],
  Dairy:        ['butter','cream cheese','eggs','grated cheese','milk','shredded cheese','sliced cheese'],
  Refrigerated: ['desired pizza toppings','Garlic & Herb cream cheese','refrigerated pizza crust','salsa','sour cream'],
  Frozen:       ['corn (frozen)','frozen chicken fries','frozen Chinese chicken','frozen garlic bread','frozen hamburger patties','green beans (frozen)','zucchini fries'],
  Spices:       ['bay leaves','black pepper','chili powder','cumin','garlic powder','honey','Italian seasoning','onion soup mix','parsley','red pepper flakes','salt','seasoning of choice','taco seasoning','thyme'],
  Snacks:       ['potato chips','tortilla chips','variety chips'],
  Condiments:   ['BBQ sauce','bleu cheese dressing','desired burger toppings','Dijon mustard','honey mustard dressing','ketchup','mayo','relish','tomato paste','yellow mustard'],
  Pantry:       ['alfredo sauce','apple cider vinegar','baked beans','beef broth','black beans','bread','canned corn','cereal','chicken broth','cooking spray','cornstarch','cream of mushroom/chicken soup','egg noodles','garlic','gravy','Kraft Mac & Cheese','Nutella','olive oil','pasta','pasta sauce','peanut butter','pizza sauce','potatoes','ramen','red cooking wine','rice','soy sauce','taco sauce','tomato sauce','vegetable broth','Worcestershire sauce','wraps'],
};

// The order aisles appear in on the shopping list (roughly how you walk a store).
const CATEGORY_ORDER = ['Produce','Meat','Dairy','Refrigerated','Frozen','Pantry','Spices','Snacks','Condiments','Other'];

// On a tie — an item's name fully matches two different list entries with the
// same number of words — the category earlier in this list wins. (So "garlic
// salt" counts as Spices, not Pantry.)
const CATEGORY_TIE_PRIORITY = ['Frozen','Spices','Condiments','Snacks','Refrigerated','Meat','Dairy','Produce','Pantry'];

// A light safety net for recipe wording that doesn't appear in the lists above
// at all. You shouldn't need to touch this — the lists above are the real
// control. Anything that matches nothing here lands in "Other".
const CATEGORY_FALLBACK = {
  Frozen:     ['frozen','ice cream','sherbet','popsicle'],
  Spices:     ['pepper flakes','black pepper','ground pepper','seasoning','paprika','oregano','cinnamon','nutmeg','turmeric','bay leaf'],
  Condiments: ['mustard','ketchup','dressing','relish','mayo'],
  Snacks:     ['chips'],
  Pantry:     ['cream of','broth','stock','soup','sauce','cornstarch','peanut butter','egg noodle','vinegar','oil','flour','bean','pasta','noodle','rice','bread','cereal','tortilla','wrap'],
  Produce:    ['lettuce','onion','tomato','carrot','celery','spinach','mushroom','broccoli','zucchini','cabbage','pepper','corn','potato','apple','lemon','lime','garlic'],
  Meat:       ['chicken','beef','pork','turkey','sausage','bacon','steak','shrimp','fish','salmon','kielbasa','ham'],
  Dairy:      ['milk','cheese','butter','cream','yogurt','egg','parmesan','mozzarella','cheddar'],
};

// Words that carry no sorting meaning, stripped before matching.
const CATEGORY_STOPWORDS = new Set(['of','the','a','and','with','in','to','for','fat','free','condensed','desired','choice']);

function catSingular(w){
  if (w.length < 4) return w;
  if (/ies$/.test(w)) return w.slice(0,-3)+'y';
  if (/oes$/.test(w)) return w.slice(0,-2);
  if (/(s|x|z|ch|sh)es$/.test(w)) return w.slice(0,-2);
  if (/ss$/.test(w)) return w;
  if (/s$/.test(w)) return w.slice(0,-1);
  return w;
}
function catTokens(str){
  return [...new Set(
    String(str).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean)
      .map(catSingular).filter(t => t && !CATEGORY_STOPWORDS.has(t))
  )];
}

// Pre-tokenize the master list once
const CATEGORY_MASTER = [];
for (const [cat, items] of Object.entries(SHOPPING_CATEGORIES))
  for (const raw of items) CATEGORY_MASTER.push({ cat, toks: catTokens(raw) });

function catTieRank(c){ const i = CATEGORY_TIE_PRIORITY.indexOf(c); return i < 0 ? 99 : i; }

function categorize(name){
  const inSet = new Set(catTokens(name));
  let best = null;
  // An item matches a list entry when every word of that entry is present in
  // the item's name. The entry with the MOST matched words wins (so "garlic
  // powder" beats a bare "garlic"); ties break by CATEGORY_TIE_PRIORITY.
  for (const m of CATEGORY_MASTER){
    if (m.toks.length && m.toks.every(t => inSet.has(t))){
      if (!best
          || m.toks.length > best.toks.length
          || (m.toks.length === best.toks.length && catTieRank(m.cat) < catTieRank(best.cat))){
        best = m;
      }
    }
  }
  if (best) return best.cat;

  const n = name.toLowerCase();
  for (const c of ['Frozen','Spices','Condiments','Snacks','Pantry','Produce','Meat','Dairy']){
    if ((CATEGORY_FALLBACK[c] || []).some(w => n.includes(w))) return c;
  }
  return 'Other';
}
function norm(name){ return name.trim().toLowerCase().replace(/\s+/g,' '); }

// Where items land if they came from an older shape and aren't in the defaults
const LEGACY_GROUP_FALLBACK = {
  'Spices': 'Spices',
  'Fridge / Freezer': 'Fridge',
  'Pantry': 'Pantry'
};

const PANTRY_GROUP_NAMES = Object.keys(DEFAULT_PANTRY_GROUPS);

// Pantry used to be one flat array. If that's what's in Firestore, sort the
// defaults into their groups and keep anything you'd added by hand under Pantry.
function getPantryGroups(){
  const stored = loadJSON(PANTRY_ITEMS_KEY, null);
  const groups = {};
  PANTRY_GROUP_NAMES.forEach(g => groups[g] = []);

  // Which group does a known item belong to?
  const homeOf = {};
  PANTRY_GROUP_NAMES.forEach(g => DEFAULT_PANTRY_GROUPS[g].forEach(i => homeOf[norm(i)] = g));

  if (stored && !Array.isArray(stored) && typeof stored === 'object'
      && PANTRY_GROUP_NAMES.every(g => Array.isArray(stored[g]))){
    // Already in the current five-group shape
    PANTRY_GROUP_NAMES.forEach(g => groups[g] = stored[g].slice());
    return groups;
  }

  // Anything older: a flat array, or the earlier three-group object.
  // Known items go to their proper tab; anything added by hand follows its old group.
  const place = (item, fallback) => {
    const home = homeOf[norm(item)] || fallback;
    if (!groups[home].some(i => norm(i) === norm(item))) groups[home].push(item);
  };

  if (Array.isArray(stored)){
    PANTRY_GROUP_NAMES.forEach(g => DEFAULT_PANTRY_GROUPS[g].forEach(i => place(i, g)));
    stored.forEach(item => place(item, 'Pantry'));
  } else if (stored && typeof stored === 'object'){
    PANTRY_GROUP_NAMES.forEach(g => DEFAULT_PANTRY_GROUPS[g].forEach(i => place(i, g)));
    Object.keys(stored).forEach(oldGroup => {
      const fallback = LEGACY_GROUP_FALLBACK[oldGroup] || 'Pantry';
      (Array.isArray(stored[oldGroup]) ? stored[oldGroup] : []).forEach(item => place(item, fallback));
    });
  } else {
    PANTRY_GROUP_NAMES.forEach(g => groups[g] = DEFAULT_PANTRY_GROUPS[g].slice());
  }

  saveJSON(PANTRY_ITEMS_KEY, groups);
  return groups;
}
function getPantryItems(){
  const g = getPantryGroups();
  return PANTRY_GROUP_NAMES.flatMap(n => g[n]);
}
function removePantryItem(item){
  const groups = getPantryGroups();
  PANTRY_GROUP_NAMES.forEach(g => {
    groups[g] = groups[g].filter(i => norm(i) !== norm(item));
  });
  saveJSON(PANTRY_ITEMS_KEY, groups);
  // Drop it from every week's checked state too, so it can't linger on a shopping list
  const all = loadJSON(PANTRY_CHECKED_KEY, {});
  Object.keys(all).forEach(week => { delete all[week][item]; });
  saveJSON(PANTRY_CHECKED_KEY, all);
}
function addPantryItem(item, group){
  const groups = getPantryGroups();
  const target = PANTRY_GROUP_NAMES.includes(group) ? group : 'Pantry';
  if (!getPantryItems().some(i => norm(i) === norm(item))){
    groups[target].push(item);
    saveJSON(PANTRY_ITEMS_KEY, groups);
  }
}
function getPantryChecked(weekIso){
  const all = loadJSON(PANTRY_CHECKED_KEY, {});
  return all[weekIso] || {};
}
function setPantryChecked(weekIso, item, checked){
  const all = loadJSON(PANTRY_CHECKED_KEY, {});
  if (!all[weekIso]) all[weekIso] = {};
  all[weekIso][item] = checked;
  saveJSON(PANTRY_CHECKED_KEY, all);
}

function getWeekRecipesForMatching(){
  const days = getWeekDays(currentWeek);
  const dinnerRecipes = DAY_KEYS.map(k => days[k].dinner).filter(isRecipeChoice).map(getRecipe).filter(Boolean);
  // Only older weeks have a recipe picked for lunch — lunch is typed words now.
  const manualLunchRecipes = DAY_KEYS.map(k => days[k].lunch).filter(isRecipeChoice).map(getRecipe).filter(Boolean);
  return [...dinnerRecipes, ...manualLunchRecipes];
}

// Two grocery names are "the same item" only if they're the same words
// once normalized for case/whitespace/plurals — sharing a word isn't
// enough. A loose "does one contain the other" check used to make the
// pantry item "honey" swallow any recipe's "honey mustard", hiding a
// completely different product from the shopping list.
function sameGroceryItem(a, b){ return mergeKey(a) === mergeKey(b); }

// Matches this week's recipe ingredients against the pantry list by name.
// A match means: don't add it to the shopping list — just flag it in the
// Pantry sidebar so she can check her own stock instead.
function computeNeededPantryItems(){
  const pantryItems = getPantryItems();
  const recipes = getWeekRecipesForMatching();
  const needed = {}; // pantry item's mergeKey -> { name, recipes: Set }
  pantryItems.forEach(p => {
    const pKey = mergeKey(p);
    recipes.forEach(r => (r.ingredients||[]).forEach(ing => {
      if (sameGroceryItem(ing.name, p)){
        if (!needed[pKey]) needed[pKey] = { name: p, recipes: new Set() };
        needed[pKey].recipes.add(r.name);
      }
    }));
  });
  return needed;
}

let activePantryTab = PANTRY_GROUP_NAMES[0];

// One button per group down the right edge; each opens straight into its list.
function renderPantryRail(){
  const rail = document.getElementById('pantryRail');
  const groups = getPantryGroups();
  const checked = getPantryChecked(currentWeek);
  rail.innerHTML = PANTRY_GROUP_NAMES.map(g => {
    const due = (groups[g] || []).filter(i => checked[i]).length;
    return `<button class="pantry-tab-btn" data-group="${g}">${g}${due ? `<span class="rail-dot">${due}</span>` : ''}</button>`;
  }).join('');
  rail.querySelectorAll('.pantry-tab-btn').forEach(btn => btn.addEventListener('click', () => {
    openPantry(btn.dataset.group);
  }));
}

function renderPantryList(){
  const groups = getPantryGroups();
  const checked = getPantryChecked(currentWeek);
  const needed = computeNeededPantryItems();
  const wrap = document.getElementById('pantryList');
  document.getElementById('pantryTitle').textContent = activePantryTab;

  const items = (groups[activePantryTab] || []).slice().sort((a,b) => a.localeCompare(b));

  const rows = items.map(item => {
    const neededInfo = needed[mergeKey(item)];
    return `
    <div class="pantry-item ${checked[item] ? 'checked' : ''} ${neededInfo ? 'needed' : ''}">
      <input type="checkbox" data-item="${item}" ${checked[item] ? 'checked' : ''}>
      <div class="pantry-item-body">
        <label>${item}</label>
        ${neededInfo ? `<span class="needed-badge">needed for ${Array.from(neededInfo.recipes).join(', ')}</span>` : ''}
      </div>
      <button class="pantry-remove" data-remove="${item}" title="Remove ${item}" aria-label="Remove ${item}">&times;</button>
    </div>
  `;
  }).join('') || '<p class="empty">Nothing in here yet.</p>';

  wrap.innerHTML = `<p class="pantry-count">${items.length} item${items.length === 1 ? '' : 's'} · tick anything you need to buy</p>${rows}`;

  wrap.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => {
    setPantryChecked(currentWeek, cb.dataset.item, cb.checked);
    render();
  }));
  wrap.querySelectorAll('.pantry-remove').forEach(btn => btn.addEventListener('click', () => {
    removePantryItem(btn.dataset.remove);
    render();
  }));
}
document.getElementById('addPantryItemBtn').addEventListener('click', () => {
  const input = document.getElementById('newPantryItem');
  const item = input.value.trim();
  if (!item) return;
  addPantryItem(item, activePantryTab); // lands in whichever tab is open
  setPantryChecked(currentWeek, item, true); // adding it now means you need it now
  input.value = '';
  render();
});

const pantrySidebar = document.getElementById('pantrySidebar');
const pantryOverlay = document.getElementById('pantryOverlay');
function openPantry(group){
  if (group) activePantryTab = group;
  renderPantryList();
  pantrySidebar.classList.add('open');
  pantryOverlay.classList.add('open');
}
function closePantry(){ pantrySidebar.classList.remove('open'); pantryOverlay.classList.remove('open'); }
document.getElementById('pantryCloseBtn').addEventListener('click', closePantry);
pantryOverlay.addEventListener('click', closePantry);

// "cups" and "cup" are the same unit; "onions" and "onion" are the same thing.
// Without this the list ends up with three separate garlic lines.
const UNIT_ALIASES = {
  cups:'cup', tablespoon:'tbsp', tablespoons:'tbsp', tbsps:'tbsp',
  teaspoon:'tsp', teaspoons:'tsp', tsps:'tsp',
  pound:'lb', pounds:'lb', lbs:'lb', ounce:'oz', ounces:'oz',
  grams:'g', gram:'g', kilograms:'kg', kilogram:'kg',
  liters:'l', litres:'l', liter:'l', litre:'l',
  milliliters:'ml', millilitres:'ml',
  cloves:'clove', cans:'can', sticks:'stick', bunches:'bunch', pinches:'pinch'
};
function canonUnit(u){
  const c = (u || '').trim().toLowerCase();
  return UNIT_ALIASES[c] || c;
}
function singular(word){
  if (word.length < 4) return word;
  if (/ies$/.test(word)) return word.slice(0, -3) + 'y';
  if (/oes$/.test(word)) return word.slice(0, -2);          // tomatoes, potatoes
  if (/(s|x|z|ch|sh)es$/.test(word)) return word.slice(0, -2);
  if (/ss$/.test(word)) return word;
  if (/s$/.test(word)) return word.slice(0, -1);
  return word;
}
function mergeKey(name){
  return norm(name).split(' ').map(singular).join(' ');
}
function round2(n){ return Math.round(n * 100) / 100; }

// Abbreviations never pluralize — "3 tbsp", not "3 tbsps"
const PLURAL_UNITS = ['cup','clove','can','stick','bunch','pinch','slice','package','box','bag'];

// Turns { cup: 3, tbsp: 2 } into "3 cups + 2 tbsp"
function formatQty(units){
  const parts = Object.entries(units)
    .filter(([, qty]) => qty > 0)
    .map(([unit, qty]) => {
      const n = round2(qty);
      if (!unit) return String(n);
      const plural = n !== 1 && PLURAL_UNITS.includes(unit);
      return n + ' ' + (plural ? unit + 's' : unit);
    });
  if (!parts.length) return '';
  return parts.join(' + ');
}

function addToMap(map, name, qty, unit, source, extra){
  const u = canonUnit(unit);
  // "3 cloves garlic cloves" reads badly — drop the unit word off the name
  let display = String(name).trim();
  if (u){
    const words = display.split(' ');
    if (words.length > 1 && singular(words[words.length - 1].toLowerCase()) === u){
      display = words.slice(0, -1).join(' ');
    }
  }
  const key = mergeKey(display);
  if (!map[key]){
    map[key] = { name: display, units: {}, sources: new Set(), category: categorize(display), unlisted: false };
  }
  const entry = map[key];
  // Keep the shortest name — "onion" reads better than "onions, diced"
  if (display.length < entry.name.length) entry.name = display;
  const n = typeof qty === 'number' ? qty : parseFloat(qty);
  if (!isNaN(n) && n > 0){
    entry.units[u] = (entry.units[u] || 0) + n;
  } else {
    entry.unlisted = true;
  }
  entry.sources.add(source);
  if (extra) Object.assign(entry, extra);
  return entry;
}

function renderShopList(){
  const allRecipes = getWeekRecipesForMatching();
  const pantryKeys = getPantryItems().map(mergeKey);
  const matchesPantry = (ingName) => pantryKeys.includes(mergeKey(ingName));

  const map = {};

  // Everything this week's recipes call for, merged by ingredient
  allRecipes.forEach(r => (r.ingredients || []).forEach(ing => {
    if (matchesPantry(ing.name)) return; // flagged in the Pantry sidebar instead
    addToMap(map, ing.name, ing.qty, ing.unit, r.name);
  }));

  // Anything added by hand merges into the same lines
  const extrasAll = loadJSON(EXTRAS_KEY, {});
  const extras = extrasAll[currentWeek] || [];
  extras.forEach(ex => {
    addToMap(map, ex.name, ex.qty, ex.unit, 'Added by you');
  });

  // Pantry items ticked as "need to buy"
  const pantryChecked = getPantryChecked(currentWeek);
  Object.keys(pantryChecked).filter(item => pantryChecked[item]).forEach(item => {
    addToMap(map, item, null, '', 'Pantry');
  });

  const checkedAll = loadJSON(CHECKED_KEY, {});
  const checked = checkedAll[currentWeek] || {};

  const grouped = {};
  Object.entries(map).forEach(([key, item]) => {
    if (!grouped[item.category]) grouped[item.category] = [];
    grouped[item.category].push({ ...item, key, sources: Array.from(item.sources) });
  });

  const wrap = document.getElementById('shopList');
  const catRank = (c) => { const i = CATEGORY_ORDER.indexOf(c); return i < 0 ? CATEGORY_ORDER.length : i; };
  const cats = Object.keys(grouped).sort((a,b) => catRank(a) - catRank(b) || a.localeCompare(b));
  if (!cats.length){ wrap.innerHTML = '<p class="empty">Assign some dinners (or hit Build My Week) to generate a list.</p>'; return; }

  wrap.innerHTML = cats.map(cat => `
    <div class="shop-cat">
      <h4>${cat}</h4>
      ${grouped[cat].sort((a,b) => a.name.localeCompare(b.name)).map(item => {
        const qtyStr = formatQty(item.units);
        return `
        <div class="shop-item ${checked[item.key] ? 'checked':''}">
          <input type="checkbox" data-key="${item.key}" ${checked[item.key] ? 'checked':''}>
          <div>
            <label>${qtyStr ? `<span class="shop-qty">${qtyStr}</span> ` : ''}${item.name}</label>
            <small>${item.sources.join(', ')}</small>
          </div>
        </div>
      `;
      }).join('')}
    </div>
  `).join('');

  wrap.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => {
    const all = loadJSON(CHECKED_KEY, {});
    if (!all[currentWeek]) all[currentWeek] = {};
    all[currentWeek][cb.dataset.key] = cb.checked;
    saveJSON(CHECKED_KEY, all);
    renderShopList();
  }));
}

document.getElementById('addExBtn').addEventListener('click', () => {
  const name = document.getElementById('exName').value.trim();
  if (!name) return;
  const qty = document.getElementById('exQty').value.trim();
  const unit = document.getElementById('exUnit').value.trim();
  const all = loadJSON(EXTRAS_KEY, {});
  if (!all[currentWeek]) all[currentWeek] = [];
  all[currentWeek].push({ id: uid(), name, qty, unit });
  saveJSON(EXTRAS_KEY, all);
  document.getElementById('exName').value = '';
  document.getElementById('exQty').value = '';
  document.getElementById('exUnit').value = '';
  renderShopList();
});

document.getElementById('prevWeek').addEventListener('click', () => { currentWeek = addDays(currentWeek, -7); render(); });
document.getElementById('nextWeek').addEventListener('click', () => { currentWeek = addDays(currentWeek, 7); render(); });
document.getElementById('buildBtn').addEventListener('click', buildWeek);
document.getElementById('clearAllBtn').addEventListener('click', () => {
  if (!confirm('Clear every dinner and lunch assignment for this week? This won\'t touch your shopping list extras or pantry.')) return;
  const plan = getPlan();
  plan[currentWeek] = {};
  DAY_KEYS.forEach(k => plan[currentWeek][k] = { dinner: null, lunch: null });
  DAY_KEYS.forEach(k => lunchEditing.delete(currentWeek + '|' + k));
  saveJSON(PLAN_KEY, plan);
  render();
});

// The week as a plain table: one row a day, lunch and dinner in words. Only
// shown when printing (see .print-sheet in the styles above).
function renderPrintSheet(){
  const days = getWeekDays(currentWeek);
  const lunches = computeLunches(days);
  const cell = words => words ? escHtml(words) : '<span class="print-none">—</span>';
  const rows = DAY_KEYS.map((k, i) => {
    const day = days[k];
    const lunch = day.lunch ? lunchWords(day) : (lunches.labels[i] === '—' ? '' : lunches.labels[i]);
    const date = new Date(addDays(currentWeek, i) + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return `<tr><td class="print-day">${DAY_LABELS[k]}<small>${date}</small></td><td>${cell(lunch)}</td><td>${cell(dinnerName(day))}</td></tr>`;
  }).join('');
  document.getElementById('printSheet').innerHTML = `
    <h1>Meal Plan</h1>
    <p class="print-week">${fmtLabel(currentWeek)}</p>
    <table>
      <thead><tr><th>Day</th><th>Lunch</th><th>Dinner</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}
// Typed lunches and "Other" dinners save without a full redraw, so the sheet
// is rebuilt right before every print — the button's, or Ctrl+P.
window.addEventListener('beforeprint', renderPrintSheet);
document.getElementById('printBtn').addEventListener('click', () => {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // save a box still being typed in
  window.print();
});

function render(){ renderWeekPanel(); renderPantryRail(); renderPantryList(); renderShopList(); }
loadMealStateFromFirestore().then(render);
</script>
