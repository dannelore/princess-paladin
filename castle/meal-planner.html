<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Planner — Princess & Paladin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap');
@font-face{ font-family:'Apricot'; src:url('../fonts/Apricot.ttf') format('truetype'); font-display:swap; }

:root{
  --pink-bg:#F6D9E6; --pink-bg-soft:#F2C9DC; --pink-accent:#E87CA6; --pink-accent-deep:#D65F8E;
  --sage-deep:#7E9270; --cream:#FDF6EC; --ink:#4A3B41; --ink-soft:#7A6670;
}
*{ box-sizing:border-box; }
body{ margin:0; background:var(--pink-bg); color:var(--ink); font-family:'Jost',sans-serif; }
h1,h2,h3,h4{ font-family:'Cormorant Garamond',serif; font-weight:600; margin:0 0 .4em; }
.display{ font-family:'Apricot','Cormorant Garamond',serif; font-weight:400; }
.shell{ max-width:820px; margin:0 auto; padding:24px 18px 70px; }
.header{ text-align:center; padding:10px 0 20px; }
.back{ display:inline-block; margin-bottom:14px; font-size:.85rem; text-decoration:none; color:var(--ink-soft); border:1px solid var(--pink-accent); background:var(--cream); padding:6px 14px; border-radius:999px; }
.title{ font-size:2.3rem; margin:6px 0 2px; }
.tagline{ font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--ink-soft); margin:0; }
.weeknav{ display:flex; justify-content:center; align-items:center; gap:14px; margin-bottom:16px; }
.weeknav strong{ font-family:'Cormorant Garamond',serif; font-size:1.1rem; }
.btn{ font-family:'Jost',sans-serif; font-weight:500; border:none; border-radius:999px; padding:10px 20px; cursor:pointer; background:var(--pink-accent); color:#fff; font-size:.9rem; }
.btn:hover{ background:var(--pink-accent-deep); }
.btn.secondary{ background:transparent; color:var(--pink-accent-deep); border:1px solid var(--pink-accent); }
.btn.small{ padding:6px 14px; font-size:.8rem; }
.toolbar{ text-align:center; margin-bottom:20px; }
.panel{ background:var(--cream); border-radius:20px; padding:20px; box-shadow:0 6px 20px rgba(74,59,65,.12); margin-bottom:18px; }
.day-block{ padding:12px 0; border-bottom:1px solid var(--pink-bg-soft); }
.day-block:last-child{ border-bottom:none; }
.day-heading{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:1.05rem; margin-bottom:6px; }
.day-row{ display:flex; align-items:center; gap:12px; padding:4px 0; flex-wrap:wrap; }
.meal-label{ width:64px; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); }
.day-select, .lunch-select{ flex:1 1 220px; font-family:'Jost',sans-serif; font-size:.92rem; padding:8px 10px; border:1px solid var(--pink-bg-soft); border-radius:10px; background:#fff; }
.lunch-hint{ font-size:.76rem; color:var(--ink-soft); font-style:italic; padding-left:76px; margin:-2px 0 6px; }
.shop-cat{ margin-bottom:16px; }
.shop-cat h4{ color:var(--sage-deep); margin-bottom:6px; }
.shop-item{ display:flex; align-items:flex-start; gap:8px; padding:4px 0; font-size:.92rem; }
.shop-item.checked label{ text-decoration:line-through; color:var(--ink-soft); }
.shop-item small{ display:block; color:var(--ink-soft); font-size:.74rem; }
.addextra{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.addextra input{ flex:1 1 120px; font-family:'Jost',sans-serif; padding:8px 10px; border:1px solid var(--pink-bg-soft); border-radius:10px; }
.empty{ text-align:center; padding:20px; color:var(--ink-soft); font-style:italic; font-family:'Cormorant Garamond',serif; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <a class="back" href="../index.html">&larr; Back to the hub</a>
    <h1 class="title display">Meal Planner</h1>
    <p class="tagline">seven dinners, zero decision fatigue</p>
  </div>

  <div class="weeknav">
    <button class="btn secondary small" id="prevWeek">&larr; Prev</button>
    <strong id="weekLabel"></strong>
    <button class="btn secondary small" id="nextWeek">Next &rarr;</button>
  </div>

  <div class="toolbar">
    <button class="btn" id="buildBtn">🪄 Build My Week</button>
    <a class="btn secondary" href="../recipe-box/index.html" style="text-decoration:none; display:inline-block;">Open Recipe Box</a>
  </div>

  <div class="panel" id="weekPanel"></div>

  <div class="panel">
    <h2>Shopping List</h2>
    <p class="tagline" style="font-size:.85rem;">Built from this week's dinners — updates automatically.</p>
    <div id="shopList"></div>
    <div class="addextra">
      <input type="text" id="exName" placeholder="Add something else…">
      <input type="text" id="exQty" placeholder="qty" style="max-width:70px;">
      <input type="text" id="exUnit" placeholder="unit" style="max-width:90px;">
      <button class="btn small" id="addExBtn">Add</button>
    </div>
  </div>
</div>

<script>
const RECIPES_KEY = 'pp_recipes';
const PLAN_KEY = 'pp_mealplan';
const EXTRAS_KEY = 'pp_shopping_extras';
const CHECKED_KEY = 'pp_shopping_checked';
const DAY_KEYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_LABELS = { Sun:'Sunday', Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday', Sat:'Saturday' };

function loadJSON(key, fallback){ try{ return JSON.parse(localStorage.getItem(key)) ?? fallback; }catch(e){ return fallback; } }
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
function uid(){ return 'x_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function getRecipes(){ return loadJSON(RECIPES_KEY, []); }
function getRecipe(id){ return getRecipes().find(r => r.id === id); }

function getHousehold(){ return 2; } // always 2 people

function weekStartOf(date){
  const d = new Date(date); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay());
  return d.toISOString().slice(0,10);
}
function addDays(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtLabel(iso){
  const start = new Date(iso+'T00:00:00'); const end = new Date(start); end.setDate(end.getDate()+6);
  const o = { month:'short', day:'numeric' };
  return `${start.toLocaleDateString(undefined,o)} – ${end.toLocaleDateString(undefined,o)}`;
}

let currentWeek = weekStartOf(new Date());

function getPlan(){ return loadJSON(PLAN_KEY, {}); }
function normalizeDay(val){
  if (val && typeof val === 'object') return { dinner: val.dinner ?? null, lunch: val.lunch ?? null };
  return { dinner: val ?? null, lunch: null }; // legacy format: bare dinner value
}
function getWeekDays(iso){
  const plan = getPlan();
  let changed = false;
  if (!plan[iso]){
    plan[iso] = {}; DAY_KEYS.forEach(k => plan[iso][k] = { dinner: null, lunch: null }); changed = true;
  } else {
    DAY_KEYS.forEach(k => {
      const normalized = normalizeDay(plan[iso][k]);
      if (JSON.stringify(normalized) !== JSON.stringify(plan[iso][k])){ plan[iso][k] = normalized; changed = true; }
    });
  }
  if (changed) saveJSON(PLAN_KEY, plan);
  return plan[iso];
}
function setDay(iso, dayKey, field, value){
  const plan = getPlan();
  if (!plan[iso]) getWeekDays(iso);
  const plan2 = getPlan();
  plan2[iso][dayKey] = normalizeDay(plan2[iso][dayKey]);
  plan2[iso][dayKey][field] = value;
  saveJSON(PLAN_KEY, plan2);
}

function history(beforeWeekIso){
  const plan = getPlan();
  const entries = [];
  Object.keys(plan).forEach(w => {
    if (w >= beforeWeekIso) return;
    DAY_KEYS.forEach(k => {
      const day = normalizeDay(plan[w][k]);
      if (day.dinner && day.dinner !== 'SKIP') entries.push({ week: w, recipeId: day.dinner });
    });
  });
  return entries;
}

function buildWeek(){
  const recipes = getRecipes();
  if (!recipes.length){ alert('Add some recipes in the Recipe Box first!'); return; }

  const days = getWeekDays(currentWeek);
  const hist = history(currentWeek);
  const usedLastWeek = new Set(hist.filter(h => h.week >= addDays(currentWeek, -7)).map(h => h.recipeId));
  const usedLast3 = new Set(hist.filter(h => h.week >= addDays(currentWeek, -21)).map(h => h.recipeId));

  const eligible = (r) => {
    if (r.frequency === 'biweekly') return !usedLastWeek.has(r.id);
    if (r.frequency === 'occasional') return !usedLast3.has(r.id);
    return true;
  };

  // Sunday & Tuesday are batch-cook nights that need to stretch into lunches,
  // so they're restricted to recipes tagged for a big enough batch.
  const hasTag = (r, tag) => (r.tags || []).includes(tag);
  const DAY_TAG_RULES = {
    Tue: (r) => hasTag(r, '6 servings'),
    Sun: (r) => hasTag(r, '6 servings') || hasTag(r, '8 servings')
  };

  const chosen = new Set();
  const skippedForNoMatch = [];

  DAY_KEYS.forEach(k => {
    const existing = days[k].dinner;
    if (existing) return; // already set (recipe id or SKIP) — leave it alone

    const dayTagFilter = DAY_TAG_RULES[k];
    const base = dayTagFilter ? recipes.filter(dayTagFilter) : recipes;

    let candidates = base.filter(r => eligible(r) && !chosen.has(r.id));
    if (!candidates.length) candidates = base.filter(r => !chosen.has(r.id));
    if (!candidates.length) candidates = base;

    if (!candidates.length){
      // no recipe carries the required tag for this day — leave it empty rather than break the rule
      if (dayTagFilter) skippedForNoMatch.push(DAY_LABELS[k]);
      return;
    }

    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    days[k].dinner = pick.id;
    chosen.add(pick.id);
  });

  const plan = getPlan();
  plan[currentWeek] = days;
  saveJSON(PLAN_KEY, plan);
  render();

  if (skippedForNoMatch.length){
    alert(`Left ${skippedForNoMatch.join(' & ')} empty — no recipe tagged for that batch size yet. Tag a recipe "6 servings" or "8 servings" in the Recipe Box, or fill it in manually.`);
  }
}

// Figures out, for each day, whether lunch is leftovers — and from which dinner.
// A dinner's leftover portions = servings - household (what's eaten at dinner).
// Each lunch day eats `household` portions from that leftover pool, starting the
// day right after that dinner. A closer/more recent dinner's leftovers take
// priority over an older one if their ranges overlap.
function computeLunches(days){
  const household = getHousehold();
  const lunch = new Array(7).fill('—');

  DAY_KEYS.forEach((k, i) => {
    const val = days[k].dinner;
    if (!val || val === 'SKIP') return;
    const r = getRecipe(val);
    if (!r) return;
    const servings = Number(r.servings) || 0;
    const leftoverPortions = Math.max(0, servings - household);
    const leftoverDays = Math.floor(leftoverPortions / household);
    for (let offset = 1; offset <= leftoverDays; offset++){
      const targetIndex = i + offset;
      if (targetIndex > 6) break; // doesn't carry into next week
      lunch[targetIndex] = `Leftovers — ${r.name}`;
    }
  });

  return lunch;
}

function renderWeekPanel(){
  document.getElementById('weekLabel').textContent = fmtLabel(currentWeek);
  const days = getWeekDays(currentWeek);
  const recipes = getRecipes().sort((a,b) => a.name.localeCompare(b.name));
  const autoLunches = computeLunches(days);
  const wrap = document.getElementById('weekPanel');

  const recipeOptions = (selectedId) => recipes.map(r => `<option value="${r.id}" ${selectedId===r.id ? 'selected':''}>${r.name}</option>`).join('');

  wrap.innerHTML = DAY_KEYS.map((k, idx) => {
    const day = days[k];
    const lunchOptions = `<option value="">Auto (leftovers)</option><option value="SKIP" ${day.lunch==='SKIP'?'selected':''}>Not eating lunch / other</option>` + recipeOptions(day.lunch && day.lunch !== 'SKIP' ? day.lunch : null);
    const dinnerOptions = `<option value="">— empty —</option><option value="SKIP" ${day.dinner==='SKIP'?'selected':''}>Eating out / other</option>` + recipeOptions(day.dinner && day.dinner !== 'SKIP' ? day.dinner : null);

    const showAutoHint = !day.lunch; // only when left on Auto
    return `
      <div class="day-block">
        <div class="day-heading">${DAY_LABELS[k]}</div>
        <div class="day-row">
          <div class="meal-label">Lunch</div>
          <select class="lunch-select" data-day="${k}">${lunchOptions}</select>
        </div>
        ${showAutoHint ? `<div class="lunch-hint">${autoLunches[idx]}</div>` : ''}
        <div class="day-row">
          <div class="meal-label">Dinner</div>
          <select class="day-select" data-day="${k}">${dinnerOptions}</select>
        </div>
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('.day-select').forEach(sel => {
    sel.addEventListener('change', () => {
      setDay(currentWeek, sel.dataset.day, 'dinner', sel.value || null);
      render();
    });
  });
  wrap.querySelectorAll('.lunch-select').forEach(sel => {
    sel.addEventListener('change', () => {
      setDay(currentWeek, sel.dataset.day, 'lunch', sel.value || null);
      render();
    });
  });
}

const CATEGORY_KEYWORDS = {
  Produce: ['lettuce','onion','garlic','tomato','pepper','carrot','celery','potato','spinach','kale','herb','basil','cilantro','parsley','lemon','lime','apple','avocado','mushroom','broccoli','cucumber','zucchini','ginger','scallion','cabbage','corn','squash'],
  Meat: ['chicken','beef','pork','turkey','sausage','bacon','steak','shrimp','fish','salmon','tilapia','ham'],
  Dairy: ['milk','cheese','butter','cream','yogurt','sour cream','egg','parmesan','mozzarella','cheddar'],
  Frozen: ['frozen'],
  Pantry: ['flour','sugar','rice','pasta','oil','vinegar','sauce','broth','stock','bean','can','spice','salt','baking','bread','tortilla']
};
function categorize(name){
  const n = name.toLowerCase();
  for (const [cat, words] of Object.entries(CATEGORY_KEYWORDS)) if (words.some(w => n.includes(w))) return cat;
  return 'Other';
}
function norm(name){ return name.trim().toLowerCase().replace(/\s+/g,' '); }

function renderShopList(){
  const days = getWeekDays(currentWeek);
  const dinnerRecipes = DAY_KEYS.map(k => days[k].dinner).filter(v => v && v !== 'SKIP').map(getRecipe).filter(Boolean);
  const manualLunchRecipes = DAY_KEYS.map(k => days[k].lunch).filter(v => v && v !== 'SKIP').map(getRecipe).filter(Boolean);
  const allRecipes = [...dinnerRecipes, ...manualLunchRecipes];

  const map = {};
  allRecipes.forEach(r => (r.ingredients||[]).forEach(ing => {
    const key = norm(ing.name) + '|' + (ing.unit||'');
    if (!map[key]) map[key] = { name: ing.name, unit: ing.unit||'', qty:0, sources:new Set(), category: categorize(ing.name) };
    if (typeof ing.qty === 'number') map[key].qty += ing.qty;
    map[key].sources.add(r.name);
  }));

  const extrasAll = loadJSON(EXTRAS_KEY, {});
  const extras = extrasAll[currentWeek] || [];
  extras.forEach(ex => {
    const key = 'manual_' + ex.id;
    map[key] = { name: ex.name, unit: ex.unit||'', qty: ex.qty||'', sources: new Set(['Added by you']), category: categorize(ex.name), manual:true, id: ex.id };
  });

  const checkedAll = loadJSON(CHECKED_KEY, {});
  const checked = checkedAll[currentWeek] || {};

  const grouped = {};
  Object.entries(map).forEach(([key, item]) => {
    if (!grouped[item.category]) grouped[item.category] = [];
    grouped[item.category].push({ ...item, key, sources: Array.from(item.sources) });
  });

  const wrap = document.getElementById('shopList');
  const cats = Object.keys(grouped).sort();
  if (!cats.length){ wrap.innerHTML = '<p class="empty">Assign some dinners (or hit Build My Week) to generate a list.</p>'; return; }

  wrap.innerHTML = cats.map(cat => `
    <div class="shop-cat">
      <h4>${cat}</h4>
      ${grouped[cat].map(item => `
        <div class="shop-item ${checked[item.key] ? 'checked':''}">
          <input type="checkbox" data-key="${item.key}" ${checked[item.key] ? 'checked':''}>
          <div>
            <label>${item.qty ? Math.round(item.qty*100)/100 + ' ' : ''}${item.unit||''} ${item.name}</label>
            <small>${item.sources.join(', ')}</small>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');

  wrap.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => {
    const all = loadJSON(CHECKED_KEY, {});
    if (!all[currentWeek]) all[currentWeek] = {};
    all[currentWeek][cb.dataset.key] = cb.checked;
    saveJSON(CHECKED_KEY, all);
    renderShopList();
  }));
}

document.getElementById('addExBtn').addEventListener('click', () => {
  const name = document.getElementById('exName').value.trim();
  if (!name) return;
  const qty = document.getElementById('exQty').value.trim();
  const unit = document.getElementById('exUnit').value.trim();
  const all = loadJSON(EXTRAS_KEY, {});
  if (!all[currentWeek]) all[currentWeek] = [];
  all[currentWeek].push({ id: uid(), name, qty, unit });
  saveJSON(EXTRAS_KEY, all);
  document.getElementById('exName').value = '';
  document.getElementById('exQty').value = '';
  document.getElementById('exUnit').value = '';
  renderShopList();
});

document.getElementById('prevWeek').addEventListener('click', () => { currentWeek = addDays(currentWeek, -7); render(); });
document.getElementById('nextWeek').addEventListener('click', () => { currentWeek = addDays(currentWeek, 7); render(); });
document.getElementById('buildBtn').addEventListener('click', buildWeek);

function render(){ renderWeekPanel(); renderShopList(); }
render();
</script>
</body>
</html>
